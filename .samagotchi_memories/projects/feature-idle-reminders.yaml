title: Periodic Reminders — pull-based, single-threaded reminder injection
description: Allow the agent to register periodic reminders (e.g. "check API health every 5 minutes") that the harness triggers a turn for when due, even with no user input. Pull-based, single-threaded design: no auto-turn from background thread.
clarification:
  - [Q] How does the harness trigger a turn? → Pull-based: TerminalUI checks before Reline.readline, SessionManager checks in its 1s poll loop. If due + idle 60s, harness triggers a turn (TerminalUI: prefill/synthetic input; SessionManager: write __REMINDER__.txt via write_turn_input).
  - [Q] Should reminders be per-session or cross-session? → Per-session (in-memory, cleared on session end). Cross-session persistence can be added later via memory writes.
  - [Q] How is this different from IdleRecap? → IdleRecap: harness→user (terminal display only, no conversation mutation). Reminders: harness→agent (into conversation, triggers model call). Different direction, different mutation target.
  - [Q] Why pull-based? → Opencode found TOCTOU race with background thread auto-turning. Pull-based keeps everything on the main thread, reuses existing IPC for SessionManager, matches IdleRecap pattern.
  - [Q] What happens when a reminder is due? → Harness triggers a turn (via synthetic input). Engine injects [SYSTEM: REMINDERS DUE] into conversation. Agent sees it, acts on it. Reminder stays registered.
requirements:
  - Agent can register a reminder with: name, description, interval_minutes, action (guidance)
  - Agent can cancel a reminder by name
  - Agent can list active reminders
  - ReminderStore tracks all registered reminders (name, description, interval_minutes, action, next_fire_at, last_fire_at)
  - ReminderStore#due_reminders returns ALL due reminders (not just 1)
  - Engine#maybe_inject_reminders called synchronously at top of run_turn (before set_turn_running(true))
  - Engine injects due reminders as [SYSTEM:] messages into conversation
  - Engine marks reminders as fired atomically under one ReminderStore lock
  - TerminalUI: check for due reminders before Reline.readline (or in idle path), trigger synthetic input if due
  - SessionManager: check in existing 1s poll loop, write __REMINDER__.txt via write_turn_input if due
  - Reminders fire on every interval until canceled or session ends
  - Agent sees reminders in context, acts on them (runs checks, etc.)
  - Engine-owned: no terminal coupling
  - Single-threaded: no background thread spawning turns
  - Error isolation: failed turns never crash the session
  - All existing tests still pass
