# RuboCop for samagotchi. Agents write most of this code, so the rules are
# there to keep it consistent, not to guard it: every enabled Style/Layout
# cop follows the code's own majority style and is safely autocorrectable
# (`bundle exec rubocop -a` fixes it, no hand re-editing). A cop that is not
# autocorrectable stays on only when it finds real bugs (Lint, Security, the
# RSpec checks for specs that can't fail). Line length, Metrics and naming
# taste are off. Run `bundle exec rake lint` (CI does).

plugins:
  - rubocop-performance
  - rubocop-rspec

# Our own cops (rubocop/): the only non-style rules of the repo's own, for a
# pattern no stock cop sees (a spec that sleeps to wait, a wait that times
# out naming nothing, a rescue that drops an error silently). docs/testing.md,
# "Waiting and time".
require:
  - ./rubocop/samagotchi.rb

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - node_modules/**/*
    - tmp/**/*
    - vendor/**/*
    - pkg/**/*
    # Test data: fixture bundles carry recorded sha256s, some code is broken
    # on purpose.
    - spec/fixtures/**/*

# -- The house style ---------------------------------------------------------

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Endless defs, multi-line ones included, are the house idiom.
Style/EndlessMethod:
  EnforcedStyle: allow_always

Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent

Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

# Keyword arguments line up with the first argument (ArgumentAlignment),
# not with the first key.
Layout/HashAlignment:
  EnforcedLastArgumentHashStyle: ignore_implicit

# A first argument on its own line is indented one step, like the rest.
Layout/FirstArgumentIndentation:
  EnforcedStyle: consistent

# Chains and continued strings are both aligned and indented here: no
# majority to follow.
Layout/MultilineMethodCallIndentation:
  Enabled: false

Layout/LineEndStringConcatenationIndentation:
  Enabled: false

# A Struct/Data member named count, length, method or drop is meant.
Lint/StructNewOverride:
  Enabled: false

# ModelBackend is an abstract base without an initialize.
Lint/MissingSuper:
  AllowedParentClasses:
    - ModelBackend

# One-liners like `{ a; b }` read fine; a trailing `;` is still flagged.
Style/Semicolon:
  AllowAsExpressionSeparator: true

# An `else nil` with a comment documents the case; only an empty else goes.
Style/EmptyElse:
  EnforcedStyle: empty

# -- Off: a refactor or taste, not lint, and not autocorrectable ----------------

Layout/LineLength:
  Enabled: false

# Hand-aligned tables and trailing comments are kept loosely; the autocorrect
# flattens single rows and leaves them worse.
Layout/ExtraSpacing:
  Enabled: false

Metrics:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Style/FetchEnvVar:
  Enabled: false

Style/RescueModifier:
  Enabled: false

Style/StringConcatenation:
  Enabled: false

Style/MultilineBlockChain:
  Enabled: false

Style/GlobalVars:
  Enabled: false

Style/SafeNavigationChainLength:
  Enabled: false

Style/OneClassPerFile:
  Enabled: false

Style/OptionalBooleanParameter:
  Enabled: false

# %{marker}-style placeholders here are our own templates, not format strings.
Style/FormatStringToken:
  Enabled: false

# `warn` is not `$stderr.puts` in a class with its own #warn (Log has one).
Style/StderrPuts:
  Enabled: false

# $1 reads better than ::Regexp.last_match(1).
Style/PerlBackrefs:
  Enabled: false

# `!!x` is deliberate boolean coercion; the autocorrect (`!x.nil?`) turns
# false into true.
Style/DoubleNegation:
  Enabled: false

Naming/MethodParameterName:
  Enabled: false

Naming/PredicateMethod:
  Enabled: false

Naming/PredicatePrefix:
  Enabled: false

Naming/VariableNumber:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

Naming/MemoizedInstanceVariableName:
  Enabled: false

Performance/CollectionLiteralInLoop:
  Enabled: false

# Off: wrong here. ConstantRegexp adds /o, which freezes a regexp built
# from a constant a spec may stub (VERSION). StringIdentifierArgument turns
# the plugin API's sessions.send("id", text) into a symbol. MapCompact's
# filter_map also drops false; Detect, RedundantMerge and Count read worse
# and only autocorrect with -A.
Performance/ConstantRegexp:
  Enabled: false

Performance/StringIdentifierArgument:
  Enabled: false

Performance/MapCompact:
  Enabled: false

Performance/Detect:
  Enabled: false

Performance/RedundantMerge:
  Enabled: false

Performance/Count:
  Enabled: false

# Reviewed: exact equivalents (\z and \A only, with the default
# SafeMultiline), so `rubocop -a` applies them.
Performance/TimesMap:
  Safe: true
  SafeAutoCorrect: true

Performance/DeleteSuffix:
  Safe: true
  SafeAutoCorrect: true

Performance/DeletePrefix:
  Safe: true
  SafeAutoCorrect: true

Performance/EndWith:
  Safe: true
  SafeAutoCorrect: true

Performance/RedundantEqualityComparisonBlock:
  Safe: true
  SafeAutoCorrect: true

# Constants after `private` and spec helper classes: no bug.
Lint/UselessConstantScoping:
  Enabled: false

Lint/ConstantDefinitionInBlock:
  Enabled: false

# Parallel branches (rescue arms, parsers) are intentional.
Lint/DuplicateBranch:
  Enabled: false

Lint/NoReturnInBeginEndBlocks:
  Enabled: false

# Dir.glob already sorts, but per directory as it walks, which is not the
# order of .sort on whole paths ("a-b" < "a/b").
Lint/RedundantDirGlobSort:
  Enabled: false

# No fiber scheduler here, and wait_readable returns something else.
Lint/IncompatibleIoSelectWithFiberScheduler:
  Enabled: false

# Reviewed: the parentheses change nothing, and rm_f/rm_rf already ignore a
# missing path, so `rubocop -a` applies them.
Lint/AmbiguousRange:
  Safe: true
  SafeAutoCorrect: true

Lint/NonAtomicFileOperation:
  Safe: true
  SafeAutoCorrect: true

# An unused keyword in a stub's block pins the stubbed signature.
Lint/UnusedBlockArgument:
  AllowUnusedKeywordArguments: true

Lint/UnusedMethodArgument:
  AllowUnusedKeywordArguments: true

Lint/EmptyBlock:
  Exclude:
    - spec/**/*
    - lib/samagotchi/bundles/*/spec/**/*

# -- Off: unsafe autocorrect ----------------------------------------------------
# These only autocorrect with -A, and the rewrite changes behaviour when the
# receiver is not the type the cop assumes: `x&.foo` for `x && x.foo` when x
# can be false, `lambda(&:save)` (an error since Ruby 3.3), Hash#slice on an
# array of pairs, `join` flattening nested arrays, `cond ? true : false`
# losing its boolean, STDIN vs $stdin. An agent's `rubocop -a` can't fix them,
# so they would only mean hand edits.

Style/AccessModifierDeclarations:
  Enabled: false

Style/ArrayIntersect:
  Enabled: false

Style/ComparableBetween:
  Enabled: false

Style/ConcatArrayLiterals:
  Enabled: false

Style/EnvHome:
  Enabled: false

Style/FileNull:
  Enabled: false

Style/GlobalStdStream:
  Enabled: false

Style/HashEachMethods:
  Enabled: false

Style/HashExcept:
  Enabled: false

Style/HashSlice:
  Enabled: false

Style/IfWithBooleanLiteralBranches:
  Enabled: false

Style/InverseMethods:
  Enabled: false

Style/MapJoin:
  Enabled: false

Style/MapToHash:
  Enabled: false

Style/MutableConstant:
  Enabled: false

Style/NumericPredicate:
  Enabled: false

Style/PredicateWithKind:
  Enabled: false

Style/ReduceToHash:
  Enabled: false

Style/RedundantArgument:
  Enabled: false

Style/RedundantEach:
  Enabled: false

Style/SafeNavigation:
  Enabled: false

Style/SelectByKind:
  Enabled: false

Style/SelectByRange:
  Enabled: false

Style/SelectByRegexp:
  Enabled: false

Style/SpecialGlobalVars:
  Enabled: false

Style/SymbolProc:
  Enabled: false

# Reviewed: safe here, so `rubocop -a` applies them.
Style/RaiseArgs:
  SafeAutoCorrect: true

# -- RSpec: taste off, the checks for broken specs on ----------------------------

# The waits that fail their example when the state never comes count as its
# expectation (RSpec/NoExpectationExample): a wait_for as an example's last
# line checks something. The gem merges these with its own list.
RSpec:
  Language:
    Expectations:
      - wait_for
      - eventually
      - join!
      - pop!

RSpec/MultipleExpectations:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/InstanceVariable:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/SpecFilePathFormat:
  Enabled: false

RSpec/DescribeClass:
  Enabled: false

RSpec/VerifiedDoubles:
  Enabled: false

RSpec/NamedSubject:
  Enabled: false

RSpec/MessageSpies:
  Enabled: false

RSpec/ReceiveMessages:
  Enabled: false

RSpec/DescribeMethod:
  Enabled: false

RSpec/AnyInstance:
  Enabled: false

RSpec/MultipleDescribes:
  Enabled: false

RSpec/ContextWording:
  Enabled: false

RSpec/NestedGroups:
  Enabled: false

RSpec/IndexedLet:
  Enabled: false

RSpec/ExpectOutput:
  Enabled: false

RSpec/BeforeAfterAll:
  Enabled: false

RSpec/StubbedMock:
  Enabled: false

RSpec/ExpectInHook:
  Enabled: false

RSpec/LeakyConstantDeclaration:
  Enabled: false

RSpec/LeakyLocalVariable:
  Enabled: false

RSpec/RemoveConst:
  Enabled: false

RSpec/Output:
  Enabled: false

# `expect(x.empty?).to be(true)` → `be_empty` loosens the check (truthy).
RSpec/PredicateMatcher:
  Enabled: false

# Reviewed: safe here (a wrong described_class fails its own spec; be(true)
# is eq(true) for true, false and nil), so `rubocop -a` applies them.
RSpec/DescribedClass:
  SafeAutoCorrect: true

RSpec/BeEq:
  Safe: true
  SafeAutoCorrect: true

# -- samagotchi's own cops ---------------------------------------------------

# A sleep that waits for something, a wait that names nothing when it times
# out: docs/testing.md, "Waiting and time", for the tags that allow one.
Samagotchi/SpecSleep:
  Enabled: true
  Include:
    - spec/**/*
    - lib/samagotchi/bundles/*/spec/**/*
  Exclude:
    # The helpers' own poll interval.
    - spec/support/waiting.rb

Samagotchi/SilentWait:
  Enabled: true
  Include:
    - spec/**/*
    - lib/samagotchi/bundles/*/spec/**/*

# A rescue whose fallback is a bare literal (nil, [], {}…) drops the error
# with no trace: Degrade.call(area, event, fallback:) { … } logs it once
# (docs/internals/engine.md, Degrading). A silence that is right carries
# "# degrade-ok: why".
Samagotchi/SilentRescue:
  Enabled: true
  Include:
    - lib/**/*.rb
  Exclude:
    - lib/samagotchi/bundles/*/spec/**/*
    # The files that had silent rescues when the cop came: shrink this list,
    # never grow it. A file here is exempt whole, so a new silent rescue in
    # it goes unflagged too; convert the file and take it off the list.
    - lib/samagotchi/answer_refs.rb
