name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rspec:
    name: rspec (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true # bundle install from the committed Gemfile.lock
      # parallel_rspec groups the spec files by the runtimes the last run
      # logged (.rspec_parallel's RuntimeLogger), restored from the latest
      # main run's cache; without one it groups them by file size.
      - name: Restore the spec runtime log
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/parallel_runtime_rspec.log
          key: parallel-runtime-${{ runner.os }}-ruby-${{ matrix.ruby }}-${{ github.run_id }}
          restore-keys: parallel-runtime-${{ runner.os }}-ruby-${{ matrix.ruby }}-
      - name: Specs (:integration and :macos_build skip themselves)
        run: bundle exec parallel_rspec -n 4
      - name: Save the spec runtime log (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/parallel_runtime_rspec.log
          key: parallel-runtime-${{ runner.os }}-ruby-${{ matrix.ruby }}-${{ github.run_id }}

  rspec-macos:
    # The desktop helper and pbpaste paths are macOS-only.
    name: rspec (macOS, Ruby 3.4)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # parallel_rspec groups the spec files by the runtimes the last run
      # logged (.rspec_parallel's RuntimeLogger), restored from the latest
      # main run's cache; without one it groups them by file size.
      - name: Restore the spec runtime log
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/parallel_runtime_rspec.log
          key: parallel-runtime-${{ runner.os }}-ruby-3.4-${{ github.run_id }}
          restore-keys: parallel-runtime-${{ runner.os }}-ruby-3.4-
      - name: Specs (:integration and :macos_build skip themselves)
        run: bundle exec parallel_rspec -n 3
      - name: Save the spec runtime log (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/parallel_runtime_rspec.log
          key: parallel-runtime-${{ runner.os }}-ruby-3.4-${{ github.run_id }}

  lint:
    name: rubocop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: RuboCop (.rubocop.yml; TargetRubyVersion 3.3)
        run: bundle exec rake lint

  bundles:
    name: bundles:check
    runs-on: ubuntu-latest
    steps:
      # The full history and tags: the version check diffs each bundle
      # against the last v* tag (a shallow clone has none and skips it).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # Sha lines strict for every bundle; a bundle changed since the last
      # tag needs a higher version, the system bundle aside (release:bump
      # moves it with VERSION). The release workflow runs the full check.
      - name: Bundle manifests (rake 'bundles:check[ci]')
        run: bundle exec rake 'bundles:check[ci]'

  web:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Web frontend specs
        run: npm test

  e2e:
    name: web e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # bundle exec: bin/chi, and the session workers it spawns, load the
      # gems from the bundle (RUBYOPT is inherited).
      - name: Web e2e (fake model, python3 from the runner)
        run: bundle exec npm run e2e
      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: tmp/e2e/
          retention-days: 14
