name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rspec:
    name: rspec (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    # Spec helper deadlines (wait_for, wait_until, join!, pop!, eventually)
    # × 2 on the shared runners: headroom, not a slower pass (docs/testing.md,
    # "Waiting and time").
    env:
      SPEC_TIME_SCALE: "2"
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true # bundle install from the committed Gemfile.lock
      # parallel_rspec groups the spec files by the runtimes the last run
      # logged (.rspec_parallel's RuntimeLogger), restored from the latest
      # main run's cache; without one it groups them by file size.
      - name: Restore the spec runtime log
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/parallel_runtime_rspec.log
          key: parallel-runtime-${{ runner.os }}-ruby-${{ matrix.ruby }}-${{ github.run_id }}
          restore-keys: parallel-runtime-${{ runner.os }}-ruby-${{ matrix.ruby }}-
      # Both spec roots: parallel_rspec doesn't read .rspec's --pattern.
      - name: Specs (:integration and :macos_build skip themselves)
        run: bundle exec parallel_rspec -n 4 spec lib/samagotchi/bundles/*/spec
      - name: Save the spec runtime log (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/parallel_runtime_rspec.log
          key: parallel-runtime-${{ runner.os }}-ruby-${{ matrix.ruby }}-${{ github.run_id }}

  rspec-macos:
    # The desktop helper and pbpaste paths are macOS-only.
    name: rspec (macOS, Ruby 3.4)
    runs-on: macos-latest
    # Spec helper deadlines (wait_for, wait_until, join!, pop!, eventually)
    # × 2 on the shared runners: headroom, not a slower pass (docs/testing.md,
    # "Waiting and time").
    env:
      SPEC_TIME_SCALE: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # parallel_rspec groups the spec files by the runtimes the last run
      # logged (.rspec_parallel's RuntimeLogger), restored from the latest
      # main run's cache; without one it groups them by file size.
      - name: Restore the spec runtime log
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/parallel_runtime_rspec.log
          key: parallel-runtime-${{ runner.os }}-ruby-3.4-${{ github.run_id }}
          restore-keys: parallel-runtime-${{ runner.os }}-ruby-3.4-
      # Both spec roots: parallel_rspec doesn't read .rspec's --pattern.
      - name: Specs (:integration and :macos_build skip themselves)
        run: bundle exec parallel_rspec -n 3 spec lib/samagotchi/bundles/*/spec
      - name: Save the spec runtime log (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/parallel_runtime_rspec.log
          key: parallel-runtime-${{ runner.os }}-ruby-3.4-${{ github.run_id }}

  lint:
    name: rubocop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: RuboCop (.rubocop.yml; TargetRubyVersion 3.3)
        run: bundle exec rake lint

  bundles:
    name: bundles:check
    runs-on: ubuntu-latest
    # Spec helper deadlines (wait_for, wait_until, join!, pop!, eventually)
    # × 2 on the shared runners: headroom, not a slower pass (docs/testing.md,
    # "Waiting and time").
    env:
      SPEC_TIME_SCALE: "2"
    steps:
      # The full history and tags: the version check diffs each bundle
      # against the last v* tag (a shallow clone has none and skips it).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # Sha lines strict for every bundle; a bundle changed since the last
      # tag needs a higher version, the system bundle aside (release:bump
      # moves it with VERSION). The release workflow runs the full check.
      - name: Bundle manifests (rake 'bundles:check[ci]')
        run: bundle exec rake 'bundles:check[ci]'
      # The shipped bundles' own specs on the bundle test kit alone (no
      # spec_helper), as an external bundle's run.
      - name: Bundle specs (rake bundles:specs)
        run: bundle exec rake bundles:specs

  web:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      # The specs' dev dependencies (happy-dom for the DOM shim).
      - run: npm ci
      - name: Web frontend specs
        run: npm test
      # ESLint for missing names only (eslint.config.js): a dropped import
      # fails here, not first in the e2e run.
      - name: Web frontend lint (npm run lint)
        run: npm run lint

  e2e:
    name: web e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Chromium runs in Playwright's own image, which bakes it and its
      # system packages: no `playwright install --with-deps`, whose apt
      # fetch from the runner's mirror once took 10 of the 15 minutes. The
      # tag is the installed @playwright/test's version (package-lock.json),
      # so the browser always matches the client. --network host: it reaches
      # chi web on the runner's loopback and LAN addresses.
      - name: Chromium in Playwright's image (run-server)
        timeout-minutes: 5
        run: |
          version=$(node -p 'require("@playwright/test/package.json").version')
          docker run -d --init --ipc=host --network host --name playwright \
            --user pwuser --workdir /home/pwuser \
            "mcr.microsoft.com/playwright:v${version}-noble" \
            npx -y "playwright@${version}" run-server --port 3333 --host 127.0.0.1
          for _ in $(seq 90); do
            curl -s -o /dev/null http://127.0.0.1:3333/ && exit 0
            sleep 1
          done
          docker logs playwright
          exit 1
      # bundle exec: bin/chi, and the session workers it spawns, load the
      # gems from the bundle (RUBYOPT is inherited). The tests connect to
      # the browser (PW_TEST_CONNECT_WS_ENDPOINT); traces and the report
      # are written here, on the runner.
      - name: Web e2e (fake model, python3 from the runner, Chromium in the container)
        env:
          PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:3333/
        run: bundle exec npm run e2e
      - name: The browser server's log
        if: failure()
        run: docker logs playwright || true
      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: tmp/e2e/
          retention-days: 14
