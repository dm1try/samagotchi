name: Release

# Publishes samagotchi to rubygems.org when a v* tag is pushed; the runbook is
# docs/releasing.md. No API key anywhere: the publish job gets a short-lived
# token through rubygems.org trusted publishing (OIDC), and the `release`
# environment waits for a maintainer's approval first.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: bundle exec rspec --format progress
      - run: npm test
      - run: bundle exec rake bundles:check

  publish:
    name: publish to rubygems.org
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # trusted publishing
      contents: write # the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the ancestry check needs main's history
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: The tag is v<VERSION> on main
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(ruby -Ilib -e 'require "samagotchi/version"; print Samagotchi::VERSION')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG doesn't match VERSION $version (expected v$version)"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $TAG ($GITHUB_SHA) isn't on main"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        run: bundle exec rake "release:notes[${{ steps.version.outputs.version }}]" > "$RUNNER_TEMP/notes.md"

      - name: Build the gem
        run: |
          mkdir -p pkg
          gem build samagotchi.gemspec --output "pkg/samagotchi-${{ steps.version.outputs.version }}.gem"

      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Push to rubygems.org
        run: gem push "pkg/samagotchi-${{ steps.version.outputs.version }}.gem"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "pkg/samagotchi-${{ steps.version.outputs.version }}.gem" \
            --verify-tag --title "samagotchi ${{ steps.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md"
