name: Release

# Publishes samagotchi to rubygems.org when a v* tag is pushed; the runbook is
# docs/releasing.md. No API key anywhere: the publish job gets a short-lived
# token through rubygems.org trusted publishing (OIDC), and the `release`
# environment waits for a maintainer's approval first.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: CI green on the tag, bundles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # the CI workflow's runs
    steps:
      # The suites already ran in ci.yml on this commit when it was pushed to
      # main (runbook step 6), so this job asks for that run's result instead
      # of running them again. A run still going is waited for; one that
      # failed, or none at all, stops the release.
      - name: CI result for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          runs="repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main&per_page=1"
          waited=0
          while :; do
            run=$(gh api "$runs" --jq '.workflow_runs[0] // empty | [.id, .status, (.conclusion // ""), .html_url] | @tsv')
            if [ -z "$run" ]; then
              # The push to main may have just landed: give its run a few minutes to appear.
              if [ "$waited" -ge 300 ]; then
                echo "::error::CI never ran on $TAG ($SHA) as a push to main. Push main, wait for CI to go green, then tag again (docs/releasing.md)."
                exit 1
              fi
            else
              IFS=$'\t' read -r id status conclusion url <<< "$run"
              if [ "$status" = completed ]; then
                if [ "$conclusion" = success ]; then
                  echo "CI run $id succeeded on $SHA: $url"
                  exit 0
                fi
                echo "::error::CI run $id on $TAG ($SHA) ended '$conclusion': $url. Fix main and tag the fixed commit, or re-run the CI jobs and then this workflow."
                exit 1
              fi
              echo "CI run $id is $status; waiting ($url)"
            fi
            sleep 30
            waited=$((waited + 30))
          done

      # The full check, system bundle included: ci.yml runs bundles:check[ci],
      # which leaves the system bundle's version out. The full history and
      # tags: it diffs each bundle against the previous v* tag
      # (ReleaseTools.last_tag skips the one being released, on HEAD).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake bundles:check

  publish:
    name: publish to rubygems.org
    needs: checks
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # trusted publishing
      contents: write # the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the ancestry check needs main's history
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: The tag is v<VERSION> on main
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(ruby -Ilib -e 'require "samagotchi/version"; print Samagotchi::VERSION')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG doesn't match VERSION $version (expected v$version)"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $TAG ($GITHUB_SHA) isn't on main"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        run: bundle exec rake "release:notes[${{ steps.version.outputs.version }}]" > "$RUNNER_TEMP/notes.md"

      - name: Build the gem
        run: |
          mkdir -p pkg
          gem build samagotchi.gemspec --output "pkg/samagotchi-${{ steps.version.outputs.version }}.gem"

      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Push to rubygems.org
        run: gem push "pkg/samagotchi-${{ steps.version.outputs.version }}.gem"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "pkg/samagotchi-${{ steps.version.outputs.version }}.gem" \
            --verify-tag --title "samagotchi ${{ steps.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md"
