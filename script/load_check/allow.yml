# script/load-check's allow-list: every finding the checker reports that a
# human proved to be a false positive, with the reason. Match is on rule,
# file and constant ("*" allowed in any of them). An entry that matches nothing
# shows up as "matched nothing" in the summary; delete it.
#
# Format:
#   - rule: 2
#     file: lib/samagotchi/engine.rb
#     constant: Samagotchi::Engine
#     reason: why this is not a real gap

- rule: 3
  file: lib/samagotchi/plugin/context.rb
  constant: Samagotchi::Plugin::Http
  reason: >-
    http.rb defines Http and requires http_transport.rb (net/http) only inside a
    method; http_transport.rb requires http.rb above its `class Http`. The
    autoload's target never loads the reopener at load time, so no load order
    fires the autoload from inside a file that is still loading.
