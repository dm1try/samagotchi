# script/load-check's allow-list: every finding the checker reports that a
# human proved to be a false positive, with the reason. Match is on rule,
# file and constant ("*" allowed in any of them). An entry that matches nothing
# shows up as "matched nothing" in the summary; delete it.
#
# Format:
#   - rule: 2
#     file: lib/samagotchi/engine.rb
#     constant: Samagotchi::Engine
#     reason: why this is not a real gap

- rule: 3
  file: lib/samagotchi/plugin/context.rb
  constant: Samagotchi::Plugin::Http
  reason: >-
    http.rb defines Http and requires http_transport.rb (net/http) only inside a
    method; http_transport.rb requires http.rb above its `class Http`. The
    autoload's target never loads the reopener at load time, so no load order
    fires the autoload from inside a file that is still loading.

# Rule 3: an autoload of a namespace whose target file requires every file that
# reopens it, and is the only file that does (session_manager.rb its parts,
# objectives.rb objectives_{backing,edit}.rb, config.rb config/restart_watch.rb).
# Firing the autoload loads the whole namespace; no reopener is required first.
# Kept as autoloads so a process loads those files only when it uses them.
- rule: 3
  file: "*"
  constant: Samagotchi::SessionManager
  reason: >-
    session_manager.rb requires all its parts; spec/require_cycle_spec.rb pins
    that each autoload loads it whole and that no part requires a file that
    autoloads it. The ~80 files stay out of processes that never start a worker.
- rule: 3
  file: "*"
  constant: Samagotchi::Objectives
  reason: objectives.rb requires objectives_backing.rb and objectives_edit.rb, and nothing else does.
- rule: 3
  file: lib/samagotchi/log.rb
  constant: Samagotchi::Config
  reason: config.rb requires config/restart_watch.rb, and nothing else does.

# Rule 1: a part naming its host's constants. The host file requires the part,
# so a require back would be a cycle; the host defines them before any of the
# part's methods can run. [A-Z][A-Z_]* matches value constants (FOO_BAR) only.
- rule: 1
  file: lib/samagotchi/engine/*.rb
  constant: Samagotchi::Engine::[A-Z][A-Z_]*
  reason: engine.rb requires its parts (Engine::<Concern>Part).
- rule: 1
  file: lib/samagotchi/terminal_ui/attached_loop/*.rb
  constant: Samagotchi::TerminalUI::AttachedLoop::[A-Z][A-Z_]*
  reason: attached_loop.rb requires its parts.
- rule: 1
  file: lib/samagotchi/web/*.rb
  constant: Samagotchi::Web::App::[A-Z][A-Z_]*
  reason: web/app.rb requires participant_access, proxy_gate and session_control.
- rule: 1
  file: lib/samagotchi/config/restart_watch.rb
  constant: Samagotchi::Config*
  reason: config.rb (Config, ConfigFile) requires config/restart_watch.rb.
- rule: 1
  file: lib/samagotchi/objectives_edit.rb
  constant: Samagotchi::Objectives::[A-Z][A-Z_]*
  reason: objectives.rb requires objectives_edit.rb.
- rule: 1
  file: lib/samagotchi/memory_usage.rb
  constant: Samagotchi::MemoryCommand::LINE
  reason: memory_command.rb requires memory_usage.rb.
- rule: 1
  file: lib/samagotchi/guardrails/pair_command.rb
  constant: Samagotchi::Guardrails::PairBoundary::[A-Z][A-Z_]*
  reason: >-
    pair_boundary.rb requires pair_command.rb and is the only maker of a
    PairCommand, whose #refusal returns PairBoundary's refusal words; a
    require back is a cycle. (message_parts reached pair_boundary.rb through
    tools/builtins until its default registry became ToolNames::BuiltinRegistry.)
- rule: 1
  file: lib/samagotchi/testing/bundle.rb
  constant: Samagotchi::Testing::Install
  reason: testing/install.rb requires testing/bundle.rb.
- rule: 1
  file: lib/samagotchi/tool_response.rb
  constant: Samagotchi::ToolRun
  reason: >-
    tool_runner.rb (ToolRun) reaches tool_response.rb through its requires; every
    entry point that loads tool_response.rb loads tool_runner.rb too.
