type: walk
title: A tab loses its session connection and returns
actors: [user, web, bridge]
steps:
  - id: s1
    actor: user
    does: loses the connection (network drop, laptop sleep)
    sees: the page shows a "reconnecting" mark
    behind: the SSE stream GET /events to the worker's Bridge breaks
  - id: s2
    actor: web
    does: reconnects to the event stream
    behind: the tab sends GET /events with Last-Event-ID N, the last event it saw
  - id: s3
    actor: bridge
    does: looks up N in its replay buffer
    behind: the answer depends on how long the tab was away, and on whether the worker is still alive
    branches:
      - when: N is still in the replay buffer
        goto: s4
      - when: N is too old
        goto: s5
      - when: the worker exited while the tab was away
        goto: s7
  - id: s4
    actor: bridge
    does: replays the events after N, then continues the live stream
    sees: the missed steps appear and the "reconnecting" mark goes away
    branches:
      - when: always
        goto: s8
  - id: s5
    actor: bridge
    does: sends a `reset` event
    behind: the buffer no longer reaches back to N, so replay is impossible
  - id: s6
    actor: web
    does: re-reads the turn snapshot and redraws the turn
    sees: the whole turn is redrawn, and open cards come back
    behind: GET /api/sessions/:id returns the TurnAccumulator snapshot; cards are restored from CardStore
    branches:
      - when: always
        goto: s8
  - id: s7
    actor: web
    does: shows the session as not running
    sees: the session is marked not running; a new prompt starts the worker again
    behind: the worker made an idle exit after session.idle_exit_minutes, so no Bridge answers
  - id: s8
    actor: user
    does: carries on with the session
    sees: live updates stream in as before
