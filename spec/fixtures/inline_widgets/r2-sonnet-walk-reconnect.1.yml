type: walk
title: A tab loses its connection and comes back
actors: [user, web, bridge]
steps:
  - id: s1
    actor: user
    does: loses the connection (sleep, network drop)
    sees: the page shows a "reconnecting" mark
    behind: the SSE stream GET /events breaks
  - id: s2
    actor: web
    does: reconnects with GET /events and Last-Event-ID N
    cases:
      - when: the worker is still running
        goto: s3
      - when: the worker exited (idle exit)
        goto: s9
  - id: s3
    actor: bridge
    does: looks for N in its replay buffer
    cases:
      - when: N is still buffered
        goto: s4
      - when: N is too old
        goto: s6
  - id: s4
    actor: bridge
    does: replays the events after N
    sees: the missed steps appear
  - id: s5
    actor: bridge
    does: the live stream continues
    next: s11
  - id: s6
    actor: bridge
    does: sends a reset event
    behind: the replay buffer no longer reaches back to N
  - id: s7
    actor: web
    does: re-reads GET /api/sessions/:id and redraws the turn
    behind: the snapshot comes from TurnAccumulator
  - id: s8
    actor: web
    does: restores open cards
    sees: the turn is redrawn and open cards are back
    behind: cards are read from CardStore
    next: s11
  - id: s9
    actor: web
    does: shows the session as not running
    sees: the session is marked not running
    behind: the worker exited after session.idle_exit_minutes
  - id: s10
    actor: user
    does: sends a new prompt
    sees: the session works again
    behind: the prompt starts the worker again
    next: s11
  - id: s11
    actor: user
    does: carries on with the session
    sees: the "reconnecting" mark is gone
