type: walk
title: A tab reconnects to a running session
actors: [user, tab, bridge, worker]
steps:
  - id: s1
    actor: user
    does: comes back to the tab after losing the network
    sees: a "reconnecting" mark on the page
  - id: s2
    actor: tab
    does: sends GET /events with Last-Event-ID: N
    behind: the id of the last event it managed to receive
  - id: s3
    actor: bridge
    does: looks N up in its replay buffer
    cases:
      - when: N is still buffered
        goto: s4
      - when: N is too old
        goto: s5
  - id: s4
    actor: bridge
    does: replays the events after N, then the live stream continues
    sees: the missed steps appear, then new ones as they happen
    next: s8
  - id: s5
    actor: bridge
    does: sends a `reset` event
    behind: it can't reconstruct what the tab missed
  - id: s6
    actor: tab
    does: re-reads the turn snapshot via GET /api/sessions/:id
    behind: the TurnAccumulator holds what the turn looks like now
    next: s7
  - id: s7
    actor: tab
    does: redraws the turn, restoring open cards from CardStore
    sees: the turn as it stands now, no gap
    next: s8
  - id: s8
    actor: tab
    does: checks whether the worker is still alive
    cases:
      - when: the worker is running
        goto: s9
      - when: the worker idle-exited after session.idle_exit_minutes
        goto: s10
  - id: s9
    actor: tab
    does: follows the live stream again
    sees: the session continues normally
  - id: s10
    actor: tab
    does: shows the session as not running
    sees: the turn as it was left, with no live stream
    next: s11
  - id: s11
    actor: user
    does: types a new prompt
    sees: the worker starts again and the session resumes
