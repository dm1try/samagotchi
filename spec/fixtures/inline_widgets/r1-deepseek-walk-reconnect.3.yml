type: walk
title: A tab loses a session and comes back
actors: [user, web, worker]
steps:
  - id: s1
    actor: user
    does: closes the laptop / the network drops
    sees: the page shows a "reconnecting" mark
    behind: the tab's SSE stream (GET /events) to the worker's Bridge dies
  - id: s2
    actor: web
    does: reconnects the stream
    behind: sends GET /events with Last-Event-ID: N
    branches:
      - when: N is still in the Bridge's replay buffer
        goto: s3
      - when: N is too old and the buffer no longer holds it
        goto: s4
      - when: the worker exited meanwhile (idle exit after session.idle_exit_minutes)
        goto: s5
  - id: s3
    actor: worker
    does: replays the events after N, then keeps streaming live
    sees: the missed steps appear in the turn
  - id: s4
    actor: web
    does: receives a reset event, then re-reads the turn snapshot
    sees: the turn is redrawn, open cards come back
    behind: GET /api/sessions/:id for the TurnAccumulator, open cards from CardStore
  - id: s5
    actor: user
    does: types a new prompt
    sees: the page says the session is not running, then the worker starts again
