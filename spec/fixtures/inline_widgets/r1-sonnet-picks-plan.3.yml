type: picks
title: Open decisions for scratch sessions
rows:
  - id: D1
    text: Session file after the worker exits
    options: [A delete at exit, B keep 1 h]
    recommended: B keep 1 h
    why: deleting at exit would bring back the lost-answer problem
  - id: D2
    text: Scratch sessions in chi web's list
    options: [A hide, B show with scratch mark]
    recommended: B show with scratch mark
    why: users need to see a session to recover it
  - id: D3
    text: chi --resume on a scratch session
    options: [A refuse, B allow while file exists]
    recommended: B allow while file exists
    why: resuming is the way to get the answer back
  - id: D4
    text: Memory writes from a scratch session
    options: [A allow, B deny project, allow system]
    recommended: B deny project, allow system
    why: throwaway questions shouldn't add to project memory
