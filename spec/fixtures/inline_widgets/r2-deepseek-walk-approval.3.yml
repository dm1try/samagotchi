type: walk
title: When a tool call needs your approval
actors: [chi, guardrail, system1, user]
steps:
  - id: s1
    actor: chi
    does: proposes a tool call
  - id: s2
    actor: guardrail
    does: matches the call against the rules
    cases:
      - when: a rule says allow
        goto: s3
      - when: a rule says ask
        goto: s4
      - when: it is a write in a review turn (ReviewBoundary)
        goto: s9
      - when: a rule says deny
        goto: s9
  - id: s3
    actor: chi
    does: runs the call — no card, no wait
    next: s8
  - id: s4
    actor: system1
    does: "judges the call first (timeout 2000 ms)"
    cases:
      - when: it says allow
        goto: s5
      - when: it is unsure or times out
        goto: s6
  - id: s5
    actor: chi
    does: runs the call
    sees: the step shows an auto-allowed mark
    next: s8
  - id: s6
    actor: chi
    does: waits — the turn is parked on the card
    sees: an approval card with Allow / Deny (a web push if you are away)
    behind: stopping during the wait cancels the turn
    next: s7
  - id: s7
    actor: user
    does: clicks Allow or Deny
    cases:
      - when: Allow
        goto: s8
      - when: Deny
        goto: s9
  - id: s8
    actor: chi
    does: uses the result and the turn goes on
  - id: s9
    actor: chi
    does: gets a denial where the result would have been
    sees: the model reads it and continues the turn
