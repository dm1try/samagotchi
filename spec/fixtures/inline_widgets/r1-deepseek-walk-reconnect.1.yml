type: walk
title: A tab reconnects to a running session
actors: [user, tab, bridge]
steps:
  - id: s1
    actor: user
    does: laptop sleeps, or the wifi drops
    sees: a "reconnecting" mark on the page
    behind: the tab's SSE stream (GET /events) drops
  - id: s2
    actor: tab
    does: network returns and the stream reconnects
    behind: it sends GET /events with Last-Event-ID: N
  - id: s3
    actor: bridge
    does: looks up N in its replay buffer
    branches:
      - when: N is still in the buffer
        goto: s4
      - when: N is too old
        goto: s6
  - id: s4
    actor: bridge
    does: replays the events after N, then resumes the live stream
  - id: s5
    actor: user
    does: keeps watching the turn
    sees: the missed steps appear, in order, and the turn carries on
  - id: s6
    actor: tab
    does: handles the `reset` event the bridge sends
    behind: re-reads the turn snapshot (TurnAccumulator) via GET /api/sessions/:id, redraws the turn; open cards come back from CardStore
    branches:
      - when: the worker had exited meanwhile (idle exit after session.idle_exit_minutes)
        goto: s7
  - id: s7
    actor: user
    does: sees the session as not running, then sends a new prompt
    sees: the session marked not running
    behind: the new prompt starts the worker again
