type: walk
title: A tab loses its connection and comes back
actors: [user, web, bridge]
steps:
  - id: s1
    actor: user
    does: loses the connection (network drop, laptop asleep)
    sees: the page shows a "reconnecting" mark
    behind: the SSE stream GET /events breaks
  - id: s2
    actor: web
    does: reconnects to the worker
    behind: sends GET /events with Last-Event-ID N, the last event it saw
    branches:
      - when: N is still in the replay buffer
        goto: s3
      - when: N is too old
        goto: s4
      - when: the worker exited (idle exit)
        goto: s6
  - id: s3
    actor: bridge
    does: replays the events after N
    sees: the missed steps appear and the mark goes away
    behind: the live stream continues after the replay
    branches:
      - when: replay done
        goto: s7
  - id: s4
    actor: bridge
    does: sends a reset event
    behind: N is no longer in the replay buffer
  - id: s5
    actor: web
    does: re-reads the turn and redraws it
    sees: the turn is redrawn and open cards come back
    behind: GET /api/sessions/:id returns the TurnAccumulator snapshot, and cards come from CardStore
    branches:
      - when: redraw done
        goto: s7
  - id: s6
    actor: web
    does: finds the worker gone after session.idle_exit_minutes
    sees: the session shows as not running
    behind: a new prompt starts the worker again
  - id: s7
    actor: user
    does: carries on, or sends a new prompt
    sees: the session is current again
