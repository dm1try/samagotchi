type: walk
title: When a tool call needs approval
actors: [model, guardrails, system1, user]
steps:
  - id: s1
    actor: model
    does: proposes a tool call
    behind: every call goes through the guardrail rules first
  - id: s2
    actor: guardrails
    does: matches the call against the rules
    behind: in a review turn, ReviewBoundary denies writes before any card is shown
    cases:
      - when: the rule says allow
        goto: s3
      - when: the rule says ask
        goto: s4
      - when: the rule says deny
        goto: s9
  - id: s3
    actor: guardrails
    does: runs the call
    next: s10
  - id: s4
    actor: system1
    does: judges the call, but only if System 1 is on
    behind: answers within timeout_ms 2000
    cases:
      - when: it says allow
        goto: s5
      - when: it is unsure, times out, or System 1 is off
        goto: s6
  - id: s5
    actor: guardrails
    does: runs the call
    sees: the turn's step shows an auto-allowed mark
    next: s10
  - id: s6
    actor: user
    sees: an approval card with Allow / Deny, plus a web push if you're away
    behind: the turn waits on the card; a stop during the wait cancels the turn
  - id: s7
    actor: user
    does: picks Allow or Deny
    cases:
      - when: Allow
        goto: s8
      - when: Deny
        goto: s9
  - id: s8
    actor: guardrails
    does: runs the call
    next: s10
  - id: s9
    actor: guardrails
    does: returns the denial or error to the model
    next: s10
  - id: s10
    actor: model
    does: continues the turn with the result
