# One file of a bundle's own folder per case (a guardrail rule, the plugin, a
# script, a hook), in a known state, run through every asset command
# (spec/samagotchi/memory_bundle/file_state_corpus/assets_spec.rb). Hand-written;
# expect/assets.yml is generated (UPDATE_GOLDENS=1) and reviewed.
#
# A case:
#   id, asset   rule (guardrails/r.yml), plugin (plugin.rb), script
#               (scripts/s.sh) or hook (hooks/h.rb)
#   state       new, unchanged, pristine, edited_sha, edited_no_sha, dev_link,
#               dropped_pristine, dropped_edited; a hook also stray,
#               listed_missing, unlisted, linked, pristine_no_sha
#   recorded    the text whose sha256 the record holds; "" recorded with no
#               sha; null not in the record
#   installed   the installed file's text, null: none (dev: a link to the source)
#   incoming    the bundle's text, null: the version dropped it
#   file        the hook's name (default h.rb)
#   beside      the bundle also has hooks/h.rb, unchanged (a stray file's case)
#   listed_missing  the manifest lists the hook, the source has no such file
#   unlisted    the manifest has no hooks: key (every hooks/*.rb installs)
#   linked      the source's hooks/h.rb is a symlink out of the source
#   fix, fixed, divergent, changed, note   as in memory_cases.yml; asset tags:
#               new-updated (changed: a file new to the record is Installed),
#               hook-retired (changed: an install or upgrade removes an old
#               record's class-file hooks), dry-dropped, dry-trash,
#               rule-installed, uninstall-unnamed
texts:
  v1: "# v1\n"
  v2: "# v2\n"
  mine: "# mine\n"

cases:
  - {id: rule_new, asset: rule, state: new, recorded: null, installed: null, incoming: v2}
  - id: rule_unchanged
    asset: rule
    state: unchanged
    recorded: v1
    installed: v1
    incoming: v1
    fix:
      - "704 spec/samagotchi/memory_bundle/installer_spec.rb: an unchanged rules file is skipped as already up to date; a changed one is installed"
  - id: rule_pristine
    asset: rule
    state: pristine
    recorded: v1
    installed: v1
    incoming: v2
  - id: rule_edited_sha
    asset: rule
    state: edited_sha
    recorded: v1
    installed: mine
    incoming: v2
    divergent: dry-trash
    note: >-
      dry-trash: upgrade copies the edited file to the trash ("Copied to the trash first"); its dry run never says so
      (chi update's plan does: replaces).
    fix:
      - "44 spec/samagotchi/memory_bundle/kept_edits_spec.rb: copies each edited file an upgrade replaces, in its own subfolder, and says so"
      - "45 spec/samagotchi/memory_bundle/kept_edits_spec.rb: copies each edited hook, rule, plugin and script to the trash, with --force or without"
  - id: rule_edited_no_sha
    asset: rule
    state: edited_no_sha
    recorded: ""
    installed: mine
    incoming: v2
    divergent: dry-trash
    note: >-
      dry-trash: upgrade copies the edited file to the trash ("Copied to the trash first"); its dry run never says so
      (chi update's plan does: replaces).
  - {id: rule_dev_link, asset: rule, state: dev_link, recorded: dev, installed: v2, incoming: v2}
  - id: rule_dropped_pristine
    asset: rule
    state: dropped_pristine
    recorded: v1
    installed: v1
    incoming: null
  - id: rule_dropped_edited
    asset: rule
    state: dropped_edited
    recorded: v1
    installed: mine
    incoming: null

  - id: plugin_new
    asset: plugin
    state: new
    recorded: null
    installed: null
    incoming: v2
    changed: new-updated
    note: "new-updated: upgrade listed a file the bundle never had before under Updated (the dry run: Would update); it lists it under Installed since"
  - id: plugin_unchanged
    asset: plugin
    state: unchanged
    recorded: v1
    installed: v1
    incoming: v1
    divergent: uninstall-unnamed
    note: >-
      chi bundle uninstall of a bundle with no memories and no hooks (the short path) names no Removed: plugin/...,
      where the long path does
    fix:
      - "587 spec/samagotchi/memory_bundle/plugin_manifest_spec.rb: an upgrade with an identical plugin reports it up to date, not Updated"
  - id: plugin_pristine
    asset: plugin
    state: pristine
    recorded: v1
    installed: v1
    incoming: v2
    divergent: uninstall-unnamed
    note: >-
      uninstall-unnamed: the bundle has no memories and no hooks, so chi bundle uninstall takes the short path and
      names no Removed: plugin/plugin.rb.
  - id: plugin_edited_sha
    asset: plugin
    state: edited_sha
    recorded: v1
    installed: mine
    incoming: v2
    divergent: [dry-trash, uninstall-unnamed]
    note: >-
      dry-trash: upgrade copies the edited file to the trash ("Copied to the trash first"); its dry run never says so
      (chi update's plan does: replaces). uninstall-unnamed: the bundle has no memories and no hooks, so chi bundle
      uninstall takes the short path and names no Removed: plugin/plugin.rb.
  - id: plugin_edited_no_sha
    asset: plugin
    state: edited_no_sha
    recorded: ""
    installed: mine
    incoming: v2
    divergent: [dry-trash, uninstall-unnamed]
    note: >-
      dry-trash: upgrade copies the edited file to the trash ("Copied to the trash first"); its dry run never says so
      (chi update's plan does: replaces). uninstall-unnamed: the bundle has no memories and no hooks, so chi bundle
      uninstall takes the short path and names no Removed: plugin/plugin.rb.
  - id: plugin_dev_link
    asset: plugin
    state: dev_link
    recorded: dev
    installed: v2
    incoming: v2
    divergent: uninstall-unnamed
    note: >-
      uninstall-unnamed: the bundle has no memories and no hooks, so chi bundle uninstall takes the short path and
      names no Removed: plugin/plugin.rb.
  - id: plugin_dropped_pristine
    asset: plugin
    state: dropped_pristine
    recorded: v1
    installed: v1
    incoming: null
    divergent: uninstall-unnamed
    note: >-
      uninstall-unnamed: the bundle has no memories and no hooks, so chi bundle uninstall takes the short path and
      names no Removed: plugin/plugin.rb.
  - id: plugin_dropped_edited
    asset: plugin
    state: dropped_edited
    recorded: v1
    installed: mine
    incoming: null
    divergent: uninstall-unnamed
    note: >-
      uninstall-unnamed: the bundle has no memories and no hooks, so chi bundle uninstall takes the short path and
      names no Removed: plugin/plugin.rb.

  - id: script_new
    asset: script
    state: new
    recorded: null
    installed: null
    incoming: v2
    changed: new-updated
    note: "new-updated: upgrade listed a file the bundle never had before under Updated (the dry run: Would update); it lists it under Installed since"
  - {id: script_unchanged, asset: script, state: unchanged, recorded: v1, installed: v1, incoming: v1}
  - {id: script_pristine, asset: script, state: pristine, recorded: v1, installed: v1, incoming: v2}
  - id: script_edited_sha
    asset: script
    state: edited_sha
    recorded: v1
    installed: mine
    incoming: v2
    fixed: D2
    note: >-
      P3: chi update's plan names the edited script it copies to the trash dry-trash: upgrade copies the edited file
      to the trash ("Copied to the trash first"); its dry run never says so (chi update's plan does: replaces).
    divergent: dry-trash
  - id: script_edited_no_sha
    asset: script
    state: edited_no_sha
    recorded: ""
    installed: mine
    incoming: v2
    divergent: dry-trash
    note: >-
      dry-trash: upgrade copies the edited file to the trash ("Copied to the trash first"); its dry run never says so
      (chi update's plan does: replaces).
  - {id: script_dev_link, asset: script, state: dev_link, recorded: dev, installed: v2, incoming: v2}
  - id: script_dropped_pristine
    asset: script
    state: dropped_pristine
    recorded: v1
    installed: v1
    incoming: null
  - id: script_dropped_edited
    asset: script
    state: dropped_edited
    recorded: v1
    installed: mine
    incoming: null

  # Class-file hooks are retired: the record's (an older chi's install)
  # stays until an install or upgrade of a source without hooks removes them,
  # an edited one copied to the trash first; a source that still ships one
  # (incoming) is refused and changes nothing.
  - id: hook_new
    asset: hook
    state: new
    recorded: null
    installed: null
    incoming: v2
    note: "retired: a source that ships a hook is refused, its dry run too"
  - id: hook_unchanged
    asset: hook
    state: unchanged
    recorded: v1
    installed: v1
    incoming: v1
    note: "retired: an old record's source that still ships its hook is refused; the record and the hook stay as they were"
  - id: hook_pristine
    asset: hook
    state: pristine
    recorded: v1
    installed: v1
    incoming: null
    changed: hook-retired
    note: >-
      hook-retired: the new version has no hooks; the upgrade removes the old record's hook (it matches its sha, so no
      trash copy) and its dry run says it would
  - id: hook_edited_sha
    asset: hook
    state: edited_sha
    recorded: v1
    installed: mine
    incoming: null
    divergent: dry-trash
    changed: hook-retired
    note: >-
      hook-retired: install and upgrade remove the edited hook, copied to the trash first; chi update's plan names it
      (replaces). dry-trash: upgrade copies the edited file to the trash ("Copied to the trash first"); its dry run
      never says so (chi update's plan does: replaces).
  - id: hook_edited_no_sha
    asset: hook
    state: edited_no_sha
    recorded: ""
    installed: mine
    incoming: null
    fixed: D2
    divergent: dry-trash
    changed: hook-retired
    note: >-
      P3: chi update's plan names an edited hook installed with no recorded sha. hook-retired: removed, copied to the
      trash first. dry-trash: upgrade copies the edited file to the trash ("Copied to the trash first"); its dry run
      never says so (chi update's plan does: replaces).
  - {id: hook_dev_link, asset: hook, state: dev_link, recorded: dev, installed: v2, incoming: v2, note: "retired: refused (the source ships the hook)"}
  - id: hook_dropped_pristine
    asset: hook
    state: dropped_pristine
    recorded: v1
    installed: v1
    incoming: null
    changed: hook-retired
    note: >-
      hook-retired: a plain install and an upgrade of a version without the hook remove it (hook-stray-left: a plain
      install used to leave the file in hooks/, and no later upgrade removed it); the dry run says it would
      (dry-dropped: it used to say nothing)
  - id: hook_dropped_edited
    asset: hook
    state: dropped_edited
    recorded: v1
    installed: mine
    incoming: null
    divergent: dry-trash
    changed: hook-retired
    note: >-
      hook-retired: removed, copied to the trash first, by a plain install too (hook-stray-left: it used to stay);
      the dry run says it would remove it (dry-dropped: it used to say nothing). dry-trash: its dry run never says
      it would copy it to the trash (chi update's plan does: replaces).
  # The selection retire_hooks and ShippedUpdate#trash_bound share
  # (Trash.edits over hooks/): their plan and upgrade cells agree.
  - id: hook_stray
    asset: hook
    state: stray
    file: extra.rb
    beside: true
    recorded: null
    installed: mine
    incoming: null
    changed: hook-retired
    note: >-
      hook-retired: a file in hooks/ the record doesn't know goes with the rest, copied to the trash first (no sha:
      it counts as edited); it used to stay
  - id: hook_listed_missing
    asset: hook
    state: listed_missing
    listed_missing: true
    recorded: v1
    installed: mine
    incoming: null
    note: >-
      retired: the source's manifest still lists a hook (its file isn't there): refused, the edited hook and the
      record left as they were (hook-sha-dropped, where install recorded it with sha "", is gone)
  - id: hook_unlisted
    asset: hook
    state: unlisted
    unlisted: true
    recorded: v1
    installed: mine
    incoming: v2
    note: "retired: a source with hooks/*.rb and no hooks: key is refused all the same"
  - id: hook_linked
    asset: hook
    state: linked
    linked: true
    recorded: v1
    installed: mine
    incoming: v2
    note: "retired: a source whose hooks/h.rb is a symlink out of it is refused (refuse_hooks sees the link)"
  - id: hook_pristine_no_sha
    asset: hook
    state: pristine_no_sha
    recorded: ""
    installed: v1
    incoming: null
    divergent: dry-trash
    changed: hook-retired
    note: >-
      hook-retired: removed; with no sha recorded it counts as edited, so it is copied to the trash first. dry-trash:
      its dry run never says so (chi update's plan does: replaces).
