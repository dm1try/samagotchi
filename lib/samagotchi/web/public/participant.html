<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>chi · review</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/annotate_bar.css">
<link rel="stylesheet" href="/assets/composer.css">
<style>
/* The participant page (participant.js): the thread with the composer pinned, and for a review session its subjects
   (the Plan): beside the thread on a wide screen, a Plan | Thread toggle on a narrow one (the composer pinned in both).
   The owner's participant view is the same page with no composer (nothing mounted, the dock hidden). Colours are tokens.css's. */
*{box-sizing:border-box;margin:0;padding:0}
/* No iOS text autosizing (index.html's twin). */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;height:100dvh}
.p-body{flex:1;min-height:0;display:flex}
.p-col{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.p-plan{min-height:0;display:flex;flex-direction:column;background:var(--bg-panel);border-right:1px solid var(--border)}
.p-plan-files{display:flex;gap:4px;flex-wrap:wrap;padding:8px 16px 0}
.p-plan-files button{font-size:12px;padding:2px 10px;border-radius:999px;background:transparent;color:var(--text-3)}
.p-plan-files button[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent-border);color:var(--accent)}
.p-plan-path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--text-muted);padding:8px 16px 0}
.p-plan-scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 24px}
.p-doc{max-width:72ch;word-break:break-word}
.p-doc h1,.p-doc h2,.p-doc h3,.p-doc h4{color:var(--text-bright);line-height:1.3;margin:18px 0 8px}
.p-doc h1{font-size:22px}.p-doc h2{font-size:18px}.p-doc h3{font-size:16px}.p-doc h4{font-size:15px}
.p-doc p,.p-doc ul,.p-doc ol,.p-doc pre,.p-doc table,.p-doc blockquote{margin:8px 0}
.p-doc ul,.p-doc ol{padding-left:22px}
.p-doc li+li{margin-top:2px}
.p-doc pre{overflow:auto;padding:10px;border-radius:8px;background:var(--bg-inset)}
.p-doc code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em}
.p-doc blockquote{border-left:3px solid var(--border-strong);padding-left:12px;color:var(--text-3)}
.p-doc table{border-collapse:collapse}
.p-doc th,.p-doc td{border:1px solid var(--border);padding:3px 8px}
.p-doc a{color:var(--accent)}
.p-doc.plain{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.p-plan-note{font-size:12.5px;color:var(--text-muted);margin:8px 0}
.p-seg{display:none;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden}
.p-seg button{border:0;border-radius:0;padding:3px 14px;font-size:13px;background:transparent;color:var(--text-3)}
.p-seg button[aria-selected="true"]{background:var(--accent-bg);color:var(--accent);font-weight:600}
@media (min-width:1100px){
  .p-plan{flex:0 0 min(46vw,720px)}
  body.has-plan .p-head-in,body.has-plan .p-thread,body.has-plan .p-dock-in{max-width:none}
}
@media (max-width:1099px){
  .p-body{flex-direction:column}
  body.has-plan .p-seg{display:inline-flex}
  .p-plan{flex:1;border-right:0}
  body.view-thread .p-plan{display:none}
  body.view-plan .p-col{flex:0 0 auto}
  body.view-plan main{display:none}
}
body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;font-size:15px;line-height:1.55}
.p-head{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg-panel) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:10px 16px}
.p-head-in{max-width:760px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.p-title{font-size:16px;font-weight:600;color:var(--text-bright);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 220px}
.p-title .p-sub{font-weight:400;color:var(--text-muted)}
.p-status{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg-raised);color:var(--text-3);white-space:nowrap}
.p-status:empty{display:none}
.p-status.running{background:var(--accent-bg);color:var(--accent)}
.p-status.waiting{background:var(--warn-bg);color:var(--warn-text)}
.p-people{display:flex;flex-wrap:wrap;gap:4px;font-size:12px;color:var(--text-muted)}
.p-person{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;border:1px solid var(--border)}
.p-dot{width:7px;height:7px;border-radius:50%;background:var(--author-color,var(--author-owner))}
.p-note{flex-basis:100%;font-size:12.5px;color:var(--text-muted)}
.p-offline{flex-basis:100%;font-size:12.5px;color:var(--warn-text);background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:8px;padding:4px 10px}
.p-view-banner{flex-basis:100%;font-size:12.5px;color:var(--warn-text);background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:8px;padding:4px 10px}
main{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 8px}
.p-thread{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.p-empty{color:var(--text-muted);text-align:center;padding:40px 0}
/* A gap divider (time_gaps.js): one centred dim line where a quiet stretch passed, never wrapped (a phone at 360 px keeps it on one line). Not a .bubble. */
.time-gap{align-self:stretch;text-align:center;color:var(--time-gap);font-size:12px;line-height:1.4;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0;user-select:none}
.p-msg{display:flex;flex-direction:column;gap:4px;min-width:0}
.p-who{font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px}
.p-who b{font-weight:600;color:var(--author-color,var(--author-owner))}
.p-bubble{background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:10px 14px;word-break:break-word;min-width:0}
.p-msg.user .p-bubble{white-space:pre-wrap;border-left:3px solid var(--author-color,var(--author-owner))}
.p-msg.mine .p-bubble{background:var(--accent-tint)}
.p-msg.reply .p-bubble{border-left:3px solid var(--accent-strong)}
.p-msg.reply .p-bubble.plain{white-space:pre-wrap}
.p-msg.live .p-bubble{border-left-color:var(--accent)}
.p-bubble pre{overflow:auto;padding:10px;border-radius:8px;background:var(--bg-inset);margin:8px 0}
.p-bubble code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em}
.p-bubble p+p,.p-bubble ul,.p-bubble ol{margin-top:8px}
.p-bubble ul,.p-bubble ol{padding-left:22px}
.p-bubble a{color:var(--accent)}
.p-bubble table{border-collapse:collapse;margin:8px 0}
.p-bubble th,.p-bubble td{border:1px solid var(--border);padding:3px 8px}
.p-tools{font-size:12.5px;color:var(--text-muted)}
.p-tools summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;padding:2px 0}
.p-tools summary::-webkit-details-marker{display:none}
.p-tools summary::before{content:"▸";font-size:10px}
.p-tools[open] summary::before{content:"▾"}
.p-tools ul{list-style:none;padding:2px 0 0 14px;display:flex;flex-direction:column;gap:1px}
.p-tools li{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-tools li.error{color:var(--danger-text)}
.p-tools li.running,.p-tool-one.running{color:var(--accent)}
.p-tool-one{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.p-tool-one.error{color:var(--danger-text)}
.p-tag{font-size:11px;padding:0 6px;border-radius:999px;background:var(--bg-raised);color:var(--text-3)}
.p-waiting{align-self:flex-start;font-size:13px;color:var(--warn-text);background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:999px;padding:3px 12px}
.p-dock{border-top:1px solid var(--border);background:var(--bg-panel);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.p-dock-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.p-queue{display:flex;flex-direction:column;gap:4px;font-size:13px}
.p-queued{display:flex;align-items:center;gap:8px;color:var(--text-3)}
.p-queued span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-queue-note{font-size:12.5px;color:var(--text-muted)}
.p-error{font-size:13px;color:var(--danger-text);background:var(--danger-bg-dim);border-radius:8px;padding:6px 10px}
/* The comment box: the shared composer (composer.css, composer_mount.js), as the owner's session composer lays it out
   (participant.js sets body.has-session for a participant: one row, the text field and Send at its bottom right). Its
   grip straddles the dock's top border; folded, the dock keeps the queue and the grip as the handle. No `/` list,
   delivery line or model picker here. */
#composer{background:var(--bg-inset);border:1px solid var(--border-strong);border-radius:12px}
#composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
body.has-session #composer{padding:6px 6px 6px 10px}
#composer textarea{font:inherit;line-height:1.45;padding:2px 0}
#composer textarea:disabled{cursor:not-allowed}
#composer .actions-col #send{height:30px;min-height:30px;line-height:30px;padding:0 16px;font-weight:600}
.p-dock #composeGrip{margin:-15px 0 5px}
body.composer-folded .p-hint{display:none}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg-raised);color:var(--text);padding:6px 12px}
button:hover{background:var(--bg-hover)}
button.primary{background:var(--primary);border-color:var(--primary);color:var(--on-solid);height:42px;padding:0 18px}
button.primary:disabled{opacity:.5;cursor:default}
button.small{font-size:12px;padding:2px 8px}
.p-hint{font-size:12px;color:var(--text-faint)}
.p-ended{max-width:30rem;margin:18vh auto 0;padding:0 16px;text-align:center;display:flex;flex-direction:column;gap:10px}
.p-ended h1{font-size:20px;color:var(--text-bright)}
.p-ended p{color:var(--text-3)}
[hidden]{display:none!important}
@media (max-width:640px){
  .p-head{padding:8px 16px}
  .p-title{font-size:15px;flex-basis:100%}
  .p-people .p-person:nth-child(n+4){display:none}
  main{padding:12px 16px 6px}
  .p-bubble{padding:9px 12px}
  .p-hint,.p-note{display:none}
}
/* Under 16px iOS Safari zooms the page on focus (and a Home Screen app never zooms back). */
@media (max-width:600px),(pointer:coarse){#composer textarea{font-size:16px}}
/* A phone's grip (composer.css: 26 px tall, the pill at 17 px): the pill on the dock's top border. */
@media (max-width:600px){.p-dock #composeGrip{margin:-29px auto 3px}}
</style>
</head>
<body>
<header class="p-head" id="head" hidden>
  <div class="p-head-in">
    <div class="p-title" id="title"></div>
    <span class="p-status" id="status"></span>
    <div class="p-seg" id="viewSeg" role="tablist" aria-label="Show"><button type="button" role="tab" id="segPlan"
      aria-controls="plan" data-view="plan">Plan</button><button type="button" role="tab" id="segThread"
      aria-controls="main" data-view="thread">Thread</button></div>
    <div class="p-people" id="people"></div>
    <div class="p-view-banner" id="viewBanner" hidden>Participant view: exactly what participants see of this session, through the same filter. Read-only.</div>
    <div class="p-offline" id="offline" role="status" hidden>Can't reach the session — retrying…</div>
    <div class="p-note" id="note"></div>
  </div>
</header>
<div class="p-body">
<aside class="p-plan" id="plan" hidden aria-label="Under review">
  <div class="p-plan-files" id="planFiles" hidden></div>
  <div class="p-plan-path" id="planPath"></div>
  <div class="p-plan-scroll" id="planScroll"><div class="p-doc" id="planDoc"></div></div>
</aside>
<div class="p-col">
<main id="main" hidden>
  <div class="p-thread" id="thread"></div>
</main>
<footer class="p-dock" id="dock" hidden>
  <div id="composeGrip" class="edge-grip" tabindex="0" aria-label="Comment box" title="Drag to make the comment box taller (double-click resets)"></div>
  <div class="p-dock-in">
    <div class="p-queue" id="queue"></div>
    <div class="p-error" id="error" role="alert" hidden></div>
    <div id="composer">
      <div class="compose-col">
        <div id="chips" hidden></div>
        <textarea id="comment" rows="1" placeholder="Comment or ask" aria-label="Comment or ask"></textarea>
      </div>
      <div class="actions-col">
        <button type="button" id="attachBtn" class="attach-btn" title="Add images" aria-label="Add images" hidden></button>
        <input type="file" id="attachInput" accept="image/*" multiple hidden>
        <div class="split"><button type="button" class="primary" id="send">Send</button></div>
      </div>
    </div>
    <div class="p-hint">⏎ sends, ⇧⏎ a new line, ↑ an earlier comment. The model answers in a read-only turn; the owner sees everything.</div>
  </div>
</footer>
</div>
</div>
<section class="p-ended" id="ended" hidden>
  <h1>This review link has ended</h1>
  <p id="endedText"></p>
</section>
<script type="module" src="/assets/participant.js"></script>
</body>
</html>
