<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chi Web</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family: ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#0f1115;color:#e6e8eb;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #1f232b;background:#151821}
h1{font-size:16px;letter-spacing:.02em}
h1 span{color:#7aa5ff}
header .actions{display:flex;gap:8px;align-items:center}
button,input,textarea,select{font:inherit}
button{background:#1f6feb;border:0;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}
button.ghost{background:#22262f;color:#c9d1d9}
button:disabled{opacity:.5;cursor:not-allowed}
select{background:#151821;border:1px solid #1f232b;color:#e6e8eb;padding:6px 8px;border-radius:8px}
main{flex:1;display:flex;min-height:0}
#sidebar{width:360px;min-width:260px;border-right:1px solid #1f232b;background:#0f1115;display:flex;flex-direction:column}
#sidebar .sb-head{padding:10px 12px;border-bottom:1px solid #1f232b;display:flex;gap:8px;align-items:center}
#sidebar .sb-head input{flex:1;background:#151821;border:1px solid #1f232b;color:#e6e8eb;padding:8px 10px;border-radius:8px}
#sidebar .sb-opts{padding:8px 12px;border-bottom:1px solid #1f232b;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#sidebar .sb-opts input{flex:1;min-width:120px;background:#151821;border:1px solid #1f232b;color:#e6e8eb;padding:6px 8px;border-radius:8px}
#sidebar .sb-opts .count{font-size:11px;color:#8b949e;white-space:nowrap}
#list{overflow:auto;flex:1;padding:8px}
.row{display:flex;gap:8px;padding:10px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.row:hover{background:#151821;border-color:#1f232b}
.row.active{background:#1b2336;border-color:#223150}
.row .meta{flex:1;min-width:0}
.row .id{font-family:ui-monospace,monospace;font-size:12px;color:#8b949e}
.row .preview{font-size:13px;color:#e6e8eb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .status{font-size:11px;padding:2px 6px;border-radius:999px;background:#22262f;color:#8b949e;height:fit-content}
.status.running{background:#1a2e1a;color:#7ee787}
.status.idle{background:#22262f}
.status.completed{background:#1a2336;color:#7aa5ff}
.status.error{background:#3d1f1f;color:#ff7b72}
#detail{flex:1;display:flex;flex-direction:column;min-width:0}
#detailHead{padding:10px 12px;border-bottom:1px solid #1f232b;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#0f1115}
#detailHead .badge{font-size:12px;color:#8b949e}
#history{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#0b0d11}
.bubble{background:#151821;border:1px solid #1f232b;border-radius:12px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5}
.bubble.output{border-left:3px solid #1f6feb}
.bubble.output.streaming{border-left-color:#58a6ff;opacity:.95}
.bubble.user{border-left:3px solid #7aa5ff;background:#1b2336;align-self:flex-end;max-width:85%;margin-left:auto}
.bubble.tool{border-left:3px solid #238636;background:#0f1a12;font-size:13px;color:#c9d1d9}
.bubble.cancel{border-left:3px solid #f85149;background:#1a0f0f;color:#ff7b72;font-size:13px}
.hint{color:#8b949e;font-size:13px;padding:12px}
#composer{padding:12px;border-top:1px solid #1f232b;display:flex;gap:8px;background:#0f1115}
#composer textarea{flex:1;min-height:44px;max-height:160px;resize:vertical;background:#151821;border:1px solid #1f232b;color:#e6e8eb;padding:10px 12px;border-radius:10px}
#empty{flex:1;display:grid;place-items:center;color:#8b949e;padding:24px;text-align:center}
a{color:#7aa5ff}
</style>
</head>
<body>
<header>
  <h1><span>Chi</span> Web</h1>
  <div class="actions">
    <button class="ghost" id="refresh">Refresh</button>
    <button id="newBtn">New session</button>
  </div>
</header>
<main>
  <section id="sidebar">
    <div class="sb-head">
      <input id="newPrompt" placeholder="New session prompt — press Enter">
      <button id="create">Create</button>
    </div>
    <div class="sb-opts">
      <select id="sortSel" title="Sort sessions"><option value="updated_at">Updated</option><option value="created_at">Created</option></select>
      <button class="ghost" id="orderBtn" title="Toggle order">↓ Desc</button>
      <input id="filter" placeholder="Filter…">
      <span class="count" id="count"></span>
    </div>
    <div id="list"></div>
  </section>
  <section id="detail">
    <div id="detailHead" style="display:none">
      <strong id="detailId" style="font-family:ui-monospace,monospace"></strong>
      <span class="badge" id="detailStatus"></span>
      <span class="badge" id="detailDir"></span>
      <span class="badge" id="detailModel"></span>
      <button class="ghost" id="cancelBtn" title="Cancel current turn">Cancel</button>
      <button class="ghost" id="stopBtn">Stop</button>
    </div>
    <div id="history"></div>
    <div id="empty">Select a session or create one. <br><small>Sessions are stored in <code>~/.local/state/samagotchi/sessions</code>.</small></div>
    <div id="composer" style="display:none">
      <textarea id="prompt" placeholder="Send a message… (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="send">Send</button>
    </div>
  </section>
</main>
<script>
const $ = s=>document.querySelector(s);
const listEl=$("#list"), historyEl=$("#history"), emptyEl=$("#empty"), composerEl=$("#composer"), detailHead=$("#detailHead");
let selected=null, es=null;
let allSessions=[], displayLimit=100;
// streaming buffer for token-level SSE (generation_chunk)
let streamingBubble=null, streamingBuffer="", rafPending=false;
// defense-in-depth dedup: whitespace-normalized keys of already-rendered content
let seenContent=new Set();
const norm = s => String(s||"").replace(/\s+/g," ").trim();

function api(path, opts={}){
  return fetch(path, {headers:{"Content-Type":"application/json"}, ...opts}).then(async r=>{
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error((j.detail||j.error||r.statusText)+" ("+r.status+")");
    return j;
  });
}
function rowHtml(s){
  const ts = s.updated_at || s.created_at || "";
  const tip = `${s.id} · updated ${ts} · ${s.status}`;
  return `<div class="row" data-id="${s.id}" title="${esc(tip)}"><div class="meta"><div class="id">${s.short_id} · ${s.id.slice(0,8)}</div><div class="preview">${esc(s.preview||"—")}</div></div><span class="status ${esc(s.status)}">${esc(s.status)}</span></div>`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}
function getSort(){ try{ return localStorage.getItem("chi_sort")||"updated_at"; }catch(_){ return "updated_at"; } }
function getOrder(){ try{ return localStorage.getItem("chi_order")||"desc"; }catch(_){ return "desc"; } }
function setSort(v){ try{ localStorage.setItem("chi_sort",v);}catch(_){} }
function setOrder(v){ try{ localStorage.setItem("chi_order",v);}catch(_){} }
async function refresh(){
  const sort=getSort(), order=getOrder();
  const sessions=await api(`/api/sessions?sort=${encodeURIComponent(sort)}&order=${encodeURIComponent(order)}`);
  allSessions=sessions;
  renderList();
}
function filteredSessions(){
  const q=$("#filter").value.trim().toLowerCase();
  if(!q) return allSessions;
  return allSessions.filter(s=> (s.preview||"").toLowerCase().includes(q) || s.short_id.toLowerCase().includes(q) || s.id.toLowerCase().includes(q) || s.status.toLowerCase().includes(q));
}
function renderList(){
  const sessions=filteredSessions();
  $("#count").textContent = sessions.length ? `${Math.min(sessions.length, displayLimit)} / ${sessions.length}` : "";
  if(!sessions.length){ listEl.innerHTML=`<div class="hint">No sessions yet. Create one.</div>`; return; }
  const slice = sessions.slice(0, displayLimit);
  let html = slice.map(rowHtml).join("");
  if(sessions.length > displayLimit) html += `<div class="hint"><button class="ghost" id="showAll">Show all (${sessions.length})</button></div>`;
  listEl.innerHTML=html;
  listEl.querySelectorAll(".row").forEach(el=>{
    el.addEventListener("click",()=>select(el.dataset.id));
    if(selected && el.dataset.id===selected) el.classList.add("active");
  });
  const btn=$("#showAll");
  if(btn) btn.addEventListener("click",()=>{ displayLimit=sessions.length; renderList(); });
}
async function select(id){
  selected=id;
  document.querySelectorAll(".row").forEach(el=>el.classList.toggle("active", el.dataset.id===id));
  emptyEl.style.display="none";
  composerEl.style.display="flex";
  detailHead.style.display="flex";
  historyEl.innerHTML=`<div class="hint">Loading…</div>`;
  closeStream();
  try{
    const data=await api(`/api/sessions/${id}`);
    const s=data.session;
    $("#detailId").textContent=s.short_id+" · "+s.id;
    $("#detailStatus").textContent=s.status; $("#detailStatus").className="badge status "+s.status;
    $("#detailDir").textContent=s.working_directory;
    $("#detailModel").textContent=s.model_name;
    // prefer structured messages (user+assistant) if available, fallback to legacy history
    if(data.messages && data.messages.length){
      renderHistory(data.messages);
    } else {
      renderHistory(data.history||[]);
    }
    seedSeenFromDom();
    openStream(id, data.last_event_seq);
  }catch(e){ historyEl.innerHTML=`<div class="hint">Error: ${esc(e.message)}</div>`; }
}
function renderHistory(items){
  if(!items.length){ historyEl.innerHTML=`<div class="hint">No output yet. Send a message.</div>`; return; }
  // structured messages: {role, content}
  if(typeof items[0]==='object' && items[0].role){
    historyEl.innerHTML=items.map(m=>{
      const cls = m.role==="user" ? "user" : "output";
      return `<div class="bubble ${cls}">${esc(m.content)}</div>`;
    }).join("");
  } else {
    historyEl.innerHTML=items.map(c=>`<div class="bubble output">${esc(c)}</div>`).join("");
  }
  historyEl.scrollTop=historyEl.scrollHeight;
}
function seedSeenFromDom(){
  seenContent=new Set();
  historyEl.querySelectorAll(".bubble").forEach(b=>{
    const k=norm(b.textContent);
    if(k) seenContent.add(k);
  });
}
function appendChunk(text){
  if(!text) return;
  // skip content already rendered (seeded from DOM / finalized streaming buffer);
  // live content is otherwise governed by the server's seq cursor, not this set
  const k=norm(text);
  if(!k || seenContent.has(k)) return;
  // remove initial hint if present
  const hint=historyEl.querySelector(".hint");
  if(hint) hint.remove();
  const div=document.createElement("div");
  div.className="bubble output";
  div.textContent=text;
  historyEl.appendChild(div);
  historyEl.scrollTop=historyEl.scrollHeight;
}
function ensureStreamingBubble(){
  if(streamingBubble) return streamingBubble;
  const hint=historyEl.querySelector(".hint");
  if(hint) hint.remove();
  streamingBubble=document.createElement("div");
  streamingBubble.className="bubble output streaming";
  streamingBubble.textContent="";
  historyEl.appendChild(streamingBubble);
  return streamingBubble;
}
function flushStreaming(){
  rafPending=false;
  if(!streamingBubble) return;
  streamingBubble.textContent=streamingBuffer;
  historyEl.scrollTop=historyEl.scrollHeight;
}
function appendToken(content){
  if(!content) return;
  streamingBuffer += content;
  ensureStreamingBubble();
  if(!rafPending){
    rafPending=true;
    requestAnimationFrame(flushStreaming);
  }
}
function finalizeStreaming(){
  if(streamingBubble){
    // remember the streamed text so a later turn_completed whole-chunk (which
    // carries the same final output) is not rendered a second time
    const k=norm(streamingBuffer);
    if(k) seenContent.add(k);
    streamingBubble.classList.remove("streaming");
    // dedup: finalize once, reset buffer for next turn
    streamingBubble=null;
  }
  streamingBuffer="";
  rafPending=false;
}
function openStream(id, fromSeq){
  // SSE-only: browser EventSource auto-reconnect + server cursor replay
  // (stable `id:` seqs / Last-Event-ID) handle drops — no polling fallback.
  try{
    const seq = Number.isInteger(fromSeq) ? fromSeq : 0;
    es=new EventSource(`/api/sessions/${id}/stream?from_seq=${seq}`);
    // typed listeners (require Bridge to emit `event: <type>`)
    const onChunk = (e)=>{
      try{
        const data=JSON.parse(e.data);
        const c = data.content || data.text || "";
        if(typeof c==="string" && c) appendToken(c);
      }catch(_){ if(e.data) appendToken(e.data); }
    };
    es.addEventListener("generation_chunk", onChunk);
    es.addEventListener("generation_started", ()=>{ streamingBuffer=""; ensureStreamingBubble(); });
    es.addEventListener("generation_completed", ()=>{ finalizeStreaming(); });
    es.addEventListener("turn_started", (e)=>{
      try{
        const d=JSON.parse(e.data);
        streamingBuffer=""; ensureStreamingBubble();
        if(d.prompt) streamingBubble.textContent="…";
      }catch(_){}
    });
    es.addEventListener("turn_completed", (e)=>{
      finalizeStreaming();
      try{
        const d=JSON.parse(e.data);
        const out = d.result ? (d.result.output || "") : (d.content||d.output||"");
        // appendChunk dedups against the finalized streaming bubble via seenContent
        if(typeof out==="string" && out.trim()) appendChunk(out.trim());
      }catch(_){}
    });
    es.addEventListener("turn_canceled", (e)=>{
      finalizeStreaming();
      let reason=""; try{ reason=JSON.parse(e.data).cancellation_reason||"";}catch(_){}
      const div=document.createElement("div");
      div.className="bubble cancel";
      div.textContent="✕ canceled"+(reason?" ("+reason+")":"");
      historyEl.appendChild(div);
      historyEl.scrollTop=historyEl.scrollHeight;
    });
    es.addEventListener("tool_call_completed", (e)=>{
      try{
        const d=JSON.parse(e.data);
        const act=d.activity||{};
        const line=`tool> ${act.action||d.tool||"tool"}: ${act.status||"ok"}`;
        const div=document.createElement("div");
        div.className="bubble tool";
        div.textContent=line;
        historyEl.appendChild(div);
        historyEl.scrollTop=historyEl.scrollHeight;
      }catch(_){}
    });
    // StreamBody fallback mode emits named SSE events: `output` (live chunk)
    // and `history` (replay). Named events never reach onmessage — they need
    // explicit listeners, otherwise live content only appears on refresh.
    const onWholeChunk = (e)=>{
      let txt;
      try{ const d=JSON.parse(e.data); txt = d.content || d.output || e.data; }catch(_){ txt = e.data; }
      if(typeof txt==="string" && txt.trim()){
        // avoid duplicate of the streaming buffer
        if(streamingBuffer && txt.trim().slice(0,60)===streamingBuffer.slice(0,60)) return;
        finalizeStreaming();
        appendChunk(txt.trim());
      }
    };
    es.addEventListener("output", onWholeChunk);
    es.addEventListener("history", onWholeChunk);
    es.onmessage=e=>{
      // fallback for generic events without `event:` field
      try{
        const data=JSON.parse(e.data);
        if(data.type==="history" || data.type==="output"){
          const txt=data.content||data.output||e.data;
          if(typeof txt==="string" && txt.trim()){
            // avoid duplicate of streaming buffer
            if(streamingBuffer && txt.trim().slice(0,60)===streamingBuffer.slice(0,60)) return;
            finalizeStreaming();
            appendChunk(txt.trim());
          }
          return;
        }
        // if data contains typed field but was sent without event:, handle chunk
        if(data.type==="generation_chunk"){
          const c=data.content||data.text||"";
          if(c) appendToken(c);
          return;
        }
        if(data.type==="turn_canceled"){
          finalizeStreaming();
          const div=document.createElement("div");
          div.className="bubble cancel";
          div.textContent="✕ canceled"+(data.cancellation_reason?" ("+data.cancellation_reason+")":"");
          historyEl.appendChild(div);
          historyEl.scrollTop=historyEl.scrollHeight;
          return;
        }
        const txt=data.content||data.output||e.data;
        if(typeof txt==="string" && txt.trim()) appendChunk(txt.trim());
      }catch(_){ if(e.data && e.data.trim() && e.data!==": ping") appendChunk(e.data.trim()); }
    };
    // lightweight: native EventSource auto-reconnect + server cursor replay
    // (Last-Event-ID) are the resilience story — no polling revival here
    es.onerror=()=>{};
  }catch(_){}
}
function closeStream(){ streamingBubble=null; streamingBuffer=""; rafPending=false; if(es){ try{es.close()}catch(_){} es=null; } }

async function createSession(){
  const prompt=$("#newPrompt").value.trim();
  if(!prompt) return;
  $("#create").disabled=true;
  try{ const s=await api("/api/sessions", {method:"POST", body:JSON.stringify({prompt})}); await refresh(); select(s.id); $("#newPrompt").value=""; }catch(e){ alert(e.message); } finally{ $("#create").disabled=false; }
}
async function sendTurn(){
  if(!selected) return;
  const ta=$("#prompt"); const prompt=ta.value.trim(); if(!prompt) return;
  // optimistic user bubble
  const hint=historyEl.querySelector(".hint");
  if(hint) hint.remove();
  finalizeStreaming();
  const userDiv=document.createElement("div");
  userDiv.className="bubble user";
  userDiv.textContent=prompt;
  historyEl.appendChild(userDiv);
  historyEl.scrollTop=historyEl.scrollHeight;
  $("#send").disabled=true;
  try{ await api(`/api/sessions/${selected}/turn`, {method:"POST", body:JSON.stringify({prompt})}); ta.value=""; }catch(e){ alert(e.message); } finally{ $("#send").disabled=false; ta.focus(); }
}

$("#refresh").addEventListener("click", ()=>{ displayLimit=100; refresh(); });
$("#create").addEventListener("click", createSession);
$("#newPrompt").addEventListener("keydown", e=>{ if(e.key==="Enter") createSession(); });
$("#newBtn").addEventListener("click", ()=>{ $("#newPrompt").focus(); });
$("#send").addEventListener("click", sendTurn);
$("#prompt").addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendTurn(); }});
$("#stopBtn").addEventListener("click", async()=>{
  if(!selected) return;
  if(!confirm("Stop session "+selected+"?")) return;
  await api(`/api/sessions/${selected}/stop`, {method:"POST", body: JSON.stringify({})}); refresh();
});
$("#cancelBtn").addEventListener("click", async()=>{
  if(!selected) return;
  $("#cancelBtn").disabled=true;
  try{ await api(`/api/sessions/${selected}/cancel`, {method:"POST", body: JSON.stringify({reason:"user"})}); }catch(e){ alert(e.message); } finally{ $("#cancelBtn").disabled=false; }
});
// sort/order/filter wiring
(function initControls(){
  const sortSel=$("#sortSel"), orderBtn=$("#orderBtn"), filterEl=$("#filter");
  sortSel.value=getSort();
  function updateOrderBtn(){ const o=getOrder(); orderBtn.textContent = o==="desc" ? "↓ Desc" : "↑ Asc"; }
  updateOrderBtn();
  sortSel.addEventListener("change", ()=>{ setSort(sortSel.value); displayLimit=100; refresh(); });
  orderBtn.addEventListener("click", ()=>{ const cur=getOrder(); const nxt=cur==="desc"?"asc":"desc"; setOrder(nxt); updateOrderBtn(); displayLimit=100; refresh(); });
  filterEl.addEventListener("input", ()=>{ displayLimit=100; renderList(); });
})();
refresh();
</script>
</body>
</html>
