<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chi Web</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family: ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#0b0d11;color:#e6e8eb;height:100vh;display:flex;flex-direction:column}
.brand-start{text-align:center;padding:24px 0 8px;font-size:22px;letter-spacing:.02em;color:#e6e8eb}
.brand-start span{color:#7aa5ff}
.brand-start small{display:block;font-size:12px;color:#8b949e;margin-top:4px}
button,input,textarea{font:inherit}
button{background:#1f6feb;border:0;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}
button.ghost{background:#22262f;color:#c9d1d9}
button.danger{background:#da3633}
button:disabled{opacity:.5;cursor:not-allowed}
main{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px;overflow:auto;background:#0b0d11;min-height:0}
#topStrip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-height:88px;align-content:start;transition:opacity 280ms ease, transform 280ms ease}
#topStrip:empty{display:grid}
#topStrip.loading, #gridList.loading{opacity:.75}
#center{flex:1;display:flex;flex-direction:column;min-height:45vh;background:#151821;border:1px solid #1f232b;border-radius:12px;overflow:hidden}
#stage{flex:1;display:flex;flex-direction:column;position:relative;min-height:260px;background:#0b0d11;overflow:hidden}
#firstPeek{display:none;padding:8px 12px;background:#9fddd0;color:#0b0d11;font-size:13px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#firstPeek.visible{display:block}
#composer #cancelBtn{background:#da3633;font-size:12px;padding:6px 10px;min-height:28px}
#history{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#0b0d11;min-height:160px}
.bubble{background:#151821;border:1px solid #1f232b;border-radius:12px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5}
.bubble.output{border-left:3px solid #1f6feb}
.bubble.output.streaming{border-left-color:#58a6ff;opacity:.95}
.turn-timing{margin-top:8px;color:#8b949e;font-size:11px;font-variant-numeric:tabular-nums}
.turn-timing.live{color:#58a6ff}
.bubble.output.markdown{white-space:normal}
.bubble.output.markdown pre{overflow:auto;padding:10px;border-radius:8px;background:#0f1115}
.bubble.output.markdown code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.bubble.output.markdown p,.bubble.output.markdown ul,.bubble.output.markdown ol,.bubble.output.markdown blockquote,.bubble.output.markdown table{margin:0 0 10px}
.bubble.output.markdown p:last-child,.bubble.output.markdown ul:last-child,.bubble.output.markdown ol:last-child,.bubble.output.markdown blockquote:last-child,.bubble.output.markdown table:last-child{margin-bottom:0}
.bubble.output.markdown ul,.bubble.output.markdown ol{padding-left:1.5em}
.bubble.output.markdown li+li{margin-top:3px}
.bubble.output.markdown li>ul,.bubble.output.markdown li>ol{margin:3px 0 0}
.bubble.output.markdown blockquote{border-left:3px solid #484f58;padding-left:12px;color:#8b949e}
.bubble.output.markdown table{border-collapse:collapse;display:block;max-width:100%;overflow:auto}
.bubble.output.markdown th,.bubble.output.markdown td{border:1px solid #30363d;padding:5px 8px}
.markdown-warning{margin:0 16px 4px;padding:8px 10px;border:1px solid #d29922;border-radius:8px;background:#2b2108;color:#f2cc60;font-size:12px;line-height:1.4}
.bubble.user{border-left:3px solid #7aa5ff;background:#1b2336;align-self:flex-end;max-width:85%;margin-left:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bubble.user.queued{border-left-style:dashed;opacity:.8}
.bubble.user.steered{border-left-style:dashed;border-left-color:#8ec5ff;opacity:.9}
.bubble.user.failed{border-left-color:#f85149;opacity:.8}
.bubble.user .state-badge{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.08);color:#dfe8ff;font-size:11px;line-height:1.2;white-space:nowrap;flex-shrink:0}
.bubble.user .state-badge::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.bubble.user.queued .state-badge::before{background:#9ecbff;box-shadow:0 0 0 1px rgba(158,203,255,.35)}
.bubble.user.steered .state-badge::before{background:#8ec5ff;box-shadow:0 0 0 1px rgba(142,197,255,.4)}
.bubble.user.failed .state-badge::before{background:#f85149;box-shadow:0 0 0 1px rgba(248,81,73,.4)}
.bubble.user .origin-label{font-size:11px;color:#9aa4b2;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0}
.bubble.user .user-message{flex:1;min-width:0}
.bubble.user blockquote{border-left:3px solid #484f58;padding-left:10px;color:#9aa4b2;margin:2px 0 6px}
.bubble.user blockquote:last-child{margin-bottom:0}
.bubble.tool{border-left:3px solid #238636;background:#0f1a12;font-size:13px;color:#c9d1d9}
.bubble.cancel{border-left:3px solid #f85149;background:#1a0f0f;color:#ff7b72;font-size:13px}
.bubble.recap{border-left:3px solid #d2a8ff;background:#1b1626;font-size:13px}
.bubble.recap summary{cursor:pointer;color:#d2a8ff;font-size:12px}
.bubble.recap .recap-body{white-space:pre-wrap;margin-top:6px}
.bubble.activity{border-left:3px solid #388bfd;background:#0d1218;padding:8px 12px}
.bubble.activity>summary{cursor:pointer;color:#8b949e;font-size:13px;font-weight:600;user-select:none;list-style:none}
.bubble.activity>summary::-webkit-details-marker{display:none}
.bubble.activity>summary::before{content:"▸ ";color:#388bfd}
.bubble.activity[open]>summary::before{content:"▾ "}
.activity-body{margin-top:6px}
.activity-row{display:flex;gap:8px;align-items:baseline;font-size:13px;color:#c9d1d9;padding:5px 2px;border-top:1px solid #14171e}
.activity-row:first-child{border-top:none}
.activity-status{font-size:11px;min-width:52px;text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.activity-status.running{color:#d29922}
.activity-status.ok{color:#3fb950}
.activity-status.error{color:#f85149}
.activity-tool{color:#79c0ff;font-weight:600}
.activity-params{color:#8b949e;word-break:break-all}
.activity-output{margin:4px 0 2px 60px;font-size:12px;color:#8b949e;white-space:pre-wrap;word-break:break-word;background:#0b0d11;border-radius:6px;padding:6px 8px;max-height:160px;overflow:auto}
.bubble.thinking{border-left:3px solid #8957e5;background:#12101a;padding:8px 12px}
.bubble.thinking>summary{cursor:pointer;color:#8b949e;font-size:13px;font-weight:600;font-style:italic;user-select:none;list-style:none}
.bubble.thinking>summary::-webkit-details-marker{display:none}
.bubble.thinking>summary::before{content:"▸ ";color:#8957e5}
.bubble.thinking[open]>summary::before{content:"▾ "}
.thinking-body{margin-top:6px;font-size:13px;color:#a89bc4;white-space:pre-wrap;word-break:break-word;font-style:italic;max-height:240px;overflow:auto}
.bubble.question{border-left:3px solid #d29922;background:#181510;padding:10px 12px}
.bubble.command{border-left:3px solid #6e7681;background:#14161b;font-size:13px}
.bubble.command.busy{border-left-color:#d29922}
.bubble.command.failed{border-left-color:#f85149}
.command-line{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#9aa4b2}
.command-output{margin:6px 0 0;white-space:pre-wrap;font-size:12px;color:#c9d1d9}
.bubble.continue{border-left:3px solid #58a6ff;background:#10151d;padding:10px 12px}
.bubble.continue.resolved{border-left-color:#8b949e;opacity:.8}
.continue-text{font-size:14px;color:#e6e8eb;margin-bottom:6px}
.continue-context{font-size:12px;color:#9aa4b2;margin-bottom:8px;white-space:pre-wrap}
.continue-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.continue-reason{flex:1;min-width:140px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#e6e8eb;padding:6px 8px}
.bubble.question.submitting{opacity:.7}
.bubble.question.answered{border-left-color:#3fb950}
.bubble.question.cancelled{border-left-color:#8b949e;opacity:.75}
.question-header{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#d29922;margin-bottom:4px}
.question-text{font-size:14px;color:#e6e8eb;margin-bottom:8px;white-space:pre-wrap}
.question-options{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.question-option{display:flex;gap:8px;align-items:center;font-size:13px;color:#c9d1d9;padding:6px 8px;border:1px solid #1f232b;border-radius:8px;cursor:pointer}
.question-option:hover{background:#1b1f27}
.question-option.selected{border-color:#3fb950;color:#e6e8eb}
.question-option input{margin:0;accent-color:#d29922}
.question-freeform{width:100%;box-sizing:border-box;background:#0f1115;border:1px solid #1f232b;color:#e6e8eb;padding:8px 10px;border-radius:8px;font-size:13px;margin-bottom:8px}
.question-error{color:#f85149;font-size:12px;margin-bottom:8px}
.question-error.hidden{display:none}
.question-result{margin-top:6px;font-size:12px;color:#3fb950;font-weight:600}
.bubble.question.cancelled .question-result{color:#8b949e}
.question-submit{align-self:flex-end;font-size:13px}
.question-dismiss{font-size:13px;margin-left:8px}
.bubble.question.approval{border-left-color:#f0883e;background:#1c1410}
.bubble.question.approval .question-header{color:#f0883e}
.bubble.question.approval.answered.denied{border-left-color:#f85149}
.bubble.question.approval.answered.denied .question-result{color:#f85149}
.bubble.question.approval.answered.denied .question-option.selected{border-color:#f85149}
.approval-details{margin-bottom:8px;font-size:13px;color:#c9d1d9}
.approval-tool{font-weight:700;color:#e6e8eb;margin-bottom:4px}
.approval-what{margin:0 0 6px;padding:8px 10px;background:#0f1115;border:1px solid #3d2a1a;border-radius:6px;white-space:pre-wrap;word-break:break-all;color:#f0c674;font-size:12.5px}
.approval-where,.approval-why{font-size:12px;color:#8b949e;word-break:break-all}
.approval-why{color:#e3b341}
.approval-label{color:#6e7681}
.bubble.guardrail-warning{border-left:3px solid #f85149;background:#1f1214;color:#ffa198;font-size:13px;padding:8px 12px;white-space:pre-wrap}
.hint{color:#8b949e;font-size:13px;padding:12px}
#annotateBtn{position:fixed;z-index:20;font-size:12px;padding:4px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
#annotateBtn[hidden]{display:none}
#composer{padding:12px;border-top:1px solid #1f232b;gap:8px;background:#0f1115;display:flex}
#composer textarea{flex:1;min-height:44px;max-height:160px;resize:vertical;background:#0f1115;border:1px solid #1f232b;color:#e6e8eb;padding:10px 12px;border-radius:10px}
#composer .actions-col{display:flex;flex-direction:column;gap:6px;align-items:stretch;width:132px;flex-shrink:0}
#composer .actions-col button{white-space:nowrap}
#composer .actions-col .split{display:flex;gap:4px}
#composer #actionBtn{min-width:96px;flex:1}
#composer #actionMenuBtn{width:32px;min-width:32px;visibility:hidden}
#composer #createAltBtn{font-size:12px;padding:6px 10px;min-height:28px;visibility:hidden}
#composer .actions-col.ready #actionMenuBtn{visibility:visible}
#composer .actions-col.has-selection #createAltBtn{visibility:visible}
#composer #actionMenu{position:absolute;right:12px;bottom:52px;background:#1f242f;border:1px solid #2d333f;border-radius:8px;padding:4px;display:none;flex-direction:column;gap:2px;z-index:10;min-width:180px}
#composer #actionMenu.visible{display:flex}
#composer #actionMenu button{justify-content:flex-start;background:transparent;color:#e6e8eb;padding:8px 10px;border-radius:6px;text-align:left}
#composer #actionMenu button:hover{background:#22262f}
#infoBar{display:flex;padding:10px 12px;border-top:1px solid #1f232b;background:#d4a72c;color:#0b0d11;gap:10px;align-items:flex-start;flex-wrap:wrap;flex-shrink:0;min-height:56px;transition:opacity 280ms ease, min-height 300ms ease}
#infoBar.visible{display:flex}
#infoBar .idle{font-size:13px;line-height:1.4}
#infoBar .idle small{font-size:11px;opacity:.85}
#infoBar .idle code{font-family:ui-monospace,monospace;font-size:11px;background:#0002;padding:1px 4px;border-radius:4px}
#infoBar .info{flex:1;min-width:0;font-size:13px;line-height:1.4;word-break:break-word;display:flex;flex-direction:column;gap:2px}
#infoBar .meta{font-size:11px;opacity:.9;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#infoBar .meta .id{font-family:ui-monospace,monospace;font-weight:700;font-size:12px}
#infoBar .meta .status{font-size:11px;padding:2px 6px;border-radius:999px;background:#0002;color:#0b0d11;border:1px solid #0001}
#infoBar .meta .dir{font-family:ui-monospace,monospace;font-size:11px;opacity:.75;word-break:break-all}
#infoBar .meta .model{font-size:11px;padding:2px 6px;border-radius:6px;background:#0001}
#infoBar .meta .model.served-mismatch{background:#f5a62333}
#infoBar .preview-line{font-size:13px;word-break:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;line-height:1.4;max-height:2.8em}
#infoBar .preview-line .preview, #infoBar .preview-line .mem{word-break:break-word}
#infoBar .mem{font-size:12px;opacity:.9}
#infoBar button{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600}
#infoBar button.ghost{color:#0b0d11;background:#fff3}
#empty{position:absolute;inset:0;display:grid;place-items:center;color:#8b949e;padding:24px;text-align:center;background:#0b0d11;z-index:1}
#empty.hidden{display:none !important}
#empty .brand-start{font-size:clamp(28px,5vw,38px);font-weight:700;letter-spacing:.02em;color:#e6e8eb;padding:0}
#empty .brand-start span{color:#7aa5ff}
#empty .brand-start small{display:none}
#bottomArea{display:flex;flex-direction:column;gap:8px}
#bottomHead{display:flex;gap:8px;align-items:center}
#bottomHead input{flex:1;background:#151821;border:1px solid #1f232b;color:#e6e8eb;padding:8px 10px;border-radius:8px}
#bottomHead .count{font-size:11px;color:#8b949e;white-space:nowrap;min-width:72px;text-align:right;font-variant-numeric:tabular-nums}
#gridList{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-height:216px;min-height:80px;overflow:auto;padding:2px;transition:opacity 300ms ease}
#gridList:empty::after{content:"No sessions";color:#8b949e;font-size:13px;padding:12px}
.card.skeleton{pointer-events:none;border-style:dashed;opacity:.9;animation:skeleton-pulse 1.2s ease-in-out infinite}
.card.skeleton .line{height:10px;background:#22262f;border-radius:6px}
.card.skeleton .line.short{width:42%}
.card.skeleton .line.long{width:78%}
.card.skeleton .line.long2{width:62%}
.card.skeleton .line.tiny{width:30%;height:8px}
@keyframes skeleton-pulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
#topStrip:not(.loading) .card, #gridList:not(.loading) .card{animation:fadeIn .28s ease}
.card{padding:12px;border-radius:10px;background:#151821;border:1px solid #1f232b;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:72px}
.card:hover{border-color:#2d333f;background:#1a1f2b}
.card.active{background:#1b2336;border-color:#223150}
.card .id{font-family:ui-monospace,monospace;font-size:11px;color:#8b949e}
.card .preview{font-size:13px;color:#e6e8eb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topStrip .card .preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gridList .card .preview{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;word-break:break-word;line-height:1.4}
.card .meta{font-size:11px;color:#8b949e;display:flex;gap:6px;align-items:center}
.card .status{font-size:11px;padding:2px 6px;border-radius:999px;background:#22262f;color:#8b949e}
.status.running{background:#1a2e1a;color:#7ee787}
.status.idle{background:#22262f}
.status.completed{background:#1a2336;color:#7aa5ff}
.status.error{background:#3d1f1f;color:#ff7b72}
.card .owner{font-size:11px;padding:2px 6px;border-radius:999px}
.card .owner.worker{background:#1a2e1a;color:#7ee787}
.card .owner.tui{background:#2e2a1a;color:#e3b341}
@media(max-width:900px){
  #topStrip{grid-template-columns:1fr}
  #gridList{grid-template-columns:1fr;max-height:216px}
}
@media(max-width:600px){
  #composer .actions-col{width:auto}
  #composer #actionBtn{min-width:72px}
}
body.zen #topStrip, body.zen #bottomArea, body.zen #firstPeek{display:none !important}
body.zen #topStrip[style], body.zen #firstPeek[style]{display:none !important}
body.zen #center{flex:1;min-height:0;overflow:hidden}
body.zen main{padding:8px;gap:8px;overflow:hidden;min-height:0}
body.zen #stage{flex:1;min-height:0;overflow:hidden}
body.zen #history{flex:1;min-height:0;overflow:auto}
a{color:#7aa5ff}
</style>
</head>
<body>
<main>
  <section id="topStrip" aria-label="Latest sessions" class="loading"><div class="card skeleton"><div class="line short"></div><div class="line long"></div><div class="meta"><span class="line tiny" style="display:inline-block"></span></div></div><div class="card skeleton"><div class="line short"></div><div class="line long"></div><div class="meta"><span class="line tiny" style="display:inline-block"></span></div></div><div class="card skeleton"><div class="line short"></div><div class="line long"></div><div class="meta"><span class="line tiny" style="display:inline-block"></span></div></div></section>
  <section id="center">
    <div id="firstPeek"></div>
    <div id="stage">
      <div id="markdownWarning" class="markdown-warning" hidden></div>
      <div id="history"></div>
      <div id="empty"><div class="brand-start"><span>Chi</span> Web</div></div>
    </div>
    <div id="composer" style="position:relative">
      <textarea id="prompt" placeholder="New session prompt — press Enter to create (Shift+Enter for newline)"></textarea>
      <div class="actions-col">
        <div class="split">
          <button id="actionBtn">Create</button>
          <button id="actionMenuBtn" class="ghost" title="More actions" style="padding:8px 10px">▾</button>
        </div>
        <button id="createAltBtn" class="ghost" style="visibility:hidden">Create new</button>
        <button id="cancelBtn" title="Cancel the running turn, whoever sent it" style="display:none">Cancel</button>
      </div>
      <div id="actionMenu">
        <button data-action="send">Send to current session</button>
        <button data-action="create">Create new session</button>
      </div>
    </div>
    <div id="infoBar">
      <div class="info" id="infoText"><div class="idle">No session selected — select one above or type a prompt below to start a new session.</div></div>
      <button class="danger" id="infoStopBtn" title="Stop session (terminate worker)" style="display:none">stop</button>
      <button class="ghost" id="zenBtn" title="Zen mode (z / Esc)">zen</button>
    </div>
  </section>
  <section id="bottomArea">
    <div id="bottomHead">
      <input id="filter" placeholder="Search… (preview / id / status)">
      <span class="count" id="count">loading…</span>
    </div>
    <div id="gridList" class="loading"><div class="card skeleton"><div class="line short"></div><div class="line long"></div><div class="line long2"></div><div class="meta"><span class="line tiny" style="display:inline-block"></span></div></div><div class="card skeleton"><div class="line short"></div><div class="line long"></div><div class="line long2"></div><div class="meta"><span class="line tiny" style="display:inline-block"></span></div></div><div class="card skeleton"><div class="line short"></div><div class="line long"></div><div class="line long2"></div><div class="meta"><span class="line tiny" style="display:inline-block"></span></div></div><div class="card skeleton"><div class="line short"></div><div class="line long"></div><div class="line long2"></div><div class="meta"><span class="line tiny" style="display:inline-block"></span></div></div><div class="card skeleton"><div class="line short"></div><div class="line long"></div><div class="line long2"></div><div class="meta"><span class="line tiny" style="display:inline-block"></span></div></div><div class="card skeleton"><div class="line short"></div><div class="line long"></div><div class="line long2"></div><div class="meta"><span class="line tiny" style="display:inline-block"></span></div></div></div>
  </section>
</main>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
