<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chi Web</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family: ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#0f1115;color:#e6e8eb;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #1f232b;background:#151821}
h1{font-size:16px;letter-spacing:.02em}
h1 span{color:#7aa5ff}
header .actions{display:flex;gap:8px;align-items:center}
button,input,textarea,select{font:inherit}
button{background:#1f6feb;border:0;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}
button.ghost{background:#22262f;color:#c9d1d9}
button:disabled{opacity:.5;cursor:not-allowed}
select{background:#151821;border:1px solid #1f232b;color:#e6e8eb;padding:6px 8px;border-radius:8px}
main{flex:1;display:flex;min-height:0}
#sidebar{width:360px;min-width:260px;border-right:1px solid #1f232b;background:#0f1115;display:flex;flex-direction:column}
#sidebar .sb-head{padding:10px 12px;border-bottom:1px solid #1f232b;display:flex;gap:8px;align-items:center}
#sidebar .sb-head input{flex:1;background:#151821;border:1px solid #1f232b;color:#e6e8eb;padding:8px 10px;border-radius:8px}
#sidebar .sb-opts{padding:8px 12px;border-bottom:1px solid #1f232b;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#sidebar .sb-opts input{flex:1;min-width:120px;background:#151821;border:1px solid #1f232b;color:#e6e8eb;padding:6px 8px;border-radius:8px}
#sidebar .sb-opts .count{font-size:11px;color:#8b949e;white-space:nowrap}
#list{overflow:auto;flex:1;padding:8px}
.row{display:flex;gap:8px;padding:10px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.row:hover{background:#151821;border-color:#1f232b}
.row.active{background:#1b2336;border-color:#223150}
.row .meta{flex:1;min-width:0}
.row .id{font-family:ui-monospace,monospace;font-size:12px;color:#8b949e}
.row .preview{font-size:13px;color:#e6e8eb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .status{font-size:11px;padding:2px 6px;border-radius:999px;background:#22262f;color:#8b949e;height:fit-content}
.status.running{background:#1a2e1a;color:#7ee787}
.status.idle{background:#22262f}
.status.completed{background:#1a2336;color:#7aa5ff}
.status.error{background:#3d1f1f;color:#ff7b72}
#detail{flex:1;display:flex;flex-direction:column;min-width:0}
#detailHead{padding:10px 12px;border-bottom:1px solid #1f232b;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#0f1115}
#detailHead .badge{font-size:12px;color:#8b949e}
#history{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#0b0d11}
.bubble{background:#151821;border:1px solid #1f232b;border-radius:12px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5}
.bubble.output{border-left:3px solid #1f6feb}
.bubble.output.streaming{border-left-color:#58a6ff;opacity:.95}
.bubble.user{border-left:3px solid #7aa5ff;background:#1b2336;align-self:flex-end;max-width:85%;margin-left:auto}
.bubble.tool{border-left:3px solid #238636;background:#0f1a12;font-size:13px;color:#c9d1d9}
.bubble.cancel{border-left:3px solid #f85149;background:#1a0f0f;color:#ff7b72;font-size:13px}
.hint{color:#8b949e;font-size:13px;padding:12px}
#composer{padding:12px;border-top:1px solid #1f232b;display:flex;gap:8px;background:#0f1115}
#composer textarea{flex:1;min-height:44px;max-height:160px;resize:vertical;background:#151821;border:1px solid #1f232b;color:#e6e8eb;padding:10px 12px;border-radius:10px}
#empty{flex:1;display:grid;place-items:center;color:#8b949e;padding:24px;text-align:center}
a{color:#7aa5ff}
</style>
</head>
<body>
<header>
  <h1><span>Chi</span> Web</h1>
  <div class="actions">
    <button class="ghost" id="refresh">Refresh</button>
    <button id="newBtn">New session</button>
  </div>
</header>
<main>
  <section id="sidebar">
    <div class="sb-head">
      <input id="newPrompt" placeholder="New session prompt — press Enter">
      <button id="create">Create</button>
    </div>
    <div class="sb-opts">
      <select id="sortSel" title="Sort sessions"><option value="updated_at">Updated</option><option value="created_at">Created</option></select>
      <button class="ghost" id="orderBtn" title="Toggle order">↓ Desc</button>
      <input id="filter" placeholder="Filter…">
      <span class="count" id="count"></span>
    </div>
    <div id="list"></div>
  </section>
  <section id="detail">
    <div id="detailHead" style="display:none">
      <strong id="detailId" style="font-family:ui-monospace,monospace"></strong>
      <span class="badge" id="detailStatus"></span>
      <span class="badge" id="detailDir"></span>
      <span class="badge" id="detailModel"></span>
      <button class="ghost" id="cancelBtn" title="Cancel current turn">Cancel</button>
      <button class="ghost" id="stopBtn">Stop</button>
    </div>
    <div id="history"></div>
    <div id="empty">Select a session or create one. <br><small>Sessions are stored in <code>~/.local/state/samagotchi/sessions</code>.</small></div>
    <div id="composer" style="display:none">
      <textarea id="prompt" placeholder="Send a message… (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="send">Send</button>
    </div>
  </section>
</main>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
