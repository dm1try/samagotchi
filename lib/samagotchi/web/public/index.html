<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chi</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0b0d11;--bg-panel:#151821;--bg-inset:#0f1115;--bg-raised:#22262f;--bg-hover:#1b1f27;--border:#1f232b;--border-strong:#2d333f;--text:#e6e8eb;--text-bright:#f0f3f6;--text-2:#c9d1d9;--text-3:#9aa4b2;--text-muted:#8b949e;--text-faint:#6e7681;--accent:#7aa5ff;--accent-strong:#1f6feb;--accent-bg:#1b2336;--accent-ring:rgba(122,165,255,.18);--primary:#2a68d1;--ok:#3fb950;--ok-text:#7ee787;--ok-bg:#1a2e1a;--warn:#d29922;--warn-text:#e3b341;--warn-bright:#f2cc60;--warn-bg:#2b2108;--warn-border:#6b5416;--danger:#f85149;--danger-bg:#da3633;--danger-text:#ff7b72;--danger-bg-dim:#3d1f1f;--think:#8957e5;--think-text:#d2a8ff;--accent-border:#223150;--accent-tint:color-mix(in srgb,var(--accent) 7%,transparent);
  --glass-bg:color-mix(in srgb,var(--bg-panel) 70%,transparent);--glass-border:rgba(255,255,255,.08);--glass-highlight:rgba(255,255,255,.05);--glass-shadow:0 8px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family: ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1100px 700px at 8% 0%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 70%),radial-gradient(900px 700px at 100% 100%,color-mix(in srgb,var(--think) 9%,transparent),transparent 70%),var(--bg);background-attachment:fixed;color:var(--text);height:100vh;display:flex;flex-direction:column}
/* Glass: the composer card, the strip cards, the all-sessions cards and the question cards (by selector, so app.js is untouched). */
#dock,#topStrip .card,#allList .card,.bubble.question{background:var(--glass-bg);-webkit-backdrop-filter:blur(18px) saturate(1.35);backdrop-filter:blur(18px) saturate(1.35);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-highlight),var(--glass-shadow)}
#topStrip .card:hover,#allList .card:hover{background:color-mix(in srgb,var(--bg-hover) 75%,transparent);border-color:rgba(255,255,255,.14)}
#topStrip .card.active,#allList .card.active{background:color-mix(in srgb,var(--accent-bg) 75%,transparent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){#dock,#topStrip .card,#allList .card,#allHead input{background:var(--bg-panel)}.bubble.question{background:color-mix(in srgb,var(--warn) 7%,var(--bg-panel))}}
@media (prefers-reduced-transparency:reduce){#dock,#topStrip .card,#allList .card,#allHead input{background:var(--bg-panel);-webkit-backdrop-filter:none;backdrop-filter:none}.bubble.question{background:color-mix(in srgb,var(--warn) 7%,var(--bg-panel));-webkit-backdrop-filter:none;backdrop-filter:none}}
body.no-glass #dock,body.no-glass #topStrip .card,body.no-glass #allList .card,body.no-glass #allHead input{background:var(--bg-panel);-webkit-backdrop-filter:none;backdrop-filter:none}
body.no-glass .bubble.question{background:color-mix(in srgb,var(--warn) 7%,var(--bg-panel));-webkit-backdrop-filter:none;backdrop-filter:none}
button,input,textarea,select{font:inherit}
button{background:var(--primary);border:0;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer;transition:filter .12s ease,background .12s ease}
button:hover:not(:disabled){filter:brightness(1.12)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.ghost{background:var(--bg-raised);color:var(--text-2)}
button.danger{background:var(--danger-bg)}
button:disabled{opacity:.5;cursor:not-allowed}
main{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px;overflow:auto;background:transparent;min-height:0}
#topStrip{display:grid;grid-template-columns:repeat(var(--strip-cols,3),minmax(0,440px)) 150px;gap:12px;min-height:88px;align-content:start;transition:opacity 280ms ease, transform 280ms ease}
#topStrip:empty{display:grid}
#center{flex:1;display:flex;flex-direction:column;min-height:45vh;background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
#stage{flex:1;display:flex;flex-direction:column;position:relative;min-height:160px;background:var(--bg);overflow:hidden}
#firstPeek{display:none;padding:8px 12px;background:var(--accent-bg);color:var(--text);border-bottom:1px solid var(--border);font-size:13px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#firstPeek.visible{display:block}
#composer #cancelBtn{order:2;background:var(--danger-bg)}
#history{flex:1;overflow:auto;padding:16px max(16px,calc((100% - 960px)/2));display:flex;flex-direction:column;gap:12px;background:var(--bg);min-height:160px}
.bubble{background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5}
.bubble.output,.bubble.user{font-size:15px;line-height:1.55}
.bubble.output{border-left:3px solid var(--accent-strong)}
.bubble.output.streaming{border-left-color:var(--accent);opacity:.95}
/* A generation opens its answer bubble empty: hidden until text streams (the thinking box shows progress meanwhile). */
.bubble.output.streaming:empty{display:none}
.turn-timing{margin-top:8px;color:var(--text-muted);font-size:11px;font-variant-numeric:tabular-nums}
.turn-timing.live{color:var(--accent)}
.bubble.output.markdown{white-space:normal}
.bubble.output.markdown pre{overflow:auto;padding:10px;border-radius:8px;background:var(--bg-inset)}
.bubble.output.markdown code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em}
.bubble.output.markdown :not(pre)>code{background:var(--bg-inset);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--text)}
.bubble.output.markdown pre{font-size:13px;line-height:1.45;border:1px solid var(--border)}
.bubble.output.markdown h1,.bubble.output.markdown h2,.bubble.output.markdown h3,.bubble.output.markdown h4,.bubble.output.markdown h5,.bubble.output.markdown h6{font-weight:600;line-height:1.3;margin:18px 0 8px;color:var(--text-bright)}
.bubble.output.markdown h1{font-size:19px}
.bubble.output.markdown h2{font-size:17px}
.bubble.output.markdown h3{font-size:15.5px}
.bubble.output.markdown h4,.bubble.output.markdown h5,.bubble.output.markdown h6{font-size:15px;color:var(--text-2)}
.bubble.output.markdown h1:first-child,.bubble.output.markdown h2:first-child,.bubble.output.markdown h3:first-child,.bubble.output.markdown>.copy-btn:first-child+:is(h1,h2,h3){margin-top:2px}
.bubble.output.markdown strong{color:var(--text-bright)}
.bubble.output.markdown hr{border:0;border-top:1px solid var(--border);margin:14px 0}
.bubble.output.markdown img{max-width:100%}
.bubble.output.markdown p,.bubble.output.markdown ul,.bubble.output.markdown ol,.bubble.output.markdown blockquote,.bubble.output.markdown table,.bubble.output.markdown pre{margin:0 0 12px}
.bubble.output.markdown p:last-child,.bubble.output.markdown ul:last-child,.bubble.output.markdown ol:last-child,.bubble.output.markdown blockquote:last-child,.bubble.output.markdown table:last-child,.bubble.output.markdown pre:last-child{margin-bottom:0}
.bubble.output.markdown ul,.bubble.output.markdown ol{padding-left:1.5em}
.bubble.output.markdown li+li{margin-top:4px}
.bubble.output.markdown li>ul,.bubble.output.markdown li>ol{margin:4px 0 0}
.bubble.output.markdown blockquote{border-left:3px solid var(--border-strong);padding-left:12px;color:var(--text-muted)}
.bubble.output.markdown table{border-collapse:collapse;display:block;max-width:100%;overflow:auto}
.bubble.output.markdown th,.bubble.output.markdown td{border:1px solid var(--border-strong);padding:5px 8px;font-size:14px}
.bubble.output.markdown th{background:var(--bg-inset);font-weight:600}
.markdown-warning{margin:0 16px 4px;padding:8px 10px;border:1px solid var(--warn);border-radius:8px;background:var(--warn-bg);color:var(--warn-bright);font-size:12px;line-height:1.4}
.bubble.user{border-left:3px solid var(--accent);background:var(--accent-bg);align-self:flex-end;max-width:85%;margin-left:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bubble.user.queued{border-left-style:dashed;opacity:.8}
.bubble.user.steered{border-left-style:dashed;border-left-color:var(--accent);opacity:.9}
.bubble.user.failed{border-left-color:var(--danger);opacity:.8}
.bubble.user .state-badge{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--text);font-size:11px;line-height:1.2;white-space:nowrap;flex-shrink:0}
.bubble.user .state-badge::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.bubble.user.queued .state-badge::before{background:var(--accent);box-shadow:0 0 0 1px var(--accent-ring)}
.bubble.user.steered .state-badge::before{background:var(--accent);box-shadow:0 0 0 1px var(--accent-ring)}
.bubble.user.failed .state-badge::before{background:var(--danger);box-shadow:0 0 0 1px color-mix(in srgb,var(--danger) 40%,transparent)}
.bubble.user .origin-label{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;flex-shrink:0}
.bubble.user .user-message{flex:1;min-width:0}
.bubble.user blockquote{border-left:3px solid var(--border-strong);padding-left:10px;color:var(--text-3);margin:2px 0 6px}
.bubble.user blockquote:last-child{margin-bottom:0}
.bubble.tool{border-left:3px solid var(--ok);background:var(--bg-panel);font-size:13px;color:var(--text-2)}
.bubble.cancel{border-left:3px solid var(--danger);background:color-mix(in srgb,var(--danger) 8%,var(--bg-panel));color:var(--danger-text);font-size:13px}
.bubble.recap{border-left:3px solid var(--think-text);background:color-mix(in srgb,var(--think) 6%,var(--bg-panel));font-size:13px}
.bubble.recap summary{cursor:pointer;color:var(--think-text);font-size:12px}
.bubble.recap .recap-body{white-space:pre-wrap;margin-top:6px}
.bubble.recap.stale{opacity:.7;border-left-style:dashed}
.bubble.activity{border-left:3px solid var(--accent);background:var(--bg-panel);padding:8px 12px}
.bubble.activity>summary{cursor:pointer;color:var(--text-muted);font-size:13px;font-weight:600;user-select:none;list-style:none}
.bubble.activity>summary::-webkit-details-marker{display:none}
.bubble.activity>summary::before{content:"▸ ";color:var(--accent)}
.bubble.activity[open]>summary::before{content:"▾ "}
.activity-body{margin-top:6px}
.activity-row{display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--text-2);padding:5px 2px;border-top:1px solid var(--border)}
.activity-row:first-child{border-top:none}
.activity-status{font-size:11px;min-width:52px;text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.activity-status.running{color:var(--warn)}
.activity-status.ok{color:var(--ok)}
.activity-status.error{color:var(--danger)}
.activity-tool{color:var(--accent);font-weight:600}
.activity-params{color:var(--text-muted);word-break:break-all}
.activity-duration{color:var(--text-faint);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.activity-output{margin:4px 0 2px 60px;font-size:12px;color:var(--text-muted);white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:6px;padding:6px 8px;max-height:160px;overflow:auto}
/* A row's status and tool name never wrap (a phone broke them letter by
   letter); the params take what is left. The output goes on its own line
   under the call instead of a column beside it: on a desktop it lines up
   under the tool name (the status is 52 px + the 8 px gap), on a phone it
   takes the full width and the params break inside the rest of the first
   line rather than drop to a line of their own. */
.activity-row{flex-wrap:wrap}
.activity-status,.activity-tool{flex-shrink:0;white-space:nowrap}
.activity-params{min-width:0}
.activity-output{flex:1 1 100%;min-width:0}
@media(max-width:600px){
  .activity-params{flex:1 1 0}
  .activity-output{margin-left:0}
}
.bubble.thinking{border-left:3px solid var(--think);background:color-mix(in srgb,var(--think) 6%,var(--bg-panel));padding:8px 12px}
.bubble.thinking:not([open]),.bubble.activity:not([open]){padding:3px 10px;background:transparent;border-color:transparent;align-self:flex-start;border-radius:6px;transition:background .12s ease}
.bubble.thinking:not([open]){border-left-color:var(--think)}
.bubble.activity:not([open]){border-left-color:var(--accent)}
.bubble.thinking:not([open]):hover,.bubble.activity:not([open]):hover{background:var(--bg-panel)}
.bubble.thinking:not([open])>summary,.bubble.activity:not([open])>summary{font-size:12px;font-weight:500}
.bubble.thinking>summary{cursor:pointer;color:var(--text-muted);font-size:13px;font-weight:600;font-style:italic;user-select:none;list-style:none}
.bubble.thinking>summary::-webkit-details-marker{display:none}
.bubble.thinking>summary::before{content:"▸ ";color:var(--think)}
.bubble.thinking[open]>summary::before{content:"▾ "}
.thinking-body{margin-top:6px;font-size:13px;color:var(--text-3);white-space:pre-wrap;word-break:break-word;font-style:italic;max-height:240px;overflow:auto}
/* Turn view (web.turn_view): one block per turn, its steps as collapsed rows, the live one open at the bottom. */
.turn-work{border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:12px;background:var(--bg-panel);padding:8px 12px;font-size:14px}
.turn-work>summary{cursor:pointer;color:var(--text-muted);font-size:13px;font-weight:600;user-select:none;list-style:none}
.turn-work>summary::-webkit-details-marker{display:none}
.turn-work>summary::before{content:"▸ ";color:var(--accent)}
.turn-work[open]>summary::before{content:"▾ "}
.turn-work:not([open]){padding:3px 10px;background:transparent;border-color:transparent;border-left-color:var(--accent);align-self:flex-start;border-radius:6px;transition:background .12s ease}
.turn-work:not([open]):hover{background:var(--bg-panel)}
.turn-work:not([open])>summary{font-size:12px;font-weight:500}
.gen{margin-top:8px;padding-top:6px;border-top:1px solid var(--border)}
.gen>summary{cursor:pointer;color:var(--text-muted);font-size:12px;font-weight:500;user-select:none;list-style:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gen>summary::-webkit-details-marker{display:none}
.gen>summary::before{content:"▸ ";color:var(--text-faint)}
.gen[open]>summary::before{content:"▾ "}
.gen.live{border-top-color:transparent;background:var(--accent-tint);border-radius:8px;padding:6px 9px 8px;margin-left:-9px;margin-right:-9px}
.gen.live>summary{color:var(--accent);white-space:normal}
/* The live step's marker: a pulsing accent dot in place of the chevron (the block's own left bar stays the only one). */
.gen.live>summary::before{content:"";display:inline-block;width:7px;height:7px;margin:0 8px 1px 2px;border-radius:50%;background:var(--accent);vertical-align:middle;animation:step-pulse 1.6s ease-in-out infinite}
@keyframes step-pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 0%,transparent)}}
@media (prefers-reduced-motion:reduce){.gen.live>summary::before{animation:none}}
.gen-text{margin-top:6px;white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.55}
.gen:not(.live) .gen-text{font-size:14px;color:var(--text-2)}
.gen-text:empty{display:none}
.gen .activity-body{margin-top:6px}
/* One gen, no thinking, no tool rows: nothing to stack yet, so the narration streams like a plain answer bubble. */
.turn-work:not(:has(.gen~.gen,.thinking-body,.activity-body)){border:0;padding:0;background:transparent}
.turn-work:not(:has(.gen~.gen,.thinking-body,.activity-body))>summary,.turn-work:not(:has(.gen~.gen,.thinking-body,.activity-body)) .gen>summary{display:none}
.turn-work:not(:has(.gen~.gen,.thinking-body,.activity-body)) .gen{margin:0;padding:0;border:0;background:transparent}
.turn-work:not(:has(.gen~.gen,.thinking-body,.activity-body)) .gen-text{margin:0;background:var(--bg-panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:12px;padding:12px 14px;opacity:.95}
/* A question card asks for input like the composer card, so it wears the same glass (the recipe above); only its warm tint is its own. */
.bubble.question{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 7%,var(--glass-bg));padding:10px 12px}
/* Collapsed (resolved) question: one line, like the thinking and activity blocks.
   The left bar keeps --warn here; the existing answered/cancelled/denied classes
   (which apply whether open or not) recolour it once resolved. */
.bubble.question:not([open]){padding:3px 10px;background:transparent;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;align-self:flex-start;border-radius:6px;transition:background .12s ease}
.bubble.question:not([open]){border-left-color:var(--warn)}
.bubble.question:not([open]):hover{background:var(--bg-panel)}
.bubble.question:not([open])>summary{font-size:12px;font-weight:500}
.bubble.question>summary{cursor:pointer;color:var(--text-muted);font-size:13px;font-weight:600;user-select:none;list-style:none}
.bubble.question>summary::-webkit-details-marker{display:none}
.bubble.question>summary::before{content:"▸ ";color:var(--warn)}
.bubble.question[open]>summary::before{content:"▾ "}
.bubble.command{border-left:3px solid var(--text-faint);background:var(--bg-panel);font-size:13px}
.bubble.note{border-left:3px dotted var(--text-faint);background:transparent;font-size:12px;color:var(--text-muted);opacity:.85}
.note-line{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-faint);margin-bottom:2px}
.note-text{white-space:pre-wrap;max-height:8em;overflow:auto}
.bubble.command.busy{border-left-color:var(--warn)}
.bubble.command.failed{border-left-color:var(--danger)}
.command-line{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-3)}
.command-output{margin:6px 0 0;white-space:pre-wrap;font-size:12px;color:var(--text-2)}
.bubble.continue{border-left:3px solid var(--accent);background:var(--bg-panel);padding:10px 12px}
.bubble.continue.resolved{border-left-color:var(--text-muted);opacity:.8}
.continue-text{font-size:14px;color:var(--text);margin-bottom:6px}
.continue-context{font-size:12px;color:var(--text-3);margin-bottom:8px;white-space:pre-wrap}
.continue-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.continue-reason{flex:1;min-width:140px;background:var(--bg-inset);border:1px solid var(--border-strong);border-radius:8px;color:var(--text);padding:6px 8px}
.bubble.question.submitting{opacity:.7}
.bubble.question.answered{border-left-color:var(--ok)}
.bubble.question.cancelled{border-left-color:var(--text-muted);opacity:.75}
/* A settled card stops floating: the highlight stays, the drop shadow goes. */
.bubble.question.answered,.bubble.question.cancelled{box-shadow:inset 0 1px 0 var(--glass-highlight)}
.question-text{font-size:14px;color:var(--text);margin-bottom:8px;white-space:pre-wrap}
.question-options{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.question-option{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text-2);padding:6px 8px;border:1px solid var(--border);border-radius:8px;cursor:pointer}
.question-option:hover{background:var(--bg-hover)}
.question-option.selected{border-color:var(--ok);color:var(--text)}
.question-option input{margin:0;accent-color:var(--warn)}
.question-freeform{width:100%;box-sizing:border-box;background:var(--bg-inset);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:8px;font-size:13px;margin-bottom:8px}
.question-error{color:var(--danger);font-size:12px;margin-bottom:8px}
.question-error.hidden{display:none}
.question-result{margin-top:6px;font-size:12px;color:var(--ok);font-weight:600}
.bubble.question.cancelled .question-result{color:var(--text-muted)}
.question-submit{align-self:flex-end;font-size:13px}
.question-dismiss{font-size:13px;margin-left:8px}
.bubble.question.approval{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 7%,var(--glass-bg))}
.bubble.question.approval.answered.denied{border-left-color:var(--danger)}
.bubble.question.approval.answered.denied .question-result{color:var(--danger)}
.bubble.question.approval.answered.denied .question-option.selected{border-color:var(--danger)}
.approval-details{margin-bottom:8px;font-size:13px;color:var(--text-2)}
.approval-tool{font-weight:700;color:var(--text);margin-bottom:4px}
.approval-what{margin:0 0 6px;padding:8px 10px;background:var(--bg-inset);border:1px solid var(--warn-border);border-radius:6px;white-space:pre-wrap;word-break:break-all;color:var(--warn-bright);font-size:12.5px}
.approval-where,.approval-why{font-size:12px;color:var(--text-muted);word-break:break-all}
.approval-why{color:var(--warn-text)}
.approval-label{color:var(--text-faint)}
.bubble.guardrail-warning{border-left:3px solid var(--danger);background:color-mix(in srgb,var(--danger) 8%,var(--bg-panel));color:var(--danger-text);font-size:13px;padding:8px 12px;white-space:pre-wrap}
.bubble.hook-notice{border-left:3px solid var(--text-faint);background:var(--bg-panel);color:var(--text-3);font-size:13px;padding:8px 12px;white-space:pre-wrap}
.bubble.hook-notice.warn{border-left-color:var(--warn);color:var(--warn-text)}

    <div id="firstPeek"></div>
    <div id="stage">
      <div id="markdownWarning" class="markdown-warning" hidden></div>
      <div id="history"></div>
      <div id="empty"></div>
      <div id="notice" role="status" hidden></div>
    </div>
    <div id="lightbox" hidden><img alt=""></div>
    <div id="dock">
      <div id="composer" style="position:relative">
        <div id="composeGrip" title="Drag to make the message box taller (double-click resets)"></div>
        <div class="compose-col">
          <div id="chips" hidden></div>
          <textarea id="prompt" placeholder="Ask chi anything…"></textarea>
        </div>
        <div class="actions-col">
          <label id="modelPick" class="model-pick" title="The model the new chat starts on" hidden><select id="modelSelect" aria-label="Model for the new chat"></select></label>
          <button id="createAltBtn" class="ghost" style="display:none">New chat</button>
          <div id="composeHint">Enter to start · Shift+Enter for a newline</div>
          <button id="cancelBtn" title="Cancel the running turn, whoever sent it" style="display:none">Cancel</button>
          <div class="split">
            <button id="actionBtn">Start</button>
            <button id="actionMenuBtn" class="ghost" title="More actions" style="display:none">▾</button>
          </div>
        </div>
        <div id="actionMenu">
          <button data-action="send">Send to current session</button>
          <button data-action="create">New chat</button>
        </div>
      </div>
      <div id="infoBar">
        <div class="info" id="infoText"></div>
        <button class="ghost" id="infoStopBtn" title="Stop session (terminate worker)" style="display:none">stop</button>
        <button class="ghost" id="infoDeleteBtn" title="Delete session (for good)" style="display:none">delete</button>
      </div>
    </div>
  </section>
  <section id="allView" aria-label="All sessions">
    <div id="allHead">
      <button class="ghost" id="allBack" title="Back to the chat (Esc)">← Back</button>
      <input id="filter" type="search" placeholder="Search… (preview / id / status)" autocomplete="off">
      <span class="count" id="count"></span>
    </div>
    <div id="allPath" hidden>Stored in <code></code></div>
    <div id="allList"></div>
  </section>
</main>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
