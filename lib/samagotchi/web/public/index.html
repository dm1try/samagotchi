<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chi</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0b0d11;--bg-panel:#151821;--bg-inset:#0f1115;--bg-raised:#22262f;--bg-hover:#1b1f27;--border:#1f232b;--border-strong:#2d333f;--text:#e6e8eb;--text-bright:#f0f3f6;--text-2:#c9d1d9;--text-3:#9aa4b2;--text-muted:#8b949e;--text-faint:#6e7681;--accent:#7aa5ff;--accent-strong:#1f6feb;--accent-bg:#1b2336;--accent-ring:rgba(122,165,255,.18);--primary:#2a68d1;--ok:#3fb950;--ok-text:#7ee787;--ok-bg:#1a2e1a;--warn:#d29922;--warn-text:#e3b341;--warn-bright:#f2cc60;--warn-bg:#2b2108;--warn-border:#6b5416;--danger:#f85149;--danger-bg:#da3633;--danger-text:#ff7b72;--danger-bg-dim:#3d1f1f;--think:#8957e5;--think-text:#d2a8ff;--accent-border:#223150;--accent-tint:color-mix(in srgb,var(--accent) 7%,transparent);--narr:color-mix(in srgb,var(--accent) 38%,var(--text-muted));
  --glass-bg:color-mix(in srgb,var(--bg-panel) 70%,transparent);--glass-border:rgba(255,255,255,.08);--glass-highlight:rgba(255,255,255,.05);--glass-shadow:0 8px 30px rgba(0,0,0,.35);
  --diff-add-bg:rgba(63,185,80,.14);--diff-add-text:#aff5b4;--diff-del-bg:rgba(248,81,73,.14);--diff-del-text:#ffc1bc}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family: ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1100px 700px at 8% 0%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 70%),radial-gradient(900px 700px at 100% 100%,color-mix(in srgb,var(--think) 9%,transparent),transparent 70%),var(--bg);background-attachment:fixed;color:var(--text);height:100vh;display:flex;flex-direction:column}
/* Glass: the composer card, the strip cards, the all-sessions cards and the question cards (by selector, so app.js is untouched). */
#dock,.turn-stage,.dock-card,#topStrip .card,#allList .card,.bubble.question,.bubble.plugin-card{background:var(--glass-bg);-webkit-backdrop-filter:blur(18px) saturate(1.35);backdrop-filter:blur(18px) saturate(1.35);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-highlight),var(--glass-shadow)}
#topStrip .card:hover,#allList .card:hover{background:color-mix(in srgb,var(--bg-hover) 75%,transparent);border-color:rgba(255,255,255,.14)}
#topStrip .card.active,#allList .card.active{background:color-mix(in srgb,var(--accent-bg) 75%,transparent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
/* A session that waits on the user (a question, an approval, a card with actions): the warning colour of its question card, also when active or hovered. */
#topStrip .card.waiting,#allList .card.waiting{border-color:color-mix(in srgb,var(--warn) 75%,transparent)}
#topStrip .card.waiting:hover,#allList .card.waiting:hover{border-color:var(--warn)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){#dock,.turn-stage,.dock-card,#topStrip .card,#allList .card,#allHead input{background:var(--bg-panel)}.bubble.question{background:color-mix(in srgb,var(--warn) 7%,var(--bg-panel))}.bubble.plugin-card{background:color-mix(in srgb,var(--accent) 6%,var(--bg-panel))}}
@media (prefers-reduced-transparency:reduce){#dock,.turn-stage,.dock-card,#topStrip .card,#allList .card,#allHead input{background:var(--bg-panel);-webkit-backdrop-filter:none;backdrop-filter:none}.bubble.question{background:color-mix(in srgb,var(--warn) 7%,var(--bg-panel));-webkit-backdrop-filter:none;backdrop-filter:none}.bubble.plugin-card{background:color-mix(in srgb,var(--accent) 6%,var(--bg-panel));-webkit-backdrop-filter:none;backdrop-filter:none}}
body.no-glass #dock,body.no-glass .turn-stage,body.no-glass .dock-card,body.no-glass #topStrip .card,body.no-glass #allList .card,body.no-glass #allHead input{background:var(--bg-panel);-webkit-backdrop-filter:none;backdrop-filter:none}
body.no-glass .bubble.question{background:color-mix(in srgb,var(--warn) 7%,var(--bg-panel));-webkit-backdrop-filter:none;backdrop-filter:none}
body.no-glass .bubble.plugin-card{background:color-mix(in srgb,var(--accent) 6%,var(--bg-panel));-webkit-backdrop-filter:none;backdrop-filter:none}
button,input,textarea,select{font:inherit}
button{background:var(--primary);border:0;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer;transition:filter .12s ease,background .12s ease}
button:hover:not(:disabled){filter:brightness(1.12)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.ghost{background:var(--bg-raised);color:var(--text-2)}
button:disabled{opacity:.5;cursor:not-allowed}
main{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px;overflow:auto;background:transparent;min-height:0}
#topStrip{display:grid;grid-template-columns:repeat(var(--strip-cols,3),minmax(0,440px)) 150px;gap:12px;min-height:88px;align-content:start;transition:opacity 280ms ease, transform 280ms ease}
#topStrip:empty{display:grid}
#center{flex:1;display:flex;flex-direction:column;min-height:45vh;background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
#stage{flex:1;display:flex;flex-direction:column;position:relative;min-height:160px;background:var(--bg);overflow:hidden}
#firstPeek{display:none;padding:8px 12px;background:var(--accent-bg);color:var(--text);border-bottom:1px solid var(--border);font-size:13px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#firstPeek.visible{display:block}
#composer #cancelBtn{order:2;background:var(--danger-bg)}
#history{flex:1;overflow:auto;padding:16px max(16px,calc((100% - 960px)/2));display:flex;flex-direction:column;gap:12px;background:var(--bg);min-height:160px}
/* No child shrinks to fit: a held (overflow:hidden) answer bubble would, clipped under the dock with nothing to scroll. */
#history>*{flex-shrink:0}
.bubble{background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5}
.bubble.output,.bubble.user{font-size:15px;line-height:1.55}
.bubble.output{border-left:3px solid var(--accent-strong)}
.bubble.output.streaming{border-left-color:var(--accent);opacity:.95}
/* A generation opens its answer bubble empty: hidden until text streams (the thinking box shows progress meanwhile). */
.bubble.output.streaming:empty{display:none}
/* The answer's pop: the promoted bubble is held at the narration box's height (inline max-height, scrolled to its tail) until the rendered markdown lands, then grows to its content while the content fades in; both classes go 400 ms later. */
.bubble.output.boxed{overflow:hidden;transition:max-height 360ms ease}
.bubble.output.revealing>:not(.copy-btn){animation:fadeIn 240ms ease}
@media (prefers-reduced-motion:reduce){.bubble.output.boxed{transition:none}.bubble.output.revealing>:not(.copy-btn){animation:none}}
.turn-timing{margin-top:8px;color:var(--text-muted);font-size:11px;font-variant-numeric:tabular-nums}
.turn-timing.live{color:var(--accent)}
.bubble.output.markdown{white-space:normal}
.bubble.output.markdown pre{overflow:auto;padding:10px;border-radius:8px;background:var(--bg-inset)}
.bubble.output.markdown code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em}
.bubble.output.markdown :not(pre)>code{background:var(--bg-inset);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--text)}
.bubble.output.markdown pre{font-size:13px;line-height:1.45;border:1px solid var(--border)}
.bubble.output.markdown h1,.bubble.output.markdown h2,.bubble.output.markdown h3,.bubble.output.markdown h4,.bubble.output.markdown h5,.bubble.output.markdown h6{font-weight:600;line-height:1.3;margin:18px 0 8px;color:var(--text-bright)}
.bubble.output.markdown h1{font-size:19px}
.bubble.output.markdown h2{font-size:17px}
.bubble.output.markdown h3{font-size:15.5px}
.bubble.output.markdown h4,.bubble.output.markdown h5,.bubble.output.markdown h6{font-size:15px;color:var(--text-2)}
.bubble.output.markdown h1:first-child,.bubble.output.markdown h2:first-child,.bubble.output.markdown h3:first-child,.bubble.output.markdown>.copy-btn:first-child+:is(h1,h2,h3){margin-top:2px}
.bubble.output.markdown strong{color:var(--text-bright)}
.bubble.output.markdown hr{border:0;border-top:1px solid var(--border);margin:14px 0}
.bubble.output.markdown img{max-width:100%}
.bubble.output.markdown p,.bubble.output.markdown ul,.bubble.output.markdown ol,.bubble.output.markdown blockquote,.bubble.output.markdown table,.bubble.output.markdown pre{margin:0 0 12px}
.bubble.output.markdown p:last-child,.bubble.output.markdown ul:last-child,.bubble.output.markdown ol:last-child,.bubble.output.markdown blockquote:last-child,.bubble.output.markdown table:last-child,.bubble.output.markdown pre:last-child{margin-bottom:0}
.bubble.output.markdown ul,.bubble.output.markdown ol{padding-left:1.5em}
.bubble.output.markdown li+li{margin-top:4px}
.bubble.output.markdown li>ul,.bubble.output.markdown li>ol{margin:4px 0 0}
.bubble.output.markdown blockquote{border-left:3px solid var(--border-strong);padding-left:12px;color:var(--text-muted)}
.bubble.output.markdown table{border-collapse:collapse;display:block;max-width:100%;overflow:auto}
.bubble.output.markdown th,.bubble.output.markdown td{border:1px solid var(--border-strong);padding:5px 8px;font-size:14px}
.bubble.output.markdown th{background:var(--bg-inset);font-weight:600}
/* Plugins' slow setup (chi.init, init_row.js): a quiet line per task over the composer. */
#initRow{display:flex;flex-direction:column;gap:2px;padding:6px 12px 2px;font-size:12px;line-height:1.4;color:var(--text-3)}
#initRow[hidden]{display:none}
.init-task{display:flex;align-items:center;gap:7px;min-width:0;transition:opacity .4s ease}
.init-task.fading{opacity:0}
.init-bundle{flex:none;padding:0 5px;border:1px solid var(--border-strong);border-radius:4px;font-size:11px;color:var(--text-muted)}
.init-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.init-task.done .init-text{color:var(--ok-text)}
.init-mark{flex:none;width:10px;text-align:center;color:var(--ok)}
.init-spin{flex:none;width:10px;height:10px;border:1.5px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:init-spin .8s linear infinite}
@keyframes init-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.init-spin{animation:none;border-top-color:var(--accent)}.init-task{transition:none}}
.markdown-warning{margin:0 16px 4px;padding:8px 10px;border:1px solid var(--warn);border-radius:8px;background:var(--warn-bg);color:var(--warn-bright);font-size:12px;line-height:1.4}
.bubble.user{border-left:3px solid var(--accent);background:var(--accent-bg);align-self:flex-end;max-width:85%;margin-left:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bubble.user.queued{border-left-style:dashed;opacity:.8}
.bubble.user.steered{border-left-style:dashed;border-left-color:var(--accent);opacity:.9}
.bubble.user.failed{border-left-color:var(--danger);opacity:.8}
.bubble.user .state-badge{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--text);font-size:11px;line-height:1.2;white-space:nowrap;flex-shrink:0}
.bubble.user .state-badge::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.bubble.user.queued .state-badge::before{background:var(--accent);box-shadow:0 0 0 1px var(--accent-ring)}
.bubble.user.steered .state-badge::before{background:var(--accent);box-shadow:0 0 0 1px var(--accent-ring)}
.bubble.user.failed .state-badge::before{background:var(--danger);box-shadow:0 0 0 1px color-mix(in srgb,var(--danger) 40%,transparent)}
.bubble.user .origin-label{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;flex-shrink:0}
.bubble.user .user-message{flex:1;min-width:0}
.bubble.user blockquote{border-left:3px solid var(--border-strong);padding-left:10px;color:var(--text-3);margin:2px 0 6px}
.bubble.user blockquote:last-child{margin-bottom:0}
.bubble.tool{border-left:3px solid var(--ok);background:var(--bg-panel);font-size:13px;color:var(--text-2)}
.bubble.cancel{border-left:3px solid var(--danger);background:color-mix(in srgb,var(--danger) 8%,var(--bg-panel));color:var(--danger-text);font-size:13px}
.bubble.recap{border-left:3px solid var(--think-text);background:color-mix(in srgb,var(--think) 6%,var(--bg-panel));font-size:13px}
.bubble.recap summary{cursor:pointer;color:var(--think-text);font-size:12px}
.bubble.recap .recap-body{white-space:pre-wrap;margin-top:6px}
.bubble.recap.stale{opacity:.7;border-left-style:dashed}
.activity-body{margin-top:6px}
.activity-row{display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--text-2);padding:5px 2px;border-top:1px solid var(--border)}
.activity-row:first-child{border-top:none}
.activity-status{font-size:11px;min-width:52px;text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.activity-status.running{color:var(--warn)}
.activity-status.ok{color:var(--ok)}
.activity-status.error{color:var(--danger)}
.activity-status.stopped{color:var(--warn-text);opacity:.8}
.activity-status.blocked{color:var(--danger-text)}
.activity-tool{color:var(--accent);font-weight:600}
.activity-params{color:var(--text-muted);word-break:break-all}
.activity-duration{color:var(--text-faint);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.activity-output{margin:4px 0 2px 60px;font-size:12px;color:var(--text-muted);white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:6px;padding:6px 8px;max-height:160px;overflow:auto}
/* A row's status and tool name never wrap (a phone broke them letter by
   letter); the params take what is left. The output goes on its own line
   under the call instead of a column beside it: on a desktop it lines up
   under the tool name (the status is 52 px + the 8 px gap), on a phone it
   takes the full width and the params break inside the rest of the first
   line rather than drop to a line of their own. */
.activity-row{flex-wrap:wrap}
.activity-status,.activity-tool{flex-shrink:0;white-space:nowrap}
.activity-params{min-width:0}
.activity-output{flex:1 1 100%;min-width:0}
/* An edit/write's change: a closed "diff +3 −1" under the output, lined up with it. */
.activity-diff{flex:1 1 100%;min-width:0;margin:2px 0 2px 60px}
.activity-diff>summary{cursor:pointer;font-size:12px;color:var(--text-muted);width:max-content;font-variant-numeric:tabular-nums}
.activity-diff>summary:hover{color:var(--text-2)}
.activity-diff[open]>summary{margin-bottom:4px}
@media(max-width:600px){
  .activity-params{flex:1 1 0}
  .activity-output{margin-left:0}
  .activity-diff{margin-left:0}
}
.bubble.thinking{border-left:3px solid var(--think);background:color-mix(in srgb,var(--think) 6%,var(--bg-panel));padding:8px 12px}
.bubble.thinking:not([open]),.bubble.activity:not([open]){padding:3px 10px;background:transparent;border-color:transparent;align-self:flex-start;border-radius:6px;transition:background .12s ease}
.bubble.thinking:not([open]){border-left-color:var(--think)}
.bubble.activity:not([open]){border-left-color:var(--accent)}
.bubble.thinking:not([open]):hover,.bubble.activity:not([open]):hover{background:var(--bg-panel)}
.bubble.thinking:not([open])>summary,.bubble.activity:not([open])>summary{font-size:12px;font-weight:500}
.bubble.thinking>summary{cursor:pointer;color:var(--text-muted);font-size:13px;font-weight:600;font-style:italic;user-select:none;list-style:none}
.bubble.thinking>summary::-webkit-details-marker{display:none}
.bubble.thinking>summary::before{content:"▸ ";color:var(--think)}
.bubble.thinking[open]>summary::before{content:"▾ "}
.thinking-body{margin-top:6px;font-size:13px;color:var(--text-3);white-space:pre-wrap;word-break:break-word;font-style:italic;max-height:240px;overflow:auto}
/* Turn view (web.view: turn, and inside the stage): one block per turn, its steps as collapsed rows, the live one open at the bottom. */
.turn-work{border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:12px;background:var(--bg-panel);padding:8px 12px;font-size:14px}
.turn-work>summary{cursor:pointer;color:var(--text-muted);font-size:13px;font-weight:600;user-select:none;list-style:none}
.turn-work>summary::-webkit-details-marker{display:none}
.turn-work>summary::before{content:"▸ ";color:var(--accent)}
.turn-work[open]>summary::before{content:"▾ "}
.turn-work:not([open]){padding:3px 10px;background:transparent;border-color:transparent;border-left-color:var(--accent);align-self:flex-start;border-radius:6px;transition:background .12s ease}
.turn-work:not([open]):hover{background:var(--bg-panel)}
.turn-work:not([open])>summary{font-size:12px;font-weight:500}
.gen{margin-top:8px;padding-top:6px;border-top:1px solid var(--border)}
.gen>summary{cursor:pointer;color:var(--text-muted);font-size:12px;font-weight:500;user-select:none;list-style:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gen>summary::-webkit-details-marker{display:none}
.gen>summary::before{content:"▸ ";color:var(--text-faint)}
.gen[open]>summary::before{content:"▾ "}
.gen.live{border-top-color:transparent;background:var(--accent-tint);border-radius:8px;padding:6px 9px 8px;margin-left:-9px;margin-right:-9px}
.gen.live>summary{color:var(--accent);white-space:normal}
/* The live step's marker: a pulsing accent dot in place of the chevron (the block's own left bar stays the only one). */
.gen.live>summary::before{content:"";display:inline-block;width:7px;height:7px;margin:0 8px 1px 2px;border-radius:50%;background:var(--accent);vertical-align:middle;animation:step-pulse 1.6s ease-in-out infinite}
@keyframes step-pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 0%,transparent)}}
@media (prefers-reduced-motion:reduce){.gen.live>summary::before{animation:none}}
/* A step's thinking is a one-line ticker: the newest complete sentence,
   ellipsed to one line (the collapsed .bubble.thinking look, scoped to .gen
   so it never reaches .bubble.thinking after promote). The prefix is a
   .thinking-tag; the sentence a text node. A subtle fade on change, removed
   at close (reload parity) and off under prefers-reduced-motion. */
.gen details.thinking>summary{cursor:pointer;color:var(--text-muted);font-size:12px;font-weight:500;font-style:italic;user-select:none;list-style:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gen details.thinking>summary::-webkit-details-marker{display:none}
.gen details.thinking>summary::before{content:"▸ ";color:var(--think)}
.gen details.thinking[open]>summary::before{content:"▾ "}
.gen details.thinking .thinking-tag{color:var(--think-text)}
.gen details.thinking summary{transition:opacity 120ms ease}
.gen details.thinking summary.thinking-fade{animation:thinking-fade 120ms ease-out}
@keyframes thinking-fade{from{opacity:.4}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.gen details.thinking summary.thinking-fade{animation:none}}
.gen-text{margin-top:6px;white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.55}
/* The live step's narration box: the complete sentences so far, one per line, three visual lines high (3 × the 1.55 line-height), scrolled to the newest; each new line fades in. */
.gen-text.streaming>.narration{max-height:4.65em;overflow:auto;scrollbar-width:thin;white-space:normal}
.narration>.sentence{animation:fadeIn 160ms ease}
@media (prefers-reduced-motion:reduce){.narration>.sentence{animation:none}}
.gen:not(.live) .gen-text{font-size:14px;color:var(--text-2)}
.gen-text:empty{display:none}
.gen .activity-body{margin-top:6px}
/* One gen, no thinking, no tool rows: nothing to stack yet, so the narration streams like a plain answer bubble. */
.turn-work:not(:has(.gen~.gen,.thinking-body,.activity-body)){border:0;padding:0;background:transparent}
.turn-work:not(:has(.gen~.gen,.thinking-body,.activity-body))>summary,.turn-work:not(:has(.gen~.gen,.thinking-body,.activity-body)) .gen>summary{display:none}
.turn-work:not(:has(.gen~.gen,.thinking-body,.activity-body)) .gen{margin:0;padding:0;border:0;background:transparent}
.turn-work:not(:has(.gen~.gen,.thinking-body,.activity-body)) .gen-text{margin:0;background:var(--bg-panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:12px;padding:12px 14px;opacity:.95}
/* A question card asks for input like the composer card, so it wears the same glass (the recipe above); only its warm tint is its own. */
.bubble.question{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 7%,var(--glass-bg));padding:10px 12px}
/* Collapsed (resolved) question: one line, like the thinking and activity blocks.
   The left bar keeps --warn here; the existing answered/cancelled/denied classes
   (which apply whether open or not) recolour it once resolved. */
.bubble.question:not([open]){padding:3px 10px;background:transparent;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;align-self:flex-start;border-radius:6px;transition:background .12s ease}
.bubble.question:not([open]){border-left-color:var(--warn)}
.bubble.question:not([open]):hover{background:var(--bg-panel)}
.bubble.question:not([open])>summary{font-size:12px;font-weight:500}
.bubble.question>summary{cursor:pointer;color:var(--text-muted);font-size:13px;font-weight:600;user-select:none;list-style:none}
.bubble.question>summary::-webkit-details-marker{display:none}
.bubble.question>summary::before{content:"▸ ";color:var(--warn)}
.bubble.question[open]>summary::before{content:"▾ "}
.bubble.command{border-left:3px solid var(--text-faint);background:var(--bg-panel);font-size:13px}
.bubble.note{border-left:3px dotted var(--text-faint);background:transparent;font-size:12px;color:var(--text-muted);opacity:.85}
.note-line{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-faint);margin-bottom:2px}
.note-text{white-space:pre-wrap;max-height:8em;overflow:auto}
.bubble.command.busy{border-left-color:var(--warn)}
.bubble.command.failed{border-left-color:var(--danger)}
.command-line{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-3)}
.command-output{margin:6px 0 0;white-space:pre-wrap;font-size:12px;color:var(--text-2)}
.bubble.continue{border-left:3px solid var(--accent);background:var(--bg-panel);padding:10px 12px}
.bubble.continue.resolved{border-left-color:var(--text-muted);opacity:.8}
.continue-text{font-size:14px;color:var(--text);margin-bottom:6px}
.continue-context{font-size:12px;color:var(--text-3);margin-bottom:8px;white-space:pre-wrap}
.continue-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.continue-reason{flex:1;min-width:140px;background:var(--bg-inset);border:1px solid var(--border-strong);border-radius:8px;color:var(--text);padding:6px 8px}
/* The step-limit question (kind continue): the continue card's buttons inside a question card; the picked one stays marked once answered. */
.bubble.question.step-limit .continue-actions{margin-top:2px}
.bubble.question.step-limit .question-choice.selected{outline:2px solid var(--ok);outline-offset:1px;opacity:1}
.bubble.question.submitting{opacity:.7}
.bubble.question.answered{border-left-color:var(--ok)}
.bubble.question.cancelled{border-left-color:var(--text-muted);opacity:.75}
/* A settled card stops floating: the highlight stays, the drop shadow goes. */
.bubble.question.answered,.bubble.question.cancelled{box-shadow:inset 0 1px 0 var(--glass-highlight)}
.question-text{font-size:14px;color:var(--text);margin-bottom:8px;white-space:pre-wrap}
.question-options{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.question-option{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text-2);padding:6px 8px;border:1px solid var(--border);border-radius:8px;cursor:pointer}
.question-option:hover{background:var(--bg-hover)}
.question-option.selected{border-color:var(--ok);color:var(--text)}
.question-option input{margin:0;accent-color:var(--warn)}
.question-freeform{width:100%;box-sizing:border-box;background:var(--bg-inset);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:8px;font-size:13px;margin-bottom:8px}
.question-error{color:var(--danger);font-size:12px;margin-bottom:8px}
.question-error.hidden{display:none}
.question-result{margin-top:6px;font-size:12px;color:var(--ok);font-weight:600}
/* 4.02: a resolved card whose summary already carries the result hides the
   body line; a hand-toggled one keeps it (its expanded body shows it). */
.question-result.hidden{display:none}
/* N1: an approval's verdict sits above its command block, not after it. */
.question-result.verdict{margin-top:0;margin-bottom:8px}
.bubble.question.cancelled .question-result{color:var(--text-muted)}
.question-submit{align-self:flex-end;font-size:13px}
.question-dismiss{font-size:13px;margin-left:8px}
.bubble.question.approval{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 7%,var(--glass-bg))}
.bubble.question.approval.answered:not(.denied){border-left-color:var(--ok)}
.bubble.question.approval:not([open]){background:transparent}
.bubble.question.approval:not([open]):hover{background:var(--bg-panel)}
.bubble.question.answered>summary::before{color:var(--ok)}
.bubble.question.cancelled>summary::before{color:var(--text-muted)}
.bubble.question.approval.answered.denied>summary::before{color:var(--danger)}
.bubble.question.approval.answered.denied{border-left-color:var(--danger)}
.bubble.question.approval.answered.denied .question-result{color:var(--danger)}
.bubble.question.approval.answered.denied .question-option.selected{border-color:var(--danger)}
.approval-details{margin-bottom:8px;font-size:13px;color:var(--text-2)}
.approval-delegate{font-size:12px;color:var(--text-muted);margin-bottom:4px;overflow-wrap:anywhere}
.approval-delegate a{color:var(--text);font-weight:600}
.question-relayed{font-size:12px;color:var(--text-muted);margin-bottom:6px}
.question-relayed.hidden{display:none}
.question-relayed a{color:var(--text);font-weight:600}
.approval-tool{font-weight:700;color:var(--text);margin-bottom:4px}
.approval-what{margin:0 0 6px;padding:8px 10px;background:var(--bg-inset);border:1px solid var(--warn-border);border-radius:6px;white-space:pre-wrap;word-break:break-all;color:var(--warn-bright);font-size:12.5px}
.approval-where,.approval-why{font-size:12px;color:var(--text-muted);word-break:break-all}
.approval-why{color:var(--warn-text)}
.approval-label{color:var(--text-faint)}
/* A diff (diff_view.js): the approval card's dry run and a tool row's change. */
.approval-diff{margin:0 0 6px}
.diff{margin:0;padding:4px 0;background:var(--bg-inset);border:1px solid var(--border);border-radius:6px;font-size:12px;line-height:1.45;overflow:auto;max-height:420px}
.diff code{display:block;min-width:max-content}
.diff-line{display:block;padding:0 10px;white-space:pre;color:var(--text-2)}
.diff-add{background:var(--diff-add-bg);color:var(--diff-add-text)}
.diff-del{background:var(--diff-del-bg);color:var(--diff-del-text)}
.diff-hunk{color:var(--text-faint)}
.diff-meta{color:var(--text-faint);font-style:italic}
.diff-note{font-size:12px;color:var(--text-muted);margin:0 0 4px}
.diff-note.warn{color:var(--warn-text)}
.diff-more{margin-top:4px}
.diff-more>summary{cursor:pointer;font-size:12px;color:var(--accent);width:max-content}
.diff-more[open]>summary{display:none}
.bubble.guardrail-warning{border-left:3px solid var(--danger);background:color-mix(in srgb,var(--danger) 8%,var(--bg-panel));color:var(--danger-text);font-size:13px;padding:8px 12px;white-space:pre-wrap}
.bubble.hook-notice{border-left:3px solid var(--text-faint);background:var(--bg-panel);color:var(--text-3);font-size:13px;padding:8px 12px;white-space:pre-wrap}
.bubble.hook-notice.warn{border-left-color:var(--warn);color:var(--warn-text)}
.gen .hook-notice{font-size:13px;color:var(--text-3);padding:5px 2px 5px 8px;border-top:1px solid var(--border);border-left:2px solid var(--text-faint);white-space:pre-wrap;word-break:break-word}
.gen .activity-body>.hook-notice:first-child{border-top:none}
.gen .hook-notice.warn{border-left-color:var(--warn);color:var(--warn-text)}
/* A plugin's steer (a nudge into the running turn): a row of its step, or a bubble; its text collapsed. */
.steer-row{font-size:13px;color:var(--text-3);border-left:2px solid var(--accent-border)}
.steer-row>summary{cursor:pointer;list-style:none;font-style:italic}
.steer-row>summary::-webkit-details-marker{display:none}
.steer-row>summary::before{content:"↪ ";font-style:normal;color:var(--accent)}
.steer-text{white-space:pre-wrap;word-break:break-word;color:var(--text-muted);margin-top:4px}
.gen>.steer-row{padding:4px 2px 4px 8px;margin:2px 0 6px}
.bubble.steer-row{background:transparent;padding:6px 12px;border-left-width:3px}
/* A plugin's card (card.js): the question card's glass with a cool tint; its actions are commands the session runs. */
.bubble.plugin-card{border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--glass-bg));padding:10px 12px;transition:box-shadow .3s ease}
.bubble.plugin-card.warn{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 7%,var(--glass-bg))}
.bubble.plugin-card.card-updated{box-shadow:inset 0 1px 0 var(--glass-highlight),0 0 0 1px var(--accent-ring),var(--glass-shadow)}
/* A notice card (card.js isNoticeCard): a one-line row like a resolved question, "▸ check-in: Nudged …"; opened, the line wraps and the card's glass comes back. */
.bubble.plugin-card.notice:not([open]){padding:3px 10px;background:transparent;border-color:transparent;border-left-color:var(--accent);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;align-self:flex-start;max-width:100%;border-radius:6px;transition:background .12s ease}
.bubble.plugin-card.notice:not([open]):hover{background:var(--bg-panel)}
.bubble.plugin-card.notice>summary{cursor:pointer;color:var(--text-muted);font-size:12px;font-weight:500;user-select:none;list-style:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble.plugin-card.notice>summary::-webkit-details-marker{display:none}
.bubble.plugin-card.notice>summary::before{content:"▸ ";color:var(--accent)}
.bubble.plugin-card.notice[open]{padding:6px 10px}
.bubble.plugin-card.notice[open]>summary{white-space:pre-wrap;font-size:13px;color:var(--text-2)}
.bubble.plugin-card.notice[open]>summary::before{content:"▾ "}
.notice-from{margin-top:4px;font-size:11px;color:var(--text-faint)}
.gen .bubble.plugin-card.notice:not([open]){margin:2px 0;padding:2px 8px}
.card-head{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.card-title{font-size:14px;font-weight:600;color:var(--text-bright)}
.card-source{font-size:11px;color:var(--text-faint);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.card-body{font-size:13.5px;color:var(--text-2);white-space:normal;line-height:1.5}
.card-body p{margin:0 0 6px}.card-body p:last-child{margin-bottom:0}
.card-body ul,.card-body ol{margin:0 0 6px 20px}
.card-body pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--bg-inset);border:1px solid var(--border);border-radius:6px;padding:8px 10px}
.card-body>pre:only-child{background:transparent;border:none;padding:0;font-family:inherit;font-size:inherit}
.card-body :not(pre)>code{background:var(--bg-inset);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:.88em}
.card-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.card-action{font-size:12.5px;padding:4px 10px}
.card-error{color:var(--danger);font-size:12px;margin-top:6px}
.card-error.hidden{display:none}
/* In a step: a row, lighter (no float), like the step's notices. */
.gen .bubble.plugin-card{margin:6px 0 4px;box-shadow:inset 0 1px 0 var(--glass-highlight);padding:8px 10px}
.hint{color:var(--text-muted);font-size:13px;padding:12px}
/* The selection bubble (app.js Annotate): Annotate + the presets (web.annotate_presets), small pills with a gap (they wrap on a narrow page). */
#annotateBar{position:fixed;z-index:20;display:flex;flex-wrap:wrap;gap:4px;max-width:calc(100vw - 16px)}
#annotateBar[hidden]{display:none}
#annotateBar button{font-size:12px;padding:4px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
#annotateBar .annotate-preset{background:var(--bg-raised);color:var(--text-2);border:1px solid var(--border-strong);padding:3px 10px;max-width:32ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Copy buttons (copy.js): top-right in an answer and a code block, left of a prompt (its right edge is the page's); shown on hover or focus, always (dim) on touch. They hold no text: "copied ✓" is CSS content. */
.bubble.output,.bubble.user{position:relative}
.copy-btn{position:absolute;top:6px;right:6px;z-index:1;display:inline-flex;align-items:center;justify-content:center;height:24px;min-width:24px;padding:0 5px;border-radius:6px;background:var(--bg-raised);border:1px solid var(--border-strong);color:var(--text-muted);font-size:11px;line-height:1;white-space:nowrap;user-select:none;-webkit-user-select:none;opacity:0;transition:opacity .12s ease,color .12s ease}
.copy-btn svg{display:block}
.copy-btn:hover:not(:disabled){filter:none;color:var(--text-bright)}
.bubble:hover>.copy-btn,.code-wrap:hover>.copy-btn,.copy-btn:focus-visible,.copy-btn[data-copied]{opacity:1}
.copy-btn[data-copied],.copy-btn[data-copied]:hover:not(:disabled){color:var(--ok-text)}
.copy-btn[data-copied] svg{display:none}
.copy-btn[data-copied]::after{content:"copied \2713";padding:0 2px}
.bubble.user>.copy-btn{right:calc(100% + 4px);top:4px;background:transparent;border-color:transparent}
.bubble.user>.copy-btn:hover{background:var(--bg-raised);border-color:var(--border-strong)}
.code-wrap{position:relative;margin:0 0 12px}
.code-wrap:last-child{margin-bottom:0}
.bubble.output.markdown .code-wrap>pre{margin:0}
.code-wrap>.copy-btn{top:5px;right:5px}
@media (hover:none){.copy-btn{opacity:.55}}
/* The dock is the composer card: the text field, a toolbar row, the info bar as its footer. */
#dock{display:flex;flex-direction:column;flex-shrink:0;margin:0 12px 12px;border-radius:16px;position:relative;transition:border-color .12s ease,box-shadow .12s ease}
/* In a session the card floats over the history, so the glass blurs it; the history's bottom padding follows the card (--dock-h, set from app.js). */
/* The session panel lets the page's glow through (the history's own layers go clear), so the card and its footer read as glass over it, not as a flat box on black. */
body.has-session #center{background:color-mix(in srgb,var(--bg) 35%,transparent);border-color:var(--glass-border);position:relative}
body.has-session #stage,body.has-session #history{background:transparent}
@media (prefers-reduced-transparency:reduce){body.has-session #center{background:var(--bg);border-color:var(--border)}}
body.no-glass.has-session #center{background:var(--bg);border-color:var(--border)}
body.has-session #dock{position:absolute;left:16px;right:16px;bottom:16px;margin:0;z-index:3}
body.has-session #history{padding-bottom:calc(var(--dock-h,160px) + 32px)}
#dock:focus-within{border-color:color-mix(in srgb,var(--accent) 70%,transparent);box-shadow:0 0 0 3px var(--accent-ring),var(--glass-shadow)}
#composer{display:flex;flex-direction:column;gap:8px;padding:14px 14px 10px}
#composer .compose-col{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
#composer.dropping{outline:2px dashed var(--accent);outline-offset:-4px}
#chips{display:flex;flex-wrap:wrap;gap:6px}
#chips[hidden]{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-bg);border:1px solid var(--border-strong);border-radius:8px;padding:3px 4px 3px 3px;font-size:12px;max-width:220px}
.chip img{width:32px;height:32px;object-fit:cover;border-radius:5px}
.chip .chip-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .chip-remove{background:transparent;color:var(--text-3);padding:0 6px;min-height:0;font-size:14px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.thumb{max-height:120px;max-width:200px;border-radius:6px;border:1px solid var(--border-strong);cursor:zoom-in;object-fit:contain;background:var(--bg)}
.activity-row .thumbs{flex-basis:100%}
#lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;cursor:zoom-out}
#lightbox[hidden]{display:none}
#lightbox img{max-width:96vw;max-height:94vh;border-radius:6px}
#composer textarea{flex:1 1 auto;min-height:72px;resize:none;background:transparent;border:0;color:var(--text);padding:2px;border-radius:0;font-size:15px;line-height:1.45}
#composeGrip{position:absolute;left:0;right:0;top:-5px;height:10px;cursor:ns-resize;z-index:2;touch-action:none}
#composeGrip::after{content:"";position:absolute;left:50%;top:3px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--border-strong);opacity:0;transition:opacity .12s ease}
#composer:hover #composeGrip::after,#composeGrip.dragging::after{opacity:1}
#composeGrip:hover::after,#composeGrip.dragging::after{background:var(--accent)}
#composer textarea::placeholder{color:var(--text-faint)}
/* Key hint: its line is always reserved, so focusing never shifts the layout. */
#composeHint{order:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;line-height:14px;color:var(--text-faint);padding-left:2px;opacity:0;transition:opacity .12s ease;user-select:none}
#composer:focus-within #composeHint:not(:empty){opacity:1}
#composer textarea:focus{outline:none}
/* The toolbar row: model picker · hint · Cancel · Send (the JS display toggles decide what shows). */
#composer .actions-col{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px}
#composer .actions-col button{white-space:nowrap;font-size:12px;padding:0 12px;height:28px;min-height:28px;line-height:28px}
#composer .actions-col .split{order:3;display:flex;gap:4px;margin-left:auto}
#composer #actionBtn{min-width:64px;font-weight:600}
/* The model picker (start page only): reads as a label, "host:model ▾", left of Start; a native select under a drawn caret. */
/* A select is as wide as its widest option: a hidden copy of the chosen name (data-value) sizes the box to that name instead, and the select fills it. */
#composer .actions-col .model-pick{order:0;position:relative;display:inline-block;max-width:min(50%,380px);height:28px;min-height:28px;padding:0 22px 0 8px;border-radius:8px;overflow:hidden;background:transparent;color:var(--text-muted);font-size:12px;line-height:28px;text-align:left;text-overflow:ellipsis;transition:background .12s ease,color .12s ease}
#composer .actions-col .model-pick:hover,#composer .actions-col .model-pick[aria-expanded="true"]{filter:none;background:color-mix(in srgb,var(--bg-hover) 75%,transparent);color:var(--text-2)}
#composer .actions-col .model-pick[hidden],body.has-session #composer .actions-col .model-pick{display:none}
.model-pick-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.model-pick::after{content:"";position:absolute;right:9px;top:50%;width:5px;height:5px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none;transition:transform .12s ease}
.model-pick[aria-expanded="true"]::after{transform:translateY(-20%) rotate(225deg)}
@media(max-width:600px){#composer .actions-col .model-pick{max-width:60%}}
/* The model search: opaque like #commandList (a list over the conversation
   must stay readable), above the composer, or below it (.down) when the
   start page leaves no room above, or over the composer (.over) when
   neither side has it. max-height is set at open. */
#modelPanel{position:absolute;left:10px;width:min(560px,calc(100% - 20px));bottom:calc(100% + 8px);max-height:360px;border-radius:12px;z-index:21;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-panel);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-highlight),var(--glass-shadow)}
#modelPanel.down{bottom:auto;top:calc(100% + 8px)}
#modelPanel.over{bottom:0}
#modelPanel[hidden],body.has-session #modelPanel{display:none}
#modelPanel .model-search{flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border)}
#modelPanel .model-search svg{flex:none;width:14px;height:14px;color:var(--text-faint)}
#modelSearch{flex:1;min-width:0;height:38px;background:transparent;border:0;color:var(--text);font-size:13px}
#modelSearch::placeholder{color:var(--text-faint)}
#modelSearch:focus,#modelSearch:focus-visible{outline:none}
#modelList{flex:1 1 auto;min-height:0;overflow-y:auto;padding:4px;display:flex;flex-direction:column;gap:1px}
#modelList .model-group{position:sticky;top:-4px;z-index:1;padding:8px 10px 4px;background:var(--bg-panel);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint)}
#modelList .model-group span{font-weight:400;letter-spacing:0;text-transform:none}
#modelList .model-option{flex:none;scroll-margin:28px 0 4px;display:flex;align-items:baseline;gap:10px;padding:6px 10px 6px 24px;border-radius:8px;cursor:pointer;min-width:0;position:relative}
#modelList .model-option.active{background:color-mix(in srgb,var(--accent-bg) 85%,transparent)}
#modelList .model-option.chosen::before{content:"";position:absolute;left:10px;top:50%;width:4px;height:8px;border-right:1.5px solid var(--accent);border-bottom:1.5px solid var(--accent);transform:translateY(-65%) rotate(45deg)}
#modelList .model-id{flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.4;color:var(--text-2);overflow-wrap:anywhere}
#modelList .model-option.chosen .model-id{color:var(--accent)}
#modelList .model-host,#modelList .model-dot{color:var(--text-faint)}
#modelList mark{background:none;color:var(--accent);font-weight:600}
#modelList .model-option.chosen mark{color:var(--text-bright)}
#modelList .model-note{flex:none;font-size:11px;color:var(--text-faint)}
#modelList .model-empty{padding:10px;font-size:13px;color:var(--text-faint)}
@media(max-width:600px){#modelPanel{left:6px;width:calc(100% - 12px)}#modelSearch{font-size:16px}#modelList .model-option{padding-top:8px;padding-bottom:8px}}
/* The / autocomplete: a list over the composer card's top edge. It wears the glass edge and shadow, but opaque:
   inside the dock's own backdrop-filter a second blur sees nothing, and the history would show through its text. */
#commandList{position:absolute;left:10px;width:min(640px,calc(100% - 20px));bottom:calc(100% + 8px);max-height:min(260px,40vh);overflow-y:auto;border-radius:12px;padding:4px;z-index:20;display:flex;flex-direction:column;gap:1px;background:var(--bg-panel);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-highlight),var(--glass-shadow)}
#commandList[hidden]{display:none}
#commandList .command-option{display:flex;align-items:baseline;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;min-width:0}
#commandList .command-option.active{background:color-mix(in srgb,var(--accent-bg) 85%,transparent)}
#commandList .command-name{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
#commandList .command-desc{flex:1;min-width:0;font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#commandList .command-note{font-size:11px;color:var(--text-faint);white-space:nowrap}
@media(max-width:600px){#commandList{left:6px;width:calc(100% - 12px)}#commandList .command-option{flex-wrap:wrap;row-gap:0;padding:8px 10px}#commandList .command-desc{flex-basis:100%;order:3}}
/* The stage view (web.view: stage, stage_view.js): the running turn as the dock card's top section, pinned above the composer.
   Fixed slots (status row, prompt line, a two-line headline, the tool row, a one-line trail) never change height while the
   turn runs; cards and rows that arrive meanwhile go in their own capped scroller (extras); the cloud is the turn view's
   block behind a chip of ticks. --stage-max (stage_view.js fitCap) keeps it inside the session panel. */
/* D2: its own glass card above the composer card (as a section of one card the composer's focus ring wrapped the turn too):
   in the stage view #dock is a clear column holding the stage and .dock-card (the composer and its footer, stage_view.js). */
body.stage-view #dock,body.stage-view #dock:focus-within{background:transparent;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;gap:10px}
.dock-card{display:flex;flex-direction:column;border-radius:16px;position:relative;transition:border-color .12s ease,box-shadow .12s ease}
.dock-card:focus-within{border-color:color-mix(in srgb,var(--accent) 70%,transparent);box-shadow:0 0 0 3px var(--accent-ring),var(--glass-shadow)}
.turn-stage{display:flex;flex-direction:column;min-height:0;max-height:var(--stage-max,60vh);border-left:3px solid var(--accent);border-radius:14px;overflow:hidden}
.turn-stage[hidden]{display:none}
.turn-stage.ended{border-left-color:var(--border-strong)}
.turn-stage[data-phase="answered"]{border-left-color:var(--ok)}
.turn-stage[data-phase="canceled"],.turn-stage[data-phase="waiting for you"]{border-left-color:var(--warn)}
.turn-stage[data-phase="failed"]{border-left-color:var(--danger)}
.turn-stage[data-phase="no answer"]{border-left-color:var(--warn)}
.turn-stage.enter{animation:ts-rise .35s cubic-bezier(.3,.7,.2,1)}
@keyframes ts-rise{from{opacity:0;transform:translateY(14px)}}
.turn-stage.leaving{transition:height .4s cubic-bezier(.3,.7,.2,1),opacity .3s ease;opacity:0}
.ts-arrive{animation:ts-arrive .5s cubic-bezier(.3,.7,.2,1)}
@keyframes ts-arrive{from{opacity:0;transform:translateY(60px)}}
.ts-status{flex:none;display:flex;align-items:center;gap:8px;min-width:0;padding:8px 8px 0 14px;font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.turn-stage.collapsed .ts-status{padding-bottom:8px;cursor:pointer}
.ts-mark{flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent);animation:step-pulse 1.6s ease-in-out infinite}
.turn-stage.ended .ts-mark{width:auto;height:auto;background:none;animation:none;font-size:12px;line-height:1}
.turn-stage[data-phase="answered"] .ts-mark,.turn-stage[data-phase="answered"] .ts-phase{color:var(--ok)}
.turn-stage[data-phase="canceled"] .ts-mark,.turn-stage[data-phase="canceled"] .ts-phase,.turn-stage[data-phase="waiting for you"] .ts-phase{color:var(--warn-text)}
.turn-stage[data-phase="failed"] .ts-mark,.turn-stage[data-phase="failed"] .ts-phase{color:var(--danger-text)}
.turn-stage[data-phase="no answer"] .ts-mark,.turn-stage[data-phase="no answer"] .ts-phase{color:var(--text-muted)}
.turn-stage[data-phase="waiting for you"] .ts-mark{background:var(--warn)}
.ts-phase{color:var(--accent);font-weight:600}
.ts-timing{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ts-timing .turn-timing{margin:0;font-size:12px;color:var(--text-muted);display:inline}
.ts-mini{min-width:0;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-2)}
.ts-defer{color:var(--text-faint);font-style:italic;opacity:0;transition:opacity .2s}
.turn-stage.ended.in-use .ts-defer{opacity:1}
.ts-fold{margin-left:auto;flex:none;width:28px;height:24px;padding:0;border-radius:6px;background:transparent;color:var(--text-muted);font-size:14px}
.ts-fold:hover:not(:disabled){filter:none;background:var(--bg-hover);color:var(--text)}
.ts-scroll{position:relative;flex:1 1 auto;min-height:0;overflow:auto;overflow-anchor:none;display:flex;flex-direction:column;gap:8px;padding:8px 14px 10px;scrollbar-width:thin}
.ts-scroll[hidden],.ts-scroll>[hidden]{display:none}
/* Flex column children with overflow:hidden would shrink to nothing. */
.ts-scroll>*{flex-shrink:0}
/* The prompt line: the turn's own bubble, one line; a click shows it whole. */
.ts-prompt{cursor:pointer;min-width:0}
.ts-prompt>.bubble.user{display:flex;gap:6px;align-items:baseline;max-width:none;margin:0;padding:0;background:transparent;border:0;border-radius:0;font-size:13px;line-height:1.45;color:var(--text-muted)}
.ts-prompt>.bubble.user::before{content:"you";flex:none;color:var(--accent);font-weight:600}
/* Another client's prompt says whose it is (its origin label) instead. */
.ts-prompt>.bubble.user:has(>.origin-label)::before{content:none}
.ts-prompt>.bubble.user>.copy-btn{display:none}
.ts-prompt:not(.full) .user-message{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;line-clamp:1;overflow:hidden;white-space:normal}
.ts-prompt:not(.full) .user-message .thumbs{display:none}
.ts-prompt:not(.full) .user-message blockquote{display:inline;border:0;padding:0;margin:0}
/* The live slots: fixed heights (two headline lines, one tool row, one trail line). */
.ts-live{display:flex;flex-direction:column;gap:8px}
.ts-headline{height:42px;font-size:14px;line-height:21px;color:var(--narr);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;cursor:pointer;border-radius:6px}
.ts-headline:hover{background:var(--bg-hover)}
.ts-headline:not(.thinking)::before{content:"\203A";color:var(--accent);font-weight:700;margin-right:7px}
.ts-headline.thinking{font-size:13.5px;font-style:italic;color:var(--text-muted)}
.ts-think-tag{font-style:normal;font-size:12.5px;color:var(--think-text);margin-right:6px}
.ts-headline.fresh{animation:ts-fade .3s ease}
@keyframes ts-fade{from{opacity:.35}}
.ts-now{height:32px;display:flex;align-items:center;gap:8px;min-width:0;padding:0 9px;border-radius:8px;background:var(--accent-tint);font-size:13px}
.ts-spin{flex:none;width:11px;height:11px;border:2px solid var(--warn);border-right-color:transparent;border-radius:50%;animation:init-spin .8s linear infinite}
.ts-idle{flex:none;width:11px;height:11px;border:2px solid var(--border-strong);border-radius:50%}
.ts-tool{flex:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600;color:var(--accent)}
.ts-tool.exec{color:var(--think-text)}
.ts-tool.edit{color:var(--ok-text)}
.ts-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--text-2)}
.ts-title.quiet{font-family:inherit;font-style:italic;color:var(--text-faint)}
.ts-trail{height:18px;display:flex;gap:10px;overflow:hidden;font-size:12px;line-height:18px;color:var(--text-faint);white-space:nowrap}
.ts-trail-item{flex:none;max-width:36ch;overflow:hidden;text-overflow:ellipsis}
.ts-trail-item.error{color:var(--danger-text)}
.ts-trail-item.warn{color:var(--warn-text)}
.ts-trail-item.info,.ts-trail-item.steer{color:var(--accent)}
.ts-trail-item.none{font-style:italic}
/* A card waits: the tool row and trail give it their room. */
.turn-stage.waiting .ts-now,.turn-stage.waiting .ts-trail{display:none}
/* Rows that arrive during the turn (cards, queued prompts, commands, notes) and after its end (the end line): capped, own scroll. */
.ts-extras,.ts-tail{display:flex;flex-direction:column;gap:8px;max-height:calc(var(--stage-max,60vh) * .4);overflow:auto;scrollbar-width:thin}
.turn-stage.waiting .ts-extras{max-height:calc(var(--stage-max,60vh) * .7)}
.ts-extras>*,.ts-tail>*{flex-shrink:0}
.ts-extras>.bubble.user{max-width:none;margin:0;padding:4px 10px;font-size:13px;line-height:1.45;background:transparent;color:var(--text-2)}
.ts-extras>.bubble.user>.copy-btn{display:none}
.ts-extras>.bubble.user .user-message{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;white-space:normal}
/* Inside the dock's own blur a second backdrop-filter sees nothing: the cards are opaque here (as #commandList is). */
.turn-stage .bubble.question,.turn-stage .bubble.plugin-card{-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
.turn-stage .bubble.question{background:color-mix(in srgb,var(--warn) 7%,var(--bg-panel))}
.turn-stage .bubble.plugin-card{background:color-mix(in srgb,var(--accent) 6%,var(--bg-panel))}
.turn-stage .bubble.plugin-card.warn{background:color-mix(in srgb,var(--warn) 7%,var(--bg-panel))}
.ts-answer{display:flex;flex-direction:column;gap:8px}
.ts-answer>.bubble.output{border-left:0;background:transparent;border:0;padding:0}
.ts-answer>.bubble.output>.copy-btn{top:0;right:0}
/* The cloud: one chip (steps, calls, a tick per call), the turn view's block behind it. */
.ts-cloud{display:flex;flex-direction:column;gap:6px}
.ts-chip{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:9px;background:transparent;color:var(--text-muted);text-align:left}
.ts-chip:hover:not(:disabled){filter:none;background:var(--bg-hover)}
.ts-chip-label{font-size:12.5px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.ts-chip-label::before{content:"\25B8  ";color:var(--accent)}
.ts-cloud.open .ts-chip-label::before{content:"\25BE  "}
/* One row whatever the count (the stage's height stays): the newest ticks show, the oldest are cut on the left. */
.ts-ticks{display:flex;flex-wrap:nowrap;justify-content:flex-end;overflow:hidden;gap:2px;flex:0 1 auto;min-width:0}
.ts-tick{flex:none}
.ts-tick{width:5px;height:12px;border-radius:1.5px;background:var(--text-faint);opacity:.55;cursor:pointer}
.ts-tick.exec{background:var(--think);opacity:.85}
.ts-tick.edit{background:var(--ok);opacity:.85}
.ts-tick.other{background:var(--accent);opacity:.7}
.ts-tick.error{background:var(--danger);opacity:1}
.ts-tick.running{background:var(--warn);opacity:1;animation:ts-blink 1s ease-in-out infinite}
@keyframes ts-blink{50%{opacity:.35}}
.ts-cloud-body{max-height:calc(var(--stage-max,60vh) * .62);overflow:auto;scrollbar-width:thin;border-left:1px solid var(--border);margin-left:6px;padding-left:10px}
.ts-cloud-body[hidden]{display:none}
.turn-stage .turn-work{border:0;background:transparent;padding:0;border-radius:0}
.turn-stage .turn-work>summary{display:none}
.turn-stage .ts-cloud-body .gen:first-of-type{margin-top:0;border-top:0}
@media(max-width:600px){
  .ts-status{padding-left:10px}
  .ts-scroll{padding:8px 10px 10px}
  .ts-defer{display:none}
  .ts-trail-item{max-width:24ch}
}
@media (prefers-reduced-motion:reduce){.turn-stage.enter,.ts-arrive,.ts-headline.fresh,.ts-tick.running,.ts-mark{animation:none}.turn-stage.leaving{transition:none}}
#infoBar{display:flex;padding:8px 14px 10px;border-top:1px solid var(--glass-border);background:transparent;border-radius:0 0 16px 16px;color:var(--text-2);gap:10px;align-items:flex-start;flex-wrap:wrap;flex-shrink:0;transition:opacity 280ms ease}
#infoBar.visible{display:flex}
#infoBar .info{flex:1;min-width:0;font-size:13px;line-height:1.4;word-break:break-word;display:flex;flex-direction:column;gap:2px}
#infoBar .meta{font-size:11px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#infoBar .meta .id{font-family:ui-monospace,monospace;font-weight:700;font-size:12px;color:var(--accent)}
#infoBar .meta .copy-attach{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--bg-raised);color:var(--text-2);border:1px solid var(--border-strong)}
#infoBar .meta .copy-attach:hover{color:#fff;border-color:var(--border-strong)}
#infoBar .meta .status{font-size:11px;padding:2px 6px;border-radius:999px}
#infoBar .meta .dir{font-family:ui-monospace,monospace;font-size:11px;color:var(--text-muted);word-break:break-all}
/* The footer sits on the card's glass: its chips are tinted, not solid, so the glass reads through them. */
#infoBar .meta .model{font-size:11px;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--bg-hover) 55%,transparent);color:var(--text-3)}
/* The memory chip ("mem 2", when the session used some): phones only, where the "mem: …" line is hidden. */
#infoBar .meta .mem-chip{display:none}
#infoBar .meta .model.served-mismatch{background:var(--warn-bg);color:var(--warn-bright);border:1px solid var(--warn-border)}
/* The open session's worker runs an older chi: its version, and Restart when it can. */
#infoBar .meta .worker-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:2px 2px 2px 6px;border-radius:6px;background:var(--warn-bg);color:var(--warn-bright);border:1px solid var(--warn-border);white-space:nowrap}
#infoBar .meta .worker-badge:not(:has(button)){padding-right:6px}
#infoBar .meta .worker-restart{padding:1px 8px;border-radius:5px;font-size:11px;font-weight:600;background:var(--bg-raised);color:var(--warn-bright);border:1px solid var(--warn-border)}
#infoBar .meta .worker-restart:hover:not(:disabled){background:var(--warn-border);color:#fff}
#infoBar .meta .worker-restart:disabled{opacity:.7;cursor:default}
#infoBar .preview-line{font-size:13px;word-break:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;line-height:1.4;max-height:2.8em}
#infoBar .preview-line .preview, #infoBar .preview-line .mem{word-break:break-word}
#infoBar .mem{font-size:12px;color:var(--text-muted)}
#infoBar button{padding:4px 12px;border-radius:8px;font-size:12px;font-weight:600}
#infoBar #infoStopBtn{background:var(--bg-raised);color:var(--warn-text);border:1px solid var(--border-strong)}
#infoBar #infoStopBtn:hover{background:var(--warn-bg);border-color:var(--warn-border)}
#infoBar #infoArchiveBtn{background:transparent;color:var(--text-muted);border:1px solid var(--border-strong)}
#infoBar #infoArchiveBtn:hover{color:var(--text);background:var(--bg-hover)}
#infoBar #infoDeleteBtn{background:transparent;color:var(--text-muted);border:1px solid transparent}
#infoBar #infoDeleteBtn:hover{color:#fff;background:var(--danger-bg);border-color:var(--danger-bg)}
/* Phones: the footer is one line; its meta scrolls sideways (all of it stays reachable) and the first-message line, the strip card's title, goes. */
@media(max-width:600px){
  /* The key hint: cut off at this width, and phones have no Shift+Enter. */
  #composeHint{display:none}
  #infoBar{flex-wrap:nowrap;align-items:center;gap:6px;padding:6px 10px 8px}
  #infoBar .preview-line{display:none}
  /* No terminal on a phone to attach from. */
  #infoBar .meta .copy-attach{display:none}
  #infoBar .meta{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
  #infoBar .meta::-webkit-scrollbar{display:none}
  #infoBar .meta>*{flex-shrink:0}
  #infoBar .meta .id{order:-2}
  #infoBar .meta .status{order:-1}
  /* After the status (same order, later in the DOM): the meta scrolls, and only its start is in sight. */
  #infoBar .meta .mem-chip{display:inline;order:-1}
  #infoBar .meta .dir{word-break:normal}
  #infoBar button{padding:4px 8px}
}
#empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--text-muted);padding:24px;text-align:center;background:color-mix(in srgb,var(--bg) 35%,transparent);z-index:1}
#empty.hidden{display:none !important}
/* Start page (no session): the composer alone, centered; no info bar. */
body:not(.has-session) #center{justify-content:safe center;background:transparent}
body:not(.has-session) #stage{flex:0 0 auto;min-height:0;background:transparent}
body:not(.has-session) #history,body:not(.has-session) #markdownWarning{display:none}
body:not(.has-session) #empty{position:static;background:transparent;padding:0}
body:not(.has-session) #dock{width:min(720px,calc(100% - 32px));margin:0 auto}
body:not(.has-session) #infoBar{display:none}
#notice{width:min(720px,calc(100% - 32px));margin:0 auto 12px;padding:8px 12px;border:1px solid var(--border-strong);border-radius:8px;color:var(--text-muted);font-size:13px;text-align:center}
body.has-session #notice{display:none}
#topBar{display:flex;align-items:center;gap:12px;margin-bottom:-6px}
#newBtn.brand{background:transparent;border:0;padding:2px 4px;min-height:0;display:inline-flex;align-items:baseline;gap:10px;color:var(--text)}
#newBtn .brand-name{font-size:18px;font-weight:700;letter-spacing:.02em;color:var(--accent)}
#newBtn .brand-new{font-size:12px;color:var(--text-muted);display:none}
body.has-session #newBtn .brand-new{display:inline}
#newBtn:hover .brand-new{color:var(--text-2)}
.strip-side{display:flex;flex-direction:column;gap:6px;min-width:0}
/* The scope chip: "<project> · all", or "all projects" and where a new chat starts (start page only). */
#scope{display:inline-flex;align-items:center;gap:8px;min-width:0;font-size:12px;color:var(--text-muted)}
#scope[hidden]{display:none}
#scope .scope-name{flex-shrink:0;padding:2px 9px;border:1px solid var(--border-strong);border-radius:999px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
#scope .scope-name.error{color:var(--warn-text);border-color:var(--warn-border)}
#scope .scope-all{color:var(--text-muted);text-decoration:none}
#scope .scope-all:hover{color:var(--accent);text-decoration:underline}
#scope .scope-where{display:inline-flex;gap:5px;min-width:0;white-space:nowrap;font-size:11px}
/* The path cuts on the left, so its last folders stay in view. */
#scope .scope-where .path{overflow:hidden;text-overflow:ellipsis;direction:rtl;min-width:0;font-family:ui-monospace,monospace}
body.has-session #scope .scope-where{display:none}
/* A phone has no room for both; the hidden strip's pill (count, live) wins. */
@media(max-width:600px){body.strip-hidden #scope .scope-where{display:none}}
/* A phone's top bar stays one row: "chi +" (the rest of "+ new chat" goes),
   tighter gaps, nothing wraps, and the "← project" link cuts with an
   ellipsis before the pill does. */
@media(max-width:600px){
  #topBar{gap:8px}
  #scope{gap:6px}
  #newBtn .brand-new-word{display:none}
  #newBtn .brand-new,#scope .scope-back{white-space:nowrap}
  #scope .scope-back{min-width:0;overflow:hidden;text-overflow:ellipsis}
  #stripShow{padding:3px 8px}
  #newBtn .brand-new{font-size:16px}
}
/* The ▾ glyph draws tiny at the pill's 11 px: at 20 px it is about as tall
   as the pill text's capitals (phone and desktop alike). */
/* The bell (notifications): quiet at the top bar's right end; filled in the accent when on, struck through when the browser blocks it. */
#notifyBtn{margin-left:auto;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;min-height:0;background:transparent;border:1px solid transparent;border-radius:999px;color:var(--text-muted)}
#notifyBtn[hidden]{display:none}
#notifyBtn:hover{color:var(--text-2);border-color:var(--border)}
#notifyBtn svg{fill:none;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
#notifyBtn .slash{display:none}
#notifyBtn[data-state="on"]{color:var(--accent)}
#notifyBtn[data-state="on"] .bell{fill:currentColor;fill-opacity:.22}
#notifyBtn[data-state="denied"]{color:var(--text-faint)}
#notifyBtn[data-state="denied"] .slash{display:inline}
#stripShow .pill-arrow{font-size:20px;line-height:0;vertical-align:-3px}
.card .folder{font-family:ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--text-3)}
.card .parent{font-family:ui-monospace,monospace;white-space:nowrap;color:var(--text-3)}
#infoBar .meta a.parent{text-decoration:none}
#infoBar .meta a.parent:hover{color:var(--accent)}
.scope-error{grid-column:1/-1;font-size:13px;color:var(--warn-text)}
.strip-toggle{font-size:11px;padding:3px 10px;background:transparent;color:var(--text-muted);border:1px solid var(--border);border-radius:999px}
.strip-toggle:hover{color:var(--text-2);border-color:var(--border-strong)}
#stripShow{display:none;white-space:nowrap;flex-shrink:0}
#stripShow .live{color:var(--ok-text);white-space:nowrap}
#stripShow .live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:4px;vertical-align:1px}
#stripShow .waiting{color:var(--warn-text);white-space:nowrap}
#stripShow .waiting-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:4px;vertical-align:1px}
#stripHide{align-self:flex-end;border:0;padding:0 2px;border-radius:4px}
#stripHide:hover{text-decoration:underline;color:var(--text-2)}
/* A narrow window's strip scrolls sideways, which puts its own "hide ▴" out of sight: the top bar has it instead, where the pill comes back, with a finger-sized target. */
#stripHideTop{display:none;white-space:nowrap;flex-shrink:0}
@media(max-width:900px){
  body:not(.strip-hidden):not(.all-view) #stripHideTop{display:block}
  #stripHide{display:none}
  #stripHideTop,#stripShow{min-height:30px;padding:4px 12px;font-size:12px}
}
body.strip-hidden #stripShow{display:block}
body.strip-hidden #topStrip, body.all-view #stripShow{display:none}
#allTile{flex:1;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;color:var(--text-2);font-size:13px;font-weight:600;width:100%}
#allTile .count{font-size:11px;font-weight:400;color:var(--text-muted)}
#allView{display:none;flex:1;min-height:0;flex-direction:column;gap:12px}
body.all-view #allView{display:flex}
body.all-view #center, body.all-view #topStrip{display:none}
#allHead{display:flex;gap:8px;align-items:center}
/* The search field is glass too (no shadow: it is a field, not a card); the focus ring below replaces the highlight. */
#allHead input{flex:1;min-width:0;background:var(--glass-bg);-webkit-backdrop-filter:blur(18px) saturate(1.35);backdrop-filter:blur(18px) saturate(1.35);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-highlight);color:var(--text);padding:8px 10px;border-radius:8px}
#allHead input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
#allPath{font-size:11px;color:var(--text-muted);margin-top:-4px;word-break:break-all}
#allPath[hidden]{display:none}
#allPath code{font-family:ui-monospace,monospace;background:var(--bg-hover);padding:1px 4px;border-radius:4px}
#allHead .count{font-size:11px;color:var(--text-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
#allHead .include-archived{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-muted);white-space:nowrap;cursor:pointer;user-select:none}
.card.archived{opacity:.6}
.card.archived:hover{opacity:.85}
.card .archived-badge{font-size:10px;padding:1px 6px;border-radius:6px;border:1px solid var(--border-strong);color:var(--text-muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;z-index:50;display:flex;gap:12px;align-items:center;padding:8px 14px;border-radius:10px;background:var(--bg-raised);color:var(--text);border:1px solid var(--border-strong);box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:13px}
#toast[hidden]{display:none}
#toast .toast-action{background:transparent;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:2px 4px}
#toast .toast-close{background:transparent;border:0;color:var(--text-muted);cursor:pointer;padding:2px 4px;margin-left:-6px}
#toast .toast-close:hover{color:var(--text)}
#allList{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;align-content:start;padding:2px}
.card.skeleton{pointer-events:none;border-style:dashed;opacity:.9;animation:skeleton-pulse 1.2s ease-in-out infinite}
.card.skeleton .line{height:10px;background:var(--bg-raised);border-radius:6px}
.card.skeleton .line.long{width:78%}
.card.skeleton .line.tiny{width:30%;height:8px}
@keyframes skeleton-pulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
#topStrip:not(.loading) .card, #allList .card{animation:fadeIn .28s ease}
.card{padding:12px;border-radius:10px;background:var(--bg-panel);border:1px solid var(--border);cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:72px}
.card:hover{border-color:var(--border-strong);background:var(--bg-hover)}
#allList .card{position:relative}
.card-del{position:absolute;top:6px;right:6px;padding:2px 7px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--text-muted);font-size:12px;line-height:1.2;cursor:pointer;opacity:0;transition:opacity .15s}
#allList .card:hover .card-del, .card-del:focus-visible{opacity:1}
.card-del:hover{color:#fff;background:var(--danger-bg);border-color:var(--danger-bg)}
@media (hover:none){.card-del{opacity:1}}
.card.active{background:var(--accent-bg);border-color:var(--accent-border)}
.card .preview{font-size:14px;line-height:1.4;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .time{font-variant-numeric:tabular-nums;white-space:nowrap}
.card .ctx{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text-3)}
#topStrip .card .preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#allList .card .preview{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;word-break:break-word;line-height:1.4}
.card .recap{font-size:12px;line-height:1.4;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:-2px 0 2px}
.card .meta{font-size:11px;color:var(--text-muted);display:flex;gap:6px;align-items:center}
/* A card's status is a dot (its word is the tooltip); the .status.* pills below are the info bar's. */
.card .dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--text-muted)}
.card .dot.running{background:var(--ok);animation:dot-pulse 1.6s ease-in-out infinite}
.card .dot.idle{background:var(--text-muted)}
.card .dot.stopped{background:transparent;border:1px solid var(--text-faint)}
.card .dot.completed{background:var(--accent)}
.card .dot.error{background:var(--danger)}
@keyframes dot-pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 0%,transparent)}}
.card .dot.waiting{background:var(--warn);animation:attn-pulse 1.6s ease-in-out infinite}
@keyframes attn-pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--warn) 60%,transparent)}50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 0%,transparent)}}
@media (prefers-reduced-motion:reduce){.card .dot.running,.card .dot.waiting{animation:none}}
.card .attn{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap;flex-shrink:0;background:var(--warn-bg);color:var(--warn-text);border:1px solid var(--warn-border)}
.status.running{background:var(--ok-bg);color:var(--ok-text)}
.status.idle{background:var(--bg-raised)}
.status.completed{background:var(--accent-bg);color:var(--accent)}
.status.error{background:var(--danger-bg-dim);color:var(--danger-text)}
.card .owner{font-size:11px;padding:2px 6px;border-radius:999px}
.card .owner.worker{background:var(--ok-bg);color:var(--ok-text)}
.card .owner.tui{background:var(--warn-bg);color:var(--warn-text)}
@media(max-width:900px){
  #topStrip{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:72%;overflow-x:auto;min-height:0}
  #topStrip #allTile{width:auto}
}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <div id="topBar">
    <button type="button" id="newBtn" class="brand" title="New chat"><span class="brand-name">chi</span><span class="brand-new">+<span class="brand-new-word"> new chat</span></span></button>
    <div id="scope" hidden></div>
    <button type="button" class="strip-toggle" id="stripShow" title="Show the latest sessions"><span class="pill-arrow" aria-hidden="true">▾</span> sessions</button>
    <button type="button" class="strip-toggle" id="stripHideTop" title="Hide the latest sessions"><span class="pill-arrow" aria-hidden="true">▴</span> hide</button>
    <button type="button" id="notifyBtn" aria-label="Notifications" aria-pressed="false" hidden><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path class="bell" d="M8 1.75a4 4 0 0 0-4 4v2.6L2.75 10.6v.9h10.5v-.9L12 8.35v-2.6a4 4 0 0 0-4-4Z"/><path class="clapper" d="M6.5 13a1.5 1.5 0 0 0 3 0"/><path class="slash" d="M2.5 2.5l11 11"/></svg></button>
  </div>
  <section id="topStrip" aria-label="Latest sessions" class="loading"><div class="card skeleton"><div class="line long"></div><div class="meta"><span class="line tiny" style="display:inline-block"></span></div></div><div class="card skeleton"><div class="line long"></div><div class="meta"><span class="line tiny" style="display:inline-block"></span></div></div><div class="card skeleton"><div class="line long"></div><div class="meta"><span class="line tiny" style="display:inline-block"></span></div></div></section>
  <section id="center">
    <div id="firstPeek"></div>
    <div id="stage">
      <div id="markdownWarning" class="markdown-warning" hidden></div>
      <div id="history"></div>
      <div id="empty"></div>
      <div id="notice" role="status" hidden></div>
    </div>
    <div id="lightbox" hidden><img alt=""></div>
    <div id="dock">
      <div id="initRow" role="status" aria-live="polite" hidden></div>
      <div id="composer" style="position:relative">
        <div id="commandList" role="listbox" aria-label="Commands" hidden></div>
        <div id="modelPanel" hidden>
          <label class="model-search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14" stroke-linecap="round"/></svg><input id="modelSearch" type="text" placeholder="Search models" autocomplete="off" spellcheck="false" role="combobox" aria-label="Search models" aria-autocomplete="list" aria-controls="modelList" aria-expanded="false"></label>
          <div id="modelList" role="listbox" aria-label="Models"></div>
        </div>
        <div id="composeGrip" title="Drag to make the message box taller (double-click resets)"></div>
        <div class="compose-col">
          <div id="chips" hidden></div>
          <textarea id="prompt" placeholder="Ask chi anything…" aria-controls="commandList" aria-autocomplete="list" aria-expanded="false"></textarea>
        </div>
        <div class="actions-col">
          <button type="button" id="modelPick" class="model-pick" title="The model the new chat starts on" aria-label="Model for the new chat" aria-haspopup="listbox" aria-expanded="false" hidden><span class="model-pick-name"></span></button>
          <div id="composeHint">Enter to start · Shift+Enter for a newline</div>
          <button id="cancelBtn" title="Cancel the running turn, whoever sent it" style="display:none">Cancel</button>
          <div class="split">
            <button id="actionBtn">Start</button>
          </div>
        </div>
      </div>
      <div id="infoBar">
        <div class="info" id="infoText"></div>
        <button class="ghost" id="infoArchiveBtn" title="Archive: hide from the lists, keep for good" style="display:none">archive</button>
        <button class="ghost" id="infoStopBtn" title="Stop session (terminate worker)" style="display:none">stop</button>
        <button class="ghost" id="infoDeleteBtn" title="Delete session (for good)" style="display:none">delete</button>
      </div>
    </div>
  </section>
  <section id="allView" aria-label="All sessions">
    <div id="allHead">
      <button class="ghost" id="allBack" title="Back to the chat (Esc)">← Back</button>
      <input id="filter" type="search" placeholder="Search… (preview / id / status)" autocomplete="off">
      <label class="include-archived" title="Show archived sessions too"><input id="includeArchived" type="checkbox"> include archived</label>
      <span class="count" id="count"></span>
    </div>
    <div id="allPath" hidden>Stored in <code></code></div>
    <div id="allList"></div>
  </section>
</main>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
