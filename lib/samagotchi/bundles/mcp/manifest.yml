---
name: mcp
version: 0.9.0
scope: system
description: "Tools from MCP servers (stdio or HTTP): each server in config.yml bundles: mcp: servers: runs for the session; their tools go into chi's tool index: the model searches them with find_tools and calls one with call_tool (<server>/<tool>); /mcp lists them"
trust_level: reviewed
files: {}
plugin:
  file: plugin.rb
  sha256: sha256:1a964401747e15e6b34ddbd1290da990350bfd715d43921453d5676756bee4dd
  # Loaded in this order, before plugin.rb (HttpClient's errors subclass Client's).
  parts:
    client.rb: sha256:19fcca8ded80d45bdfb75715a8c14ac16fb6edae9aa49a5bb99619a021378fdf
    http_client.rb: sha256:b2a4b903b8557312df019a99a5d3a38e621984e7b11bf6d9241d80a8b95ddf71
    content.rb: sha256:28461822ea1181c3abe790d3f01391babe6b1d974d4606117c42ba1da209b132
# 0.67.0 is the release with chi.tool_source (the core tool index the bundle publishes into).
requires_chi: ">= 0.143.0"
# ctx.http.stream (the HTTP transport) and plugin: parts:; release:bump raises requires_chi.
requires_chi_next: true
# config.yml bundles: mcp: (another key warns; an older chi ignores this)
settings: [servers, timeout, startup_timeout]
