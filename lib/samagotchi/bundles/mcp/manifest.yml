    http_client.rb: sha256:a9202b80439d0e72e2289a2dd435f64fdf13808424be3eb4194047c0893a90db
    oauth.rb: sha256:981c81a861eff8c017c0cb661c9251dc9d1f4c5b3ca183f58fff24f6960e2dc8
    tools.rb: sha256:6ce61e65de42da6542950b9151670afe60286b999e85b4a1914629030a809ccf
    content.rb: sha256:28461822ea1181c3abe790d3f01391babe6b1d974d4606117c42ba1da209b132
