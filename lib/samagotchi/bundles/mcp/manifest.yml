---
name: mcp
version: 0.8.0
scope: system
description: "Tools from MCP servers (stdio): each server in config.yml bundles: mcp: servers: runs for the session; their tools go into chi's tool index: the model searches them with find_tools and calls one with call_tool (<server>/<tool>); /mcp lists them"
trust_level: reviewed
files: {}
plugin:
  file: plugin.rb
  sha256: sha256:60182c825fec959395de822e7c5910a4e6f30aeec5841b887039e72f13e79ac0
# 0.67.0 is the release with chi.tool_source (the core tool index the bundle publishes into).
requires_chi: ">= 0.143.0"
# ctx.http.stream (the HTTP transport); release:bump raises requires_chi.
requires_chi_next: true
# config.yml bundles: mcp: (another key warns; an older chi ignores this)
settings: [servers, timeout, startup_timeout]
