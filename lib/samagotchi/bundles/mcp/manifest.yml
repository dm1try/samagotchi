    http_client.rb: sha256:bb1bd5c9ad78748001f3736a1395dfaee02f9907dd997cd425d42a4a86dae41e
    oauth.rb: sha256:981c81a861eff8c017c0cb661c9251dc9d1f4c5b3ca183f58fff24f6960e2dc8
    tools.rb: sha256:5d998c7e3bb0ed00825c40ccce3d784542b4e7bda02cdd50b6f2acc1a1cbef1a
    content.rb: sha256:28461822ea1181c3abe790d3f01391babe6b1d974d4606117c42ba1da209b132
