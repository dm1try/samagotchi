# Default guardrail rules (the optional guardrails bundle:
# `chi bundle install guardrails`). Text matches on shell commands catch
# accidents, not a determined model: `sh -c`, base64, a script written
# earlier or `git -C` variants can get past them.
#
# Fields: id, tool (a name, a list, or shell = execute + task_create),
# command (Ruby regex), path (outside_repo or a glob), git (outside_repo:
# a shell call runs commit/add/reset/… in another checkout), touches
# (chi_dirs: a shell command names a path in chi's own dirs), skip_read_only
# (true: a command that only reads, ls/cat/rg/sed -n/git log…, doesn't
# match), modes (strict: only with guardrails.mode: strict; untagged rules
# ask in every mode), verdict (ask|deny), reason, scopes (for an ask: once,
# session, repo, rule; default all).
# [^;&|\n]* keeps a match inside one command of a chain; the git rules match
# the subcommand after optional global options (git -C dir push).
rules:
  # ── git: publishing and rewriting history ──────────────────────────────
  - id: git-push
    tool: shell
    command: '\bgit(?:\s+(?:-C\s+\S+|-c\s+\S+|--?[A-Za-z][\w-]*(?:=\S+)?))*\s+push\b'
    verdict: ask
    reason: git push publishes commits
  - id: git-reset-hard
    tool: shell
    command: '\bgit(?:\s+(?:-C\s+\S+|-c\s+\S+|--?[A-Za-z][\w-]*(?:=\S+)?))*\s+reset\b[^;&|\n]*\s--hard\b'
    verdict: ask
    reason: git reset --hard discards uncommitted work
  - id: git-clean-force
    tool: shell
    command: '\bgit(?:\s+(?:-C\s+\S+|-c\s+\S+|--?[A-Za-z][\w-]*(?:=\S+)?))*\s+clean\b[^;&|\n]*\s(-[a-zA-Z]*f|--force)'
    verdict: ask
    reason: git clean -f deletes untracked files
  - id: git-branch-force-delete
    tool: shell
    command: '\bgit(?:\s+(?:-C\s+\S+|-c\s+\S+|--?[A-Za-z][\w-]*(?:=\S+)?))*\s+branch\b[^;&|\n]*\s(-[a-zA-Z]*D|--delete\s+--force|--force\s+--delete)\b'
    verdict: ask
    reason: git branch -D deletes a branch even if it is not merged
  # Strict mode only: a rebase rewrites local history, which the reflog keeps.
  - id: git-rebase
    tool: shell
    command: '\bgit(?:\s+(?:-C\s+\S+|-c\s+\S+|--?[A-Za-z][\w-]*(?:=\S+)?))*\s+rebase\b'
    modes: [strict]
    verdict: ask
    reason: git rebase rewrites history
  - id: git-history-rewrite
    tool: shell
    command: '\bgit(?:\s+(?:-C\s+\S+|-c\s+\S+|--?[A-Za-z][\w-]*(?:=\S+)?))*\s+(filter-branch|filter-repo)\b'
    verdict: ask
    reason: filter-branch / filter-repo rewrite the whole history

  # ── deleting ───────────────────────────────────────────────────────────
  # rm with both -r and -f on an absolute path, ~, $HOME or a path with ..
  # (a text heuristic; rm -rf build/ in the repo is not asked), unless
  # every rm -rf target is inside a tmp dir (rm: outside_tmp; /tmp itself,
  # /tmp/* and a link out of it still ask).
  - id: rm-rf-wide
    tool: shell
    command: '\brm\b(?=[^;&|\n]*\s(-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)(\s|$))(?=[^;&|\n]*\s(-[a-zA-Z]*f[a-zA-Z]*|--force)(\s|$))[^;&|\n]*\s(/|~|\$HOME|\S*\.\.)'
    rm: outside_tmp
    verdict: ask
    reason: rm -rf on a path outside the working tree

  # ── running code from the network ──────────────────────────────────────
  - id: pipe-to-shell
    tool: shell
    command: '\b(curl|wget)\b[^;&\n]*\|\s*(sudo\s+)?(ba|z|da)?sh\b'
    verdict: ask
    reason: runs a script downloaded from the network
  - id: base64-to-shell
    tool: shell
    command: '\bbase64\s+(-d|-D|--decode)\b[^;&\n]*\|\s*(sudo\s+)?(ba|z|da)?sh\b'
    verdict: ask
    reason: runs decoded text as a script

  # ── work outside this session's repo, and git hooks ───────────────────
  # outside_repo: not in the session's repo (its folder outside a repo);
  # tmp dirs and memory files don't count. Strict mode only, as is
  # git-outside-repo; chi's own config and hooks still ask (core protected
  # paths, shell-touches-chi).
  - id: write-outside-repo
    tool: [write, edit]
    path: outside_repo
    modes: [strict]
    verdict: ask
    reason: writes outside this session's repo
  # cd/git -C into another checkout, then commit, add, reset, checkout,
  # switch, rebase, merge, push, stash, rm, mv, cherry-pick, revert, pull,
  # restore or am. Read-only git (status, log, diff) and tests there run.
  # "This call in this repo" would never match again (the command holds
  # the commit message), so it isn't offered: "rule in this repo" is the
  # always-for-here answer.
  - id: git-outside-repo
    tool: shell
    git: outside_repo
    modes: [strict]
    verdict: ask
    scopes: [once, session, rule]
    reason: runs git that changes another checkout, outside this session's repo
  - id: git-hooks-write
    tool: [write, edit]
    path: '**/.git/hooks/**'
    verdict: deny
    reason: git hooks run code on every git command

  # ── chi's own config, hooks, rules and approvals, from the shell ───────
  # The real dirs (config.yml's dir, hooks, the approval store, installed
  # bundles, this repo's git hooks), not a look-alike under /tmp or chi's
  # own lib/samagotchi/hooks source; a word that can't be resolved ($VAR,
  # $(…), a glob) is matched as text. A command that only reads them (ls,
  # cat, rg, sed -n) isn't asked about.
  - id: shell-touches-chi
    tool: shell
    touches: chi_dirs
    skip_read_only: true
    verdict: ask
    reason: the command names chi's config, hooks, guardrails or git hooks

  # ── answering chi's own questions around chi answer ───────────────────
  # A parent agent answers a child's approval with chi answer, which holds it
  # to guardrails.parent_approvals. These shapes go around that: chi --attach
  # or chi -p with stdin from a pipe, a here-string or a file (a chi after 0.12 treats
  # those as a parent too, but an older child doesn't), and a POST to the
  # Bridge's or the web's answer route.
  - id: chi-answer-piped
    tool: shell
    command: '(\|[^;&|\n]*\bchi\s([^;&|\n]*\s)?(--attach|--prompt|-p)\b|\bchi\s([^;&|\n]*\s)?(--attach|--prompt|-p)\b[^;&|\n]*<)'
    verdict: ask
    scopes: [once, session]
    reason: answers chi's questions from a pipe or a file, around chi answer
  - id: chi-answer-http
    tool: shell
    command: '\b(curl|wget|http|xh)\b[^;&|\n]*/answer\b'
    verdict: ask
    scopes: [once, session]
    reason: posts an answer to a chi session's question directly, around chi answer
