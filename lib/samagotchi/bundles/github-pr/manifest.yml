---
name: github-pr
version: 0.6.0
scope: system
description: Proposes the branch's open GitHub pull request to a session, attached once you mention it (#N, the branch or its URL), and attaches any PR URL with chi context add or the web's "+ URL"; the agent gets a note when reviews, comments, checks or its state change; in the web, a path:line in an answer links to that line of the PR; the auto_attach setting can attach the PR at once instead, or do nothing
trust_level: reviewed
requires_chi: ">= 0.61.0"
requires_chi_next: ctx.context.propose, candidates and ctx.review
needs:
- command: gh
  why: reads the pull request
  hint: brew install gh, then gh auth login
plugin:
  file: plugin.rb
  sha256: sha256:558bd4191f28b7c54d4521f55e8514a63568d5e2df5a4937856821fd88de508f
scripts:
  pr_context.rb: sha256:a883d2780e89c68c0d7b6d5e0fcb22c273f17bb167e79064e0e99db6bd2ee6f0
context_providers:
- match: '\Ahttps://github\.com/([^/\s]+)/([^/\s]+)/pull/(\d+)'
  name: 'pr-\3'
  cmd: '{ruby} {bundle_dir}/scripts/pr_context.rb {url}'
  why: GitHub PR
  every_seconds: 300
