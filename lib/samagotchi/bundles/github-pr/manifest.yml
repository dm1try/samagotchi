---
name: github-pr
version: 0.2.0
scope: system
description: Attaches the branch's open GitHub pull request to a session as context (and any PR URL with chi context add or the web's "+ URL"); the agent gets a note when reviews, comments, checks or its state change; in the web, a path:line in an answer links to that line of the PR
trust_level: reviewed
requires_chi: ">= 0.32.0"
needs:
- command: gh
  why: reads the pull request
  hint: brew install gh, then gh auth login
plugin:
  file: plugin.rb
  sha256: sha256:f8b9794f84681f3a16a4d49da3b857a59fec3ccdc2d0a2b16d1192fd2a26bdf3
scripts:
  pr_context.rb: sha256:a883d2780e89c68c0d7b6d5e0fcb22c273f17bb167e79064e0e99db6bd2ee6f0
context_providers:
- match: '\Ahttps://github\.com/([^/\s]+)/([^/\s]+)/pull/(\d+)'
  name: 'pr-\3'
  cmd: '{ruby} {bundle_dir}/scripts/pr_context.rb {url}'
  why: GitHub PR
  every_seconds: 300
