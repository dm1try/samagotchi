---
name: github-pr
version: 0.1.0
scope: system
description: Attaches the branch's open GitHub pull request to a session as context (and any PR URL with chi context add or the web's "+ URL"); the agent gets a note when reviews, comments, checks or its state change
trust_level: reviewed
# requires_chi: set at the release that has context providers and ctx.context (">= 0.32.0"; docs/releasing.md)
needs:
- command: gh
  why: reads the pull request
  hint: brew install gh, then gh auth login
plugin:
  file: plugin.rb
  sha256: sha256:b825731983a402d0cd006a17236794ef03e31ab1b160e853756f4d63b295f664
scripts:
  pr_context.rb: sha256:a883d2780e89c68c0d7b6d5e0fcb22c273f17bb167e79064e0e99db6bd2ee6f0
context_providers:
- match: '\Ahttps://github\.com/([^/\s]+)/([^/\s]+)/pull/(\d+)'
  name: 'pr-\3'
  cmd: '{ruby} {bundle_dir}/scripts/pr_context.rb {url}'
  why: GitHub PR
  every_seconds: 300
