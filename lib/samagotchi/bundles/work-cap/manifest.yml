---
name: work-cap
version: 0.1.0
scope: system
description: "A per-session work cap (tool calls, active minutes) across turns: at a cap the turn pauses on Continue (another cap's worth) / Stop with the session's totals, a warning at 80% goes to the user only; /workcap shows or sets it"
trust_level: reviewed
plugin:
  file: plugin.rb
  sha256: sha256:d4de4b835d1657223517f3d6a5d8a9b089b7c8fad08ed077f72748369323bd65
# ask_user's effects: are in chi 0.92.0; ctx.usage is new in the next chi
requires_chi: ">= 0.100.0"
# chi --set work-cap.tool_calls=400 / work-cap.minutes=60: the session's own caps, a number or off
session_settings: {tool_calls: number, minutes: number}
