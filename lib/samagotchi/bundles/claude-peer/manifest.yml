# The plugin needs Samagotchi::Plugin::Peer and chi.peer_source (chi 0.67.0).
# An agreeing answer's closing wake (the skills say an OK wakes chi once)
# and the plugin's OUTBOX (Plugin::Peer's rename of REVIEW) need chi 0.70.0.
# The skill's `re` (the answered send) needs nothing newer: an older chi
# ignores the unknown key, and sends no `ref:` line for the skill to echo.
requires_chi: ">= 0.70.0"
# The memory and the tool's words say a peer's note holds its text (chi's
# ContextAbsorber peer block), which the next chi adds.
