# The timing cops alone, for `rake lint:timing[PATHS]` (run from the repo
# root): .rubocop.yml keeps them off, so `rake lint` stays quiet while specs
# still carry what they flag. This file goes when the cops turn on in
# .rubocop.yml.
inherit_from: ../.rubocop.yml

# Include again: RuboCop rebases an inherited Include onto this file's folder
# (../spec/**/*) but matches a config not named .rubocop.yml against the
# working directory, so the inherited patterns match nothing. The Excludes
# are inherited as absolute paths and work.
Samagotchi/SpecSleep:
  Enabled: true
  Include:
    - spec/**/*
    - lib/samagotchi/bundles/*/spec/**/*

Samagotchi/SilentWait:
  Enabled: true
  Include:
    - spec/**/*
    - lib/samagotchi/bundles/*/spec/**/*
